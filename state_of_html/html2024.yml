  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2024.patrick_brosset.bio
    t: Chef de produit dans l'équipe Edge chez Microsoft
  - key: conclusion.html2024.patrick_brosset
    t: >
      Nous avons tendance à tenir HTML pour acquis et à le considérer comme presque achevé. Pourtant, ses éléments et fonctionnalités de navigateur ont énormément évolué au fil des ans et continuent de le faire. Les architectures privilégiant HTML gagnent du terrain, et nous disposons désormais des capacités nécessaires pour les construire correctement. Le moment n'a jamais été aussi propice pour être développeur HTML.

      Il reste toutefois beaucoup à faire. De nouveaux problèmes apparaissent sans cesse et la plateforme doit répondre à de nouveaux besoins.

      ### Ajouter de nouvelles fonctionnalités…

      De nouveaux éléments HTML, comme les tableaux de données, les onglets ou les interrupteurs, sont vivement souhaités. Il faut toutefois trouver le juste équilibre entre des composants complexes qui font tout et des primitives plus simples, mais robustes et faciles à styliser, sur lesquelles construire.

      ### …tout en améliorant ceux qui existent déjà

      Il est également important de continuer à améliorer l'existant. Des fonctionnalités comme `<select>`, les champs de date et d'heure `<input>` ou `<details>` ne sont pas toujours assez faciles à styliser et à personnaliser, tandis que d'autres, comme CSP ou le Shadow DOM, sont trop complexes à utiliser.

      L'accessibilité est désormais mieux reconnue comme une responsabilité des développeurs et des organisations, mais elle reste difficile à tester et complexe à améliorer.

      ### Compatibilité des navigateurs

      À cela s'ajoute la compatibilité et l'interopérabilité des fonctionnalités HTML, qui restent un obstacle majeur pour les développeurs web. La prise en charge d'anciennes versions de navigateurs est pénible. Cette année, les résultats montrent que le problème concerne particulièrement les nouvelles fonctionnalités comme Popover, le positionnement par ancre et les transitions de vue multipage, mais aussi `<dialog>` et les PWA. Ces fonctionnalités sont adoptées et les développeurs ont besoin qu'elles fonctionnent partout.

      ### Le défi de rester à jour

      Oui, il reste du travail, mais les choses _avancent_. Elles avancent même si vite qu'il peut être difficile de rester informé. Des ressources comme MDN, Caniuse.com, Web.dev ou le site du W3C sont d'une aide précieuse, mais il y a encore de la place pour davantage d'outils permettant de suivre le rythme.

      D'un autre côté, parler trop tôt de nouvelles fonctionnalités peut frustrer les développeurs qui ne peuvent pas encore les utiliser. Il est donc important de maintenir des données de qualité sur la plateforme, comme [browser-compat-data](https://github.com/mdn/browser-compat-data/) et [web-features](https://github.com/web-platform-dx/web-features/), qui permettent de présenter les fonctionnalités de manière plus utile aux développeurs.

      ### Un avenir prometteur pour HTML

      Pour conclure, il est réconfortant de constater que la plupart des répondants estiment que l'interopérabilité pose aujourd'hui beaucoup moins de problèmes qu'auparavant, avec des progrès nets ces dernières années. Grâce aux nouvelles capacités disponibles, il devient de plus en plus facile de créer des interfaces privilégiant HTML, performantes, accessibles et interactives. On peut ainsi limiter JavaScript aux cas où il est vraiment nécessaire et laisser les serveurs web et les navigateurs communiquer comme prévu : avec HTML !

  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: faq.how_long_will_survey_take_html2024
    t: Combien de temps faut-il pour répondre à l'enquête ?
  - key: faq.how_long_will_survey_take_html2024.description
    t: >
      Selon le nombre de questions auxquelles vous répondez (elles peuvent toutes être ignorées),
      remplir l'enquête devrait prendre environ 10 à 15 minutes.

  - key: faq.learn_more_html2024
    t: Où puis-je en savoir plus ?
  - key: faq.learn_more_html2024.description
    t: Vous trouverez plus d'informations sur cette enquête dans [notre article d'annonce](https://dev.to/sachagreif/the-state-of-html-2024-survey-is-now-open-3i4j).

  - key: faq.survey_design_html2024
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_html2024.description
    t: >
      Cette enquête a été conçue à l'issue d'un [processus de conception ouvert](https://github.com/Devographics/surveys/issues/246), auquel ont participé des éditeurs de navigateurs et la communauté du développement web.

  - key: faq.results_released_html2024
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_html2024.description
    t: L'enquête se déroulera du 12 septembre au 1er octobre 2024 et ses résultats seront publiés peu après.

  - key: faq.who_should_take_survey_html2024
    t: Qui peut répondre à cette enquête ?
  - key: faq.who_should_take_survey_html2024.description
    t: >
      Cette enquête est ouverte à toute personne qui crée des sites ou applications web, régulièrement ou occasionnellement, dans le cadre de son travail, de ses études ou simplement pour le plaisir !

  - key: faq.data_used_html2024
    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_html2024.description
    t: >
      Toutes les données recueillies seront publiées librement afin que les développeurs et les entreprises puissent les consulter.
      Les éditeurs de navigateurs [utilisent également ces données](https://web.dev/blog/interop-2024) pour définir leurs priorités et orienter leurs feuilles de route.

  - key: faq.survey_goals_html2024
    t: Quels sont les objectifs de l'enquête ?
  - key: faq.survey_goals_html2024.description
    t: >
      L'enquête vise à mesurer la connaissance des nouvelles fonctionnalités HTML et API de navigateur, et à aider les développeurs à suivre l'évolution de leur utilisation.

  - key: about.content.html2024
    t: |
      L'enquête State of HTML 2024 s'est déroulée du 12 septembre au 5 novembre 2024 et a recueilli 5 402 réponses.

      L'enquête a été conçue de manière collaborative dans le cadre d'[une discussion publique sur GitHub](https://github.com/Devographics/surveys/issues/246) et des réunions du [WebDX Community Group](https://www.w3.org/groups/cg/webdx/).

      L'infrastructure de l'enquête est gérée par [Sacha Greif](https://sachagreif.com/) et [Eric Burel](https://www.lbke.fr/), avec l'aide de contributeurs open source et de consultants.

      Le logo et le T-shirt de cette année ont été conçus par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l'enquête

      Cette enquête vise à identifier les tendances émergentes de l'écosystème du développement web afin d'aider les développeurs à faire leurs choix technologiques.

      Elle cherche donc à anticiper les évolutions des prochaines années plutôt qu'à analyser les tendances actuelles ; c'est pourquoi les fonctionnalités ou technologies les plus répandues ne sont pas toujours incluses.

      Elle doit également être considérée comme un **instantané d'un sous-ensemble précis de développeurs** et ne prétend pas représenter l'ensemble de l'écosystème.

      L'enquête était librement accessible en ligne, sans filtrage ni sélection des répondants.

      ### Financement du projet

      Le projet est financé par plusieurs sources :

      - **Ventes de T-shirts**.

      - **Liens sponsorisés** : les liens vers les ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Autres financements** : [Google](https://www.google.com/) et [TokyoDev](https://www.tokyodev.com/) ont également financé l'enquête.

      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) un aperçu technique plus détaillé du fonctionnement des enquêtes.
