locale: fr-FR
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2024 de l'enquête annuelle sur les dernières tendances de l'écosystème HTML.

  - key: general.html2024.survey_intro
    t: |

      HTML est la technologie fondatrice du Web, et il est assez remarquable qu'elle soit plus pertinente que jamais, trois décennies plus tard.

      Malgré son nom, cette enquête dépasse largement le seul HTML pour couvrir l'ensemble de la plateforme web, et il y a *beaucoup* à aborder !

      Comme vous pouvez l'imaginer, concevoir une telle enquête implique toujours des choix difficiles. Cette année, nous avons choisi de nous concentrer sur les fonctionnalités nouvelles ou à venir pour vous aider à rester à jour, ainsi que sur les sujets qui intéressent le plus les éditeurs de navigateurs.

      Vos réponses pourraient donc avoir un impact direct sur la feuille de route du navigateur que vous utilisez actuellement. C'est pourquoi je suis ravi de lancer cette deuxième édition de l'enquête State of HTML !

  - key: features.features_intro_html2024
    t: |
      Bienvenue dans l'enquête ! Cette première partie porte sur votre expérience avec différentes fonctionnalités de la plateforme web :


      - **Jamais entendu parler** : vous découvrez cette fonctionnalité, ou vous en avez entendu parler sans savoir à quoi elle sert.

      - **J'en ai entendu parler** : vous avez lu des informations à ce sujet, mais vous ne l'avez pas encore utilisée.

      - **Je l'ai utilisée** : vous l'avez utilisée au moins une fois, même simplement pour l'essayer.


      Au fait, si vous souhaitez nous en dire plus sur l'une de vos réponses, cliquez simplement sur la petite icône de commentaire !

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.html2024
    t: |
      <span class="first-letter">M</span>algré son nom, cette enquête porte sur bien plus que le seul HTML.

      Ne vous méprenez pas : HTML est plus pertinent que jamais, ce qui est remarquable pour une technologie vieille de 30 ans. Nous avons néanmoins encore élargi le périmètre de l'enquête à l'ensemble de la plateforme web.

      Des API de navigateur aux difficultés du développement web, en passant par les stratégies d'accessibilité et les outils d'analyse et de performance, il y a *beaucoup* à couvrir.

      Pour vous aider à vous repérer parmi toutes ces nouveautés, nous indiquons désormais, lorsque c'est possible, le [statut Baseline](https://web-platform-dx.github.io/web-features/) des fonctionnalités. Repérez le petit point bleu ou vert à côté de leur nom.

      Et si ces données brutes vous semblent manquer de contexte, vous pouvez désormais consulter les **commentaires** laissés par les répondants à chaque question.

      Alors, plongeons dans les nouveautés de la plateforme web en 2024 !

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: T-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le T-shirt State of HTML

      Les années 1990 vous manquent-elles, quand HTML était roi et que les jaquettes de cassettes VHS arboraient des illustrations futuristes et colorées ?

      La mauvaise nouvelle, c'est que même avec la technologie de 2024, vous ne pouvez pas encore remonter le temps pour revivre cette époque glorieuse. En revanche, vous pouvez porter ce superbe T-shirt rétro original, conçu par le talentueux Christopher Kirk-Nielsen.

  - key: tshirt.about
    t: À propos du T-shirt

  - key: tshirt.description
    t: |
      Nous utilisons un T-shirt ajusté de grande qualité, très doux et composé d'un mélange de trois fibres, imprimé par nos partenaires de Cotton Bureau.

  - key: tshirt.getit
    t: Le commander

  - key: tshirt.price
    t: 32 $ US + frais de port

  - key: tshirt.designer.heading
    t: À propos du créateur

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est non seulement un développeur front-end remarquable, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. N'hésitez pas à découvrir ses [autres créations de T-shirts](https://chriskirknielsen.com/designs) !

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.html2024
    t: |
      Bienvenue dans les résultats de l'enquête State of HTML. Cette édition a réuni **5 402** participants du monde entier.

  - key: sections.features.description.html2024
    t: |
      Fonctionnalités HTML et autres API de navigateur
  ###########################################################################
  # Charts
  ###########################################################################

  # user_info

  - key: user_info.country.takeaway.html2024
    t: >
      L'Allemagne a réalisé une belle performance cette année. Sans détrôner les États-Unis à la première place, elle a largement dépassé son poids démographique.

  - key: user_info.locale.takeaway.html2024
    t: >
      Un grand merci à nos traducteurs bénévoles, qui rendent les enquêtes accessibles dans tant de langues !

  - key: user_info.completion_stats.takeaway.html2024
    t: >
      Malgré la longueur de l'enquête, une très grande majorité des répondants a pris le temps de la remplir jusqu'au bout !

  - key: user_info.age.takeaway.html2024
    t: >
      L'âge médian des répondants à State of HTML était de 35 ans, proche des 34 ans de State of CSS et nettement supérieur aux 31 ans de State of JS.

  - key: user_info.years_of_experience.takeaway.html2024
    t: >
      L'écart entre les enquêtes se retrouve dans l'expérience en développement web : 12 ans en moyenne ici, contre 9 ans pour les répondants à State of JS.

  - key: user_info.company_size.takeaway.html2024
    t: >
      Plus l'entreprise est grande, plus le salaire est élevé. Cela dit, nos données montrent qu'avec les bonnes compétences, il est possible de bien gagner sa vie quelle que soit la taille de l'entreprise.

  - key: user_info.yearly_salary.takeaway.html2024
    t: >
      On entend souvent parler des salaires à six chiffres de la Silicon Valley, mais la plupart des développeurs front-end dans le monde gagnent bien moins, comme le montre la comparaison directe entre les États-Unis et le reste du monde.

  - key: user_info.higher_education_degree.takeaway.html2024
    t: >
      Un diplôme est associé à un salaire plus élevé, mais il n'a pas nécessairement besoin d'être lié à la programmation. C'est une bonne nouvelle pour celles et ceux qui ont découvert leur passion pour le développement web plus tard dans leur parcours.

  - key: user_info.gender.takeaway.html2024
    t: >
      Contrairement aux enquêtes précédentes, nous n'avons pas observé cette fois de différence de revenus significative selon le genre.

      Cela dit, ce résultat isolé ne signifie pas que nous devions ignorer les difficultés rencontrées par les femmes dans notre secteur.

  - key: user_info.race_ethnicity.takeaway.html2024
    t: >
      Les répondants non blancs étaient plus souvent jeunes et moins expérimentés, ce qui témoigne peut-être d'une diversification progressive du secteur.

  - key: user_info.disability_status.takeaway.html2024
    t: >
      Grâce aux efforts continus des défenseurs de l'accessibilité, il est désormais admis que les handicaps, permanents ou non, doivent être pris en compte lors de la conception et du développement.

  - key: user_info.source.takeaway.html2024
    t: >
      La majorité des répondants connaissait l'enquête grâce aux éditions précédentes, mais beaucoup l'ont également découverte via une bannière sur les [résultats de State of CSS 2024](https://2024.stateofcss.com/).

      Pour la première fois, Mastodon a aussi dépassé X comme source de trafic, peut-être parce que ce dernier pénalise désormais les tweets contenant des liens externes.

  # features

  - key: features.all_features
    t: Fonctionnalités

  - key: features.all_features.takeaway.html2024
    t: >
      Sans surprise, les éléments de repère (`<main>`, `<nav>`, etc.) sont les plus utilisés, tandis que les applications web isolées sont les moins utilisées.

      `<datalist>` a recueilli la plus forte proportion d'avis positifs (47 %), tandis que `<model>` arrive en tête des avis négatifs avec 9 %.

  - key: features.reading_list.takeaway.html2024
    t: >
      La liste de lecture permet d'enregistrer les sujets à approfondir après l'enquête. La fonctionnalité la plus ajoutée est le nouveau Select personnalisable.

  # forms

  - key: features.forms_features.takeaway.html2024
    t: >
      Les formulaires étant l'un des principaux moyens d'interagir avec le web, il n'est pas surprenant qu'ils posent certaines difficultés.

      Le Select personnalisable mérite d'être suivi : tout nouveau, il fait partie des fonctionnalités de formulaire les moins utilisées, mais arrive deuxième pour les avis positifs.

  - key: features.forms_pain_points.takeaway.html2024
    t: >
      Le style des champs de formulaire reste la principale difficulté des développeurs, en particulier pour les éléments `<select>`.

      Toujours au sujet de `<select>`, l'absence de comportement de zone de liste modifiable (recherche, remplissage automatique, etc.) se fait aussi fortement sentir, car elle oblige souvent les applications à recourir à des contournements en JavaScript.

  # interactivity

  - key: features.interactivity_features.takeaway.html2024
    t: >
      Malgré une faible utilisation et un statut Baseline « Disponibilité limitée », la nouvelle API Popover arrive en tête des avis positifs, ce qui se comprend au vu de son utilité.

  - key: features.interactivity_pain_points.takeaway.html2024
    t: >
      Le style des champs de formulaire reste la principale difficulté des développeurs, en particulier pour les éléments `<select>`.

      Toujours au sujet de `<select>`, l'absence de comportement de zone de liste modifiable (recherche, remplissage automatique, etc.) se fait aussi fortement sentir, car elle oblige souvent les applications à recourir à des contournements en JavaScript.

  # content

  - key: features.content_features.takeaway.html2024
    t: >
      Les attributs `srcset` et `sizes` ont recueilli 81 commentaires libres, dont 58 % exprimaient un avis négatif. Comme l'a résumé un répondant : « il faut rechercher la syntaxe chaque fois qu'on les utilise ».

  - key: features.content_pain_points.takeaway.html2024
    t: >
      SVG, notamment leur stylisation avec CSS, et la gestion des images sont les deux principales difficultés liées au contenu.

  # web_components

  - key: features.web_components_features.takeaway.html2024
    t: >
      Les Web Components ont leurs adeptes, mais restent controversés. Ils recueillent en moyenne 7 % d'avis négatifs, contre 4 % pour l'ensemble des autres fonctionnalités.

  - key: features.web_components_libraries.takeaway.html2024
    t: >
      Svelte n'est peut-être pas connu comme une bibliothèque de Web Components, mais il s'avère qu'il fonctionne très bien avec eux, contrairement à React, bien plus bas dans le classement.

  - key: features.using_web_components_pain_points.takeaway.html2024
    t: >
      La difficulté à styliser et personnaliser les Web Components reste le principal obstacle à leur adoption. Leur intégration aux bibliothèques JavaScript front-end constitue un autre frein.

  - key: features.making_web_components_pain_points.takeaway.html2024
    t: >
      Malgré son nom évocateur, le Shadow DOM continue de frustrer les créateurs de Web Components, qui jugent souvent l'ensemble du processus excessivement complexe.

  # accessibility

  - key: features.accessibility_features.takeaway.html2024
    t: >
      Les fonctionnalités d'accessibilité évoquées dans l'enquête de cette année se sont révélées assez simples à utiliser, d'où une très faible proportion d'avis négatifs.

  - key: features.accessibility_disabilities.takeaway.html2024
    t: >
      Il est encourageant de constater que les développeurs prennent en compte de nombreux handicaps lors de la création de sites web, les déficiences visuelles arrivant en tête.
    aliases:
      - accessibility.accessibility_disabilities.takeaway.html2024

  - key: features.accessibility_techniques.takeaway.html2024
    t: >
      Il est réjouissant de voir que les textes alternatifs sont largement utilisés. À défaut, ce graphique constitue une liste pratique de pratiques d'accessibilité à intégrer à vos projets.
    aliases:
      - accessibility.accessibility_techniques.takeaway.html2024

  - key: features.accessibility_screenreaders.takeaway.html2024
    t: >
      Il n'est pas surprenant que les développeurs utilisent plus volontiers les lecteurs d'écran lorsqu'ils sont intégrés à leur navigateur ou à leur système d'exploitation.
    aliases:
      - accessibility.accessibility_screenreaders.takeaway.html2024

  - key: features.accessibility_tools.takeaway.html2024
    t: >
      Lighthouse et les outils de développement des navigateurs arrivent en tête, devant des outils plus spécialisés comme Axe ou WAVE.
    aliases:
      - accessibility.accessibility_tools.takeaway.html2024

  - key: features.accessibility_pain_points.takeaway.html2024
    t: >
      Accessibility presents a unique challenge in that developers must not only overcome technical issues such as testing difficulties, but also organizational obstacles such as low prioritization or lack of client demand.
    aliases:
      - accessibility.accessibility_pain_points.takeaway.html2024

  # mobile_web_apps_features

  - key: features.mobile_web_apps_features.takeaway.html2024
    t: >
      L'utilisation des fonctionnalités d'applications web mobiles et de bureau reste globalement faible : seuls 6 % des répondants les ont utilisées, contre 30 % pour les autres fonctionnalités réunies.

  - key: features.native_apps_tools.takeaway.html2024
    t: >
      Malgré les difficultés et limites liées à la création d'applications natives avec des technologies web, cette méthode reste la plus populaire parmi les répondants.
    aliases:
      - mobile_web_apps.native_apps_tools.takeaway.html2024

  - key: features.mobile_web_apps_pain_points.takeaway.html2024
    t: >
      La part de marché dominante d'iOS et son écosystème fermé laissent peu de solutions lorsque des problèmes liés à la plateforme web surviennent.

  # other_tools

  - key: other_tools.site_generators.takeaway.html2024
    t: >
      Next.js n'est pas un générateur de sites statiques traditionnel, mais la prise en charge de méthodes de rendu plus dynamiques, en plus du rendu à la compilation, en fait un choix très polyvalent. Astro offre des possibilités similaires.

  - key: other_tools.validation_tools.takeaway.html2024
    t: >
      Les outils de validation sont peut-être moins populaires qu'autrefois, mais ils restent indispensables dans la boîte à outils des développeurs web.

  - key: other_tools.performance_tools.takeaway.html2024
    t: >
      Comme pour les outils d'accessibilité, Lighthouse et les outils de développement des navigateurs dominent le classement, preuve que les outils polyvalents sont souvent plus populaires que leurs équivalents spécialisés.

  - key: other_tools.analytics_tools.takeaway.html2024
    t: >
      Google Analytics domine peut-être encore, mais des solutions plus respectueuses de la vie privée, comme Plausible ou Fathom, gagnent du terrain.

  - key: other_tools.browsers.takeaway.html2024
    t: >
      Au-delà des quatre principaux navigateurs, l'offre est étonnamment variée, avec de nouveaux venus comme Arc, Brave et Zen, ainsi que des options pensées pour les développeurs comme Polypane.

  - key: other_tools.web_platform_resources.takeaway.html2024
    t: >
      MDN et Can I Use se sont imposés comme des ressources essentielles pour la communauté du développement web. Gardez aussi un œil sur les travaux du groupe WebDX autour des [Web Features](https://web-platform-dx.github.io/web-features-explorer/), une initiative prometteuse.

  # usage

  - key: usage.html_interoperability_features.takeaway.html2024
    t: >
      Peu de choses sont plus frustrantes que de savoir qu'une nouvelle API de navigateur résoudrait parfaitement un problème, sans pouvoir l'utiliser faute d'une prise en charge suffisante.


      Heureusement, grâce à des initiatives comme [Interop](https://web.dev/blog/interop-2024), on peut espérer que l'API Popover et le positionnement par ancre rejoignent bientôt les fonctionnalités que tout le monde utilise naturellement.

  - key: usage.html_functionality_features.takeaway.html2024
    t: >
      Une prise en charge insuffisante par les navigateurs est évidemment problématique, mais même les fonctionnalités bien prises en charge peuvent être peu utilisées si elles sont difficiles à adapter aux besoins des développeurs ou simplement à maîtriser.

  - key: usage.html_missing_elements.takeaway.html2024
    t: >
      Il peut sembler étonnant que des composants d'interface omniprésents, comme les onglets ou les tableaux de données, ne disposent toujours pas d'un élément HTML natif correspondant.


      Mais gérer correctement ces comportements complexes et tous leurs cas particuliers prend du temps. Pour l'instant, il ne reste qu'à espérer que ces éléments finiront un jour par arriver dans les navigateurs.

  - key: usage.html_css_js_balance.takeaway.html2024
    t: >
      Nous consacrons toujours bien plus de temps à écrire du JavaScript (ou du TypeScript) qu'autre chose. Ce n'est pas un problème en soi, mais les progrès continus de la plateforme web pourraient rééquilibrer un peu les choses prochainement.

  - key: usage.what_do_you_use_html_for.takeaway.html2024
    t: >
      Les cas d'usage « classiques », comme les blogs ou les pages d'accueil, représentent encore une part importante du travail des développeurs web, mais les applications web en constituent désormais la plus grande partie. Cela explique l'adaptation de la plateforme web à cette nouvelle réalité.

  - key: usage.industry_sector.takeaway.html2024
    t: >
      La programmation et les outils techniques arrivent en tête, ce qui est logique pour une enquête destinée aux développeurs.


      Le commerce en ligne arrive en troisième position. Ce secteur doit relever le double défi de créer des sites très performants et de proposer des interactions utilisateur complexes.

  # opinions

  - key: opinions.accessibility_is_valued.takeaway.html2024
    t: >
      Il est réjouissant de voir que l'accessibilité est valorisée au travail, du moins parmi les répondants à l'enquête.


      Même si un biais d'auto-sélection est probablement à l'œuvre, les efforts des défenseurs de l'accessibilité ont également contribué à cette évolution.

  - key: opinions.keeping_informed_is_challenging.takeaway.html2024
    t: >
      Les nouvelles fonctionnalités sont utiles, encore faut-il savoir qu'elles existent et comment les utiliser.


      Comme le montrent les données, la majorité des répondants rencontre ce défi au quotidien.

  - key: opinions.browser_interoperability_is_obstacle.takeaway.html2024
    t: >
      L'interopérabilité des navigateurs a longtemps été une difficulté majeure du développement web, mais la situation semble enfin s'améliorer. Il sera intéressant de voir comment ce graphique évoluera.

  - key: opinions.web_platform_right_direction.takeaway.html2024
    t: >
      Il y a des raisons d'espérer pour la plateforme web, et les données de cette année reflètent cet optimisme.

