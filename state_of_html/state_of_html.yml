  # progressive_enhancement_priority

  - key: usage.progressive_enhancement_priority
    t: Amélioration progressive
  - key: usage.progressive_enhancement_priority.question
    t: Dans votre contexte de travail habituel, quelle importance accordez-vous au fait que les sites ou applications web que vous créez fonctionnent sans JavaScript ?

  - key: options.progressive_enhancement_priority.not_a_concern
    t: Pas une préoccupation
  - key: options.progressive_enhancement_priority.not_a_concern.description
    t: JavaScript est considéré comme activé en permanence chez tous les utilisateurs.

  - key: options.progressive_enhancement_priority.low_priority
    t: Priorité faible
  - key: options.progressive_enhancement_priority.low_priority.description
    t: Les bonnes pratiques sont appliquées, mais aucun temps supplémentaire n'est consacré au fonctionnement sans JS.

  - key: options.progressive_enhancement_priority.high_priority
    t: Priorité élevée
  - key: options.progressive_enhancement_priority.high_priority.description
    t: Du temps est consacré aux tests sans JS, à la refactorisation, etc.

  - key: options.progressive_enhancement_priority.required
    t: Obligatoire
  - key: options.progressive_enhancement_priority.required.description
    t: Les sites et applications doivent fonctionner sans JavaScript.

