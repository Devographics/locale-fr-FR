  # design_system_strategies
  - key: usage.design_system_strategies
    t: Systèmes de design

  - key: usage.design_system_strategies.question
    t: Utilisez-vous l'une des stratégies de système de design suivantes pour assurer la cohérence de l'interface ?

  - key: options.design_system_strategies.elements_components
    t: Éléments / composants
  - key: options.design_system_strategies.elements_components.description
    t: |
      Bibliothèque de composants réutilisables, comme des boutons ou des menus déroulants, réalisés avec n'importe quelle technologie (par exemple React, Web Components, etc.).

  - key: options.design_system_strategies.design_tokens
    t: Design tokens
  - key: options.design_system_strategies.design_tokens.description
    t: |
      Variables atomiques pour les couleurs, les espacements, la typographie, etc., par exemple `--color-accent-dark`, `--font-heading`, etc.

  - key: options.design_system_strategies.utilities
    t: Classes utilitaires
  - key: options.design_system_strategies.utilities.description
    t: |
      Classes CSS de bas niveau qui appliquent un style ou comportement précis, par exemple `.visually-hidden`, `.grid-2x2`, `.text-center`, etc.

  - key: options.design_system_strategies.guidelines
    t: Directives
  - key: options.design_system_strategies.guidelines.description
    t: |
      Normes et bonnes pratiques pour maintenir la cohérence et atteindre certains objectifs (accessibilité, facilité d'utilisation, etc.).

  - key: options.design_system_strategies.patterns
    t: Modèles de conception
  - key: options.design_system_strategies.patterns.description
    t: |
      Assemblages de niveau supérieur des éléments précédents, prêts à être copiés et qui répondent à des problèmes courants d'interface et d'expérience utilisateur, comme les barres de navigation ou des mises en page responsives complètes.

