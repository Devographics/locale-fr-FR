    aliases:
      - forms.forms_pain_points
  - key: features.forms_pain_points.question
    t: Quelles difficultés rencontrez-vous avec les formulaires HTML ?
    aliases:
      - forms.forms_pain_points.question
  - key: features.forms_pain_points.prompt
    t: |
      Pensez aux différents contrôles de formulaire (par exemple `<input>`, `<textarea>`, `<select>`, `<button>`, etc.),
      aux comportements (validation, saisie automatique), à la gestion des formulaires avec JS, aux API d'édition (comme `contentEditable`), etc.
      Tout ce qui vous pose problème est pertinent : compatibilité des navigateurs, fonctionnalités manquantes, styles, etc.
    aliases:
      - forms.forms_pain_points.prompt
  - key: features.forms_pain_points.placeholder
    t: |
      Difficulté n° {index}…

