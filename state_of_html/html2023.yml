      Originaire de France et désormais installé aux États-Unis, Chris est non seulement un développeur front-end remarquable, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. N'hésitez pas à découvrir ses [autres créations de T-shirts](https://chriskirknielsen.com/designs) !

