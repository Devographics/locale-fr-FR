  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le T-shirt State of HTML

      Les années 1990 vous manquent-elles, quand HTML était roi et que les jaquettes de cassettes VHS arboraient des illustrations futuristes et colorées ?

      La mauvaise nouvelle, c'est que même avec la technologie de 2024, vous ne pouvez pas encore remonter le temps pour revivre cette époque glorieuse. En revanche, vous pouvez porter ce superbe T-shirt rétro original, conçu par le talentueux Christopher Kirk-Nielsen.

