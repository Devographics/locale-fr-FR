  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2023 de l'enquête annuelle sur les dernières tendances de l'écosystème HTML.

  - key: introduction.html2023
    t: >
      Alors que JavaScript prenait le contrôle du web et que CSS gagnait chaque année de nouveaux super-pouvoirs,
      HTML semblait vouloir rester en sommeil et céder le devant de la scène à ses cadets.
      Après tout, une fois qu'on connaît les `<div>` et les `<h>` de 1 à 6, que reste-t-il à apprendre ?


      Beaucoup de choses, en réalité ! Nous avons de nouveau fait appel à [Lea Verou](https://lea.verou.me/) pour mettre à profit sa connaissance approfondie
      de la plateforme web et nous aider à concevoir une enquête qui dépasse largement le HTML
      pour aborder l'accessibilité, les Web Components et bien d'autres sujets.


      Cela explique en partie pourquoi ce rapport a mis si longtemps à paraître : il y avait
      *beaucoup* de nouvelles données à traiter ! Nous espérons que le résultat valait l'attente.


      En plus des données présentées ici, nous avons amélioré notre fonctionnalité de **personnalisation des graphiques** pour vous permettre d'adapter
      encore davantage chaque visualisation. Si vous découvrez des résultats intéressants,
      n'hésitez pas à nous en faire part !


      Pour en savoir plus, consultez [cet article](https://dev.to/sachagreif/discover-the-state-of-html-2023-survey-results-n10) ou regardez cette [courte vidéo YouTube](https://www.youtube.com/watch?v=G-rFwp2zUT4).


      Ceci étant dit, bienvenue dans les résultats de la toute première enquête State of HTML.
      Après ça, vous ne verrez plus jamais le bon vieux HTML de la même manière !

