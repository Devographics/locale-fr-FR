  - key: general.js2022.survey_intro
    t: |
      Pour la première fois depuis longtemps, le statu quo de l’écosystème JavaScript semble remis en question.

      Empaquetage plus rapide avec Vite, architecture en îlots avec Astro, reprise d’exécution avec Qwik… Les nouveaux venus bousculent les acteurs historiques, ce qui suscite beaucoup d’enthousiasme, mais aussi
      beaucoup plus d’incertitude.

      Essayons donc une nouvelle fois de découvrir ensemble où va JavaScript, en 2022 et au-delà.
