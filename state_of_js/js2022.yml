translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L’édition 2022 de l’enquête annuelle sur les dernières tendances de l’écosystème JavaScript.

  - key: general.livestream_announcement
    t: Ne manquez pas notre [diffusion en direct spéciale consacrée aux résultats de l’enquête](https://dev.to/sachagreif/state-of-javascript-2021-livestream-24a5) le 22 février ! (en anglais)

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.js2022
    t: |

      <span class="first-letter">A</span>près des années de relative stabilité, beaucoup commencent à remettre en question le statu quo. 

      De nouveaux frameworks front-end comme Solid et Qwik suggèrent que React n’a peut-être pas toutes les réponses, tandis que côté serveur, Astro, Remix et Next.js (entre autres) nous amènent à repenser la quantité de code qu’il faut réellement envoyer au client. 

      Il nous faut toutes les données possibles pour comprendre ces évolutions. Cette année, l’enquête a d’ailleurs recueilli un nombre impressionnant de **39 472** réponses, presque le double de l’an dernier ! 

      Cet élargissement du public peut expliquer certains résultats inattendus, comme le recul d’une année sur l’autre de la notoriété ou de l’utilisation de certaines fonctionnalités. 

      Mais davantage de données peut aussi apporter de nouvelles perspectives. C’est pourquoi nous avons créé deux nouveaux moyens d’explorer notre jeu de données : le **Data Explorer** permet de croiser deux variables et de faire ressortir les résultats atypiques, tandis que les **filtres de graphiques** permettent de filtrer certains graphiques selon le salaire, le pays, le genre et bien d’autres variables démographiques. 

      Nous avons également remplacé la catégorie générale « back-end » par une page plus précise consacrée aux **frameworks de rendu**, et ajouté une liste de **créateurs vidéo** à la section Ressources. 

      Enfin, les questions sur les fonctionnalités et les bibliothèques disposent désormais d’une fenêtre **Commentaires** qui vous permet de découvrir ce que les répondants pensent réellement des éléments de l’enquête !

      Maintenant que tout cela est dit, découvrons ce que JavaScript nous a réservé en 2022 !

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: Tee-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l’enquête avec le tee-shirt State of JavaScript

      Entre la mauvaise qualité vidéo, les cassettes encombrantes et l’obligation de rembobiner, peu de choses nous manquent de l’époque des VHS. Mais les superbes visuels des années 90 qui décoraient les cassettes vierges, eux, nous manquent bel et bien. 

      Grâce au talent de Christopher Kirk-Nielsen, vous pouvez désormais profiter de tout ce style rétro tout en célébrant votre amour pour JavaScript !

  - key: tshirt.about
    t: À propos du tee-shirt

  - key: tshirt.description
    t: |
      Nous utilisons un tee-shirt ajusté, très doux et de grande qualité, composé de trois fibres et imprimé par nos partenaires de Cotton Bureau.

  - key: tshirt.getit
    t: Achetez-le

  - key: tshirt.price
    t: 29 $ US + frais de livraison

  - key: tshirt.designer.heading
    t: À propos du créateur

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est non seulement un formidable développeur front-end, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. Nous vous invitons d’ailleurs à découvrir ses [autres modèles de tee-shirts](https://chriskirknielsen.com/designs) !

  ###########################################################################
  # Sections
  ###########################################################################

  - key: sections.user_info.description
    t: |
      Cette année, **39 471** personnes ont répondu à l’enquête.

  - key: sections.features.description
    t: |
      JavaScript évolue vite, mais les développeurs JavaScript semblent aller encore plus vite : de nombreuses fonctionnalités relativement récentes affichent déjà un taux d’adoption élevé.

  - key: sections.technologies.description
    t: |
      Les résultats de cette année révèlent une forte fragmentation du monde JavaScript. Cela peut parfois donner des maux de tête, mais cette concurrence contribue à créer un écosystème très dynamique.

  - key: sections.tools_others.description
    t: |
      Choisir une technologie implique souvent de difficiles arbitrages entre des priorités concurrentes.
      Cette année, nous avons tenté de représenter ce processus avec un nouveau format de question à élimination directe.

  - key: sections.environments.description
    t: |
      Longtemps reléguée au second plan dans le développement Web, l’accessibilité est désormais reconnue par de nombreux développeurs
      comme le fondement sur lequel tout le reste devrait reposer.

  - key: sections.resources.description
    t: |
      Mettre en avant des blogs, des podcasts et des sites était un bon début, mais cette année nous sommes allés plus loin
      en présentant les personnes qui composent la communauté JavaScript !

  - key: sections.opinions.description
    t: |
      Qu’il s’agisse des difficultés qui vous freinent aujourd’hui ou des fonctionnalités manquantes que vous aimeriez utiliser
      demain, c’était l’occasion de vous exprimer et de partager vos frustrations avec JavaScript !

  ###########################################################################
  # Charts
  ###########################################################################

  - key: options.features_categories.language
    aliasFor: sections.language.title
  - key: options.features_categories.browser_apis
    aliasFor: sections.browser_apis.title
  - key: options.features_categories.other_features
    aliasFor: sections.other_features.title

  - key: blocks.tools_quadrant.description
    t: |
      Ce graphique compare le **taux de rétention** de chaque technologie à son **nombre total d’utilisateurs**.
      Il se divise en quatre quadrants :

        - **1** : faible utilisation, forte rétention. Des technologies à suivre.

        - **2** : forte utilisation, forte rétention. Des technologies que l’on peut adopter sereinement.

        - **3** : faible utilisation, faible rétention. Des technologies difficiles à recommander pour le moment.

        - **4** : forte utilisation, faible rétention. Si vous utilisez ces technologies, réévaluez votre choix.

  ###########################################################################
  # Notes
  ###########################################################################

  - key: blocks.gender.note
    t: |
      Pour en savoir plus, nous avons [écrit un article de blog](https://dev.to/sachagreif/is-our-survey-biased-against-women-49oj) sur les questions de genre liées à l’enquête.

  - key: blocks.css_missing_features.note
    t: |
      Vous pouvez explorer l’ensemble des réponses à cette question dans [ce projet annexe](https://whatsmissingfromcss.com/).

  - key: blocks.source.note
    t: >

      Ce graphique regroupe des référents, des paramètres d’URL et des réponses libres. 

      - State of JS : la liste de diffusion [State of JS](https://stateofjs.com).

      - State of CSS : la liste de diffusion State of CSS ; correspond aussi à `email`, `by email`, etc.

      - Travail : correspond à `work`, `colleagues`, `coworkers`, etc.

  ###########################################################################
  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: Avec une progression de **{value}** en 2022, **top-level await** est rapidement devenu incontournable en JavaScript.

  - key: award.tool_usage_delta_award.comment
    t: |
      **Vite** a à peine deux ans, mais avec une progression de **{value}** au cours de l’année écoulée, il gagne déjà du terrain.

  - key: award.tool_satisfaction_award.comment
    t: Vite occupe la première place avec un taux de rétention exceptionnel de **{value}** !

  - key: award.tool_interest_award.comment
    t: Avec un taux d’intérêt de **{value}**, Vite remporte une nouvelle fois la médaille d’or !

  - key: award.most_write_ins_award.comment
    t: Plusieurs questions acceptaient aussi des réponses libres et, avec **{value}** mentions, **Astro** a été la réponse la plus populaire dans l’ensemble.

  - key: award.most_commented_feature_award.comment
    t: Avec **{value}** commentaires, aucune autre fonctionnalité n’a suscité autant de réactions que les champs privés.

  - key: award.most_commented_tool_award.comment
    t: Avec **{value}** commentaires, React a montré qu’il reste la bibliothèque dont on parle le plus.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.js2022
    t: |
      <span class="first-line">JavaScript et TypeScript sont plus dynamiques que jamais.</span> 

      Nous avons observé la poursuite des innovations axées sur les performances, notamment en matière de réactivité et d’hydratation (ou de son absence). Par exemple, [Svelte](https://www.youtube.com/watch?v=AdNJ3fydeao) privilégie la simplicité de l’expérience développeur et mise sur le compilateur. Solid a exploré de [nouvelles approches de la réactivité](https://www.youtube.com/watch?v=2iK9zzhSKo4), tandis que Qwik a [modifié notre modèle mental avec la reprise](https://www.youtube.com/watch?v=Zddw6qy5pf0). 

      Les innovations dans des solutions multiplateformes comme Tauri, Ionic et Flutter sont également enthousiasmantes : elles ouvrent la voie à des applications couvrant encore davantage de plateformes.

      Les talents sont répartis dans le monde entier : le Nigeria et désormais l’Inde affichent [la plus forte croissance du nombre de développeurs sur GitHub](https://octoverse.github.com/2022/global-tech-talent). Partout, on trouve des projets remarquables comme [Chakra UI](https://chakra-ui.com/) de Segun Adebayo ou [Hoppscotch](https://hoppscotch.io/) de Liyas Thomas, ainsi que des personnes qui favorisent l’apprentissage et l’épanouissement des autres, comme Ada Nduka Oyom, fondatrice de [SheCodeAfrica](https://shecodeafrica.org/), une organisation à but non lucratif qui a contribué à l’émancipation de plus de 17 000 femmes en Afrique.

      Avec des frameworks établis comme React, Angular ou Vue, on observe souvent une baisse de satisfaction, ce qui peut susciter des interrogations sur l’avenir. Je pense que cette baisse s’explique par leur mise à l’épreuve et leur utilisation en production : on en découvre les limites et les compromis propres à chaque outil. C’est un signe de maturité et d’une appréciation lucide de ce qu’ils peuvent offrir. Ils sauront aussi tirer parti des innovations du secteur et continueront d’évoluer.

      Enfin, je suis ravi de voir Vite s’imposer aussi nettement dans les prix pour la deuxième année consécutive. Les technologies de build et de serveur font d’immenses progrès, dont nous bénéficions tous. Bravo !

  - key: conclusion.js2022.bio
    t: Directeur de l’ingénierie et de l’infrastructure Web chez Google

