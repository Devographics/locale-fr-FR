  ###########################################################################
  # Survey Help
  ###########################################################################

  - key: features.features_intro
    t: >
      Bienvenue dans l’enquête ! Cette première partie vise à découvrir
      quelles **fonctionnalités** du langage JavaScript vous avez déjà utilisées.

  - key: tools.tools_intro
    t: >
      Les sections suivantes portent sur les **bibliothèques** et les **frameworks** qui composent
      l’écosystème JavaScript. Dites-nous ce qui vous enthousiasme !

  - key: tools.back_end_frameworks_intro
    t: >
      Cette année, la section consacrée aux frameworks back-end est de retour !

