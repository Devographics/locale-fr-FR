  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_js.intro
    t: >
      Le monde JavaScript aurait bien besoin d’un peu de classification.


      Depuis 2016, cette enquête recueille chaque année
      les données de plus de 20 000 développeurs afin de cerner les tendances actuelles et à venir.


      Découvrons ensemble quelles bibliothèques les développeurs
      souhaitent apprendre ensuite, lesquelles affichent les meilleurs taux de rétention, et bien plus encore.

  - key: general.state_of_js.title
    t: L’enquête des développeurs State of JavaScript

  - key: general.state_of_js.description
    t: L’enquête annuelle des développeurs sur l’écosystème JavaScript

