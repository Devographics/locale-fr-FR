  # JS App Patterns

  - key: options.js_app_patterns.single_page_app
    t: Application monopage (SPA)
  - key: options.js_app_patterns.single_page_app.description
    t: Applications qui s’exécutent entièrement dans le navigateur
  - key: options.js_app_patterns.multiple_page_app
    t: Application multipage (MPA)
  - key: options.js_app_patterns.multiple_page_app.description
    t: Applications qui s’exécutent entièrement sur le serveur, avec un minimum de comportement dynamique côté client
  - key: options.js_app_patterns.static_site_generation
    t: Génération de site statique (SSG)
  - key: options.js_app_patterns.static_site_generation.description
    t: Contenu statique pré-rendu au moment du build, avec ou sans élément dynamique côté client
  - key: options.js_app_patterns.server_side_rendering
    t: Rendu côté serveur (SSR)
  - key: options.js_app_patterns.server_side_rendering.description
    t: Génération dynamique du contenu HTML sur le serveur à la demande, avant sa réhydratation côté client
  - key: options.js_app_patterns.partial_hydration
    t: Hydratation partielle
  - key: options.js_app_patterns.partial_hydration.description
    t: Hydratation de certains composants uniquement côté client (par exemple, les composants serveur React)
  - key: options.js_app_patterns.progressive_rehydration
    t: Hydratation progressive
  - key: options.js_app_patterns.progressive_rehydration.description
    t: Contrôle de l’ordre d’hydratation des composants côté client
  - key: options.js_app_patterns.islands_architecture
    t: Architecture en îlots
  - key: options.js_app_patterns.islands_architecture.description
    t: Îlots isolés de comportement dynamique avec plusieurs points d’entrée dans un site autrement statique (Astro, Eleventy)
  - key: options.js_app_patterns.progressive_enhancement
    t: Amélioration progressive
  - key: options.js_app_patterns.progressive_enhancement.description
    t: Garantir le fonctionnement d’une application même sans JavaScript
  - key: options.js_app_patterns.incremental_static_generation
    t: Génération statique incrémentale
  - key: options.js_app_patterns.incremental_static_generation.description
    t: Possibilité d’enrichir ou de modifier dynamiquement un site statique après le build initial (ISR et revalidation à la demande dans Next.js, DSG dans Gatsby)
  - key: options.js_app_patterns.streaming_ssr
    t: SSR en continu
  - key: options.js_app_patterns.streaming_ssr.description
    t: Découpage du contenu rendu côté serveur en petits segments transmis en continu
  - key: options.js_app_patterns.resumability
    t: Reprise d’exécution
  - key: options.js_app_patterns.resumability.description
    t: Sérialisation de l’état du framework sur le serveur afin que le client reprenne l’exécution sans répéter le code.
  - key: options.js_app_patterns.edge_rendering
    t: Rendu en périphérie
  - key: options.js_app_patterns.edge_rendering.description
    t: Modification du HTML rendu en périphérie avant son envoi au client
  - key: options.js_app_patterns.partial_prerendering
    t: Pré-rendu partiel
  - key: options.js_app_patterns.partial_prerendering.description
    t: Rendu d’une route avec une structure de chargement statique, tout en conservant des parties dynamiques

  - key: options.js_app_patterns.micro_frontend
    t: Micro-front-end
  - key: options.js_app_patterns.domain_driven_design
    t: Conception pilotée par le domaine
  - key: options.js_app_patterns.serverless
    t: Sans serveur
  - key: options.js_app_patterns.pespa
    t: PESPA

