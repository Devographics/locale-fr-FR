locale: fr-FR
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: finish.share_message.js2025
    t: L’enquête State of JS 2025 est ouverte ! {link}

  - key: general.results.description
    t: L’édition 2025 de l’enquête annuelle sur les dernières tendances de l’écosystème JavaScript.

  ###########################################################################
  # Survey Intro
  ###########################################################################

  - key: general.js2025.survey_intro
    t: >
      JavaScript, ça va ? Tu n’as presque créé aucun nouveau framework front-end cette année.


      Après une décennie d’itérations rapides, l’écosystème semble s’être stabilisé ces dernières années. Saviez-vous, par exemple, que le « petit nouveau » Svelte a *9 ans* ? À l’échelle des frameworks JavaScript, c’est presque antique !


      La bataille principale se joue désormais du côté des méta-frameworks, où Astro convoite sérieusement la couronne de Next.js. Quant aux outils de build, il semble que Vite ne tardera pas à dépasser webpack. 


      À moins qu’un tout autre projet issu de l’écosystème Rust ne surgisse et ne prenne soudain le dessus, mettant fin prématurément à notre ère de calme bien méritée.  


      Quoi qu’il arrive, une chose est sûre : vous pouvez nous aider à y voir plus clair en répondant à l’enquête State of JavaScript de cette année !

  - key: introduction.js2025
    t: >
      Lorsque la très attendue Nintendo Switch 2 est sortie récemment, huit ans s’étaient écoulés depuis la première Switch. 


      Imaginez ce qu’ont dû vivre ces pauvres développeurs de jeux ! Huit longues années à développer pour la même plateforme, sans nouvelles API, sans nouvelles fonctionnalités, sans nouveaux bugs, sans nouvelles versions qui cassent le build… Les pauvres !


      Heureusement, *nous* n’aurons jamais à nous en inquiéter : les dieux de JavaScript veillent à ce que chaque année apporte son lot de probl… enfin, d’*innovations* !


      Rejoignez-moi donc une fois encore pour examiner les résultats de l’enquête et revenir sur ce que 2025 nous a réservé.


      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Survey FAQ
  ###########################################################################

  - key: faq.how_long_will_survey_take_js2025
    t: Combien de temps faut-il pour répondre à l’enquête ?
  - key: faq.how_long_will_survey_take_js2025.description
    t: >
      Selon le nombre de questions auxquelles vous répondez (vous pouvez toutes les passer),
      l’enquête devrait prendre environ 15 à 20 minutes.

  - key: faq.survey_design_js2025
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_js2025.description
    t: >
      Cette enquête est le fruit d’un [processus de conception ouvert](https://github.com/Devographics/surveys/issues/307) auquel ont participé des éditeurs de navigateurs et la communauté du développement Web.

  - key: faq.results_released_js2025
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_js2025.description
    t: L’enquête se déroulera du 1er octobre au 1er novembre 2025, et les résultats seront publiés peu après.

