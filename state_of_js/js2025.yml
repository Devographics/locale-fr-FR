  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.js2025.daniel_roe
    t: |
      <span class="first-line">TypeScript a gagné.</span>

      Pas comme bundler, mais comme langage. Deno et Bun le prennent en charge depuis longtemps. Désormais, la suppression des types permet aussi de l’écrire nativement dans les versions stables de Node.js. Si la proposition des types en commentaires aboutit, on pourra même écrire du TypeScript dans le navigateur.

      …et l’ère de Vite est arrivée. Cette année, les téléchargements de Vite ont dépassé ceux de webpack, tandis que l’utilisation de Vitest a fortement augmenté. Le moment semble idéal pour adopter la nouvelle chaîne d’outils Vite. 2026 pourrait être l’année de cette transition, avec la sortie stable de Rolldown pour alimenter un Vite plus rapide, ainsi que la promesse d’une solution tout-en-un « Vite+ ».

      Nos outils n’ont jamais été aussi performants. Pourtant, la grande question existentielle est tout autre : qu’en est-il de l’IA ?

      L’IA s’apprête à transformer notre manière de consulter la documentation, d’écrire du code, de faire des choix d’architecture, et bien plus encore. Les entreprises misent tout sur de nouvelles méthodes de développement. Pour la grande majorité d’entre nous, les agents de programmation changent notre façon d’interagir avec le code.

      Est-ce une bonne chose ?

      À la fin de 2025, un peu moins de 30 % du code était apparemment généré par l’IA. Cursor et Zed gagnent rapidement en popularité, même s’ils sont loin de détrôner VS Code comme IDE le plus utilisé. Les approches fondées sur des agents, comme Claude, Gemini et Copilot, progressent elles aussi rapidement.

      Pour nous, développeurs, savoir reconnaître ce qui est « bien fait » sera plus important que jamais, quels que soient les outils utilisés. Il sera aussi essentiel de suivre les nouvelles fonctionnalités du langage et de savoir sur quelles bibliothèques s’appuyer, plutôt que de tout improviser depuis zéro avec le vibe coding.

      Il est déjà possible de lancer un nouveau projet en une journée, ou de migrer facilement un projet existant. C’est un défi pour les auteurs de frameworks et de bibliothèques : nos outils doivent continuer à répondre aux besoins des développeurs. Nous ne pouvons pas compter sur l’inertie.

      Voilà une raison d’être optimiste pour tous les utilisateurs.

      Voyons ce que 2026 nous réserve. J’espère des outils plus rapides, une meilleure expérience développeur et des technologies qui démultiplient nos capacités tout en renforçant notre autonomie et nos choix.

  - key: conclusion.js2025.daniel_roe.bio
    t: Mainteneur open source et fondateur, responsable de l’équipe principale de Nuxt.

  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.js2025
    t: |
      L’enquête State of JavaScript 2025 s’est déroulée du 24 septembre au 10 novembre 2025 et a recueilli 13 002 réponses. Les résultats ont été publiés le 3 février 2026. L’enquête est organisée par [Devographics](https://devographics.com/).

      Le logo et le tee-shirt State of JavaScript ont été conçus par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l’enquête

      Cette enquête vise à repérer les tendances à venir dans l’écosystème du développement Web afin d’aider les développeurs à choisir leurs technologies. 

      Elle cherche donc à anticiper les évolutions des prochaines années plutôt qu’à analyser les tendances actuelles. Certaines fonctionnalités ou technologies peuvent ainsi être omises, même si elles sont déjà largement répandues. 

      Ces résultats constituent également un **instantané d’un sous-ensemble précis de développeurs** et ne prétendent pas représenter l’ensemble de l’écosystème. 

      ### Conception de l’enquête

      L’enquête s’appuie en partie sur celle de l’année dernière. Une période de commentaires ouverts a permis de discuter de son plan [sur GitHub](https://github.com/Devographics/surveys/issues/255). 

      Toutes les questions de l’enquête étaient facultatives. 

      ### Public de l’enquête

      L’enquête était librement accessible en ligne et les répondants n’ont fait l’objet d’aucune sélection. Ils provenaient principalement des éditions précédentes (informés par une liste de diffusion dédiée) et des réseaux sociaux. 

      Les frameworks, bibliothèques et autres projets pouvaient inviter leur public à participer, et certains l’ont fait au moyen de bannières, de publications, etc. Le graphique « Sources » de la page Métadonnées présente une ventilation détaillée du trafic. 

      ### Financement du projet

      Outre la vente de tee-shirts, le projet est financé par les sponsors suivants :

      - [Google](https://www.google.com/chrome/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)
      - [TokyoDev](https://www.tokyodev.com/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)
      - [Frontend Masters](https://frontendmasters.com/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)
      - [Algolia](https://www.algolia.com/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)
      - [Storyblok](https://www.storyblok.com/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)
      - [JetBrains](https://www.jetbrains.com/webstorm/?utm_source=stateofjs&utm_medium=website&utm_campaign=js2025)

      Toute contribution ou tout parrainage est vivement apprécié. Nous aimerions particulièrement collaborer avec davantage d’éditeurs de navigateurs, qui jouent un rôle central dans l’écosystème Web.  

      ### Présentation technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) une présentation technique plus détaillée du fonctionnement des enquêtes.
