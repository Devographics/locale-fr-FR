  - key: award.tool_satisfaction_award.comment
    t: "Vite arrive une nouvelle fois en tête : **{value}** des développeurs souhaitent continuer à l’utiliser !"

  - key: award.tool_interest_award.comment
    t: "Vous aviez deviné Vite ? Pas tout à fait : cette année, **Vitest** est la technologie qui suscite le plus d’intérêt chez les développeurs, avec un taux de **{value}**."

  - key: award.most_write_ins_award.comment
    t: Avec **{value}** mentions, **Bun** est la technologie la plus citée dans les réponses libres, toutes catégories confondues.

  - key: award.most_commented_tool_award.comment
