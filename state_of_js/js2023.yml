  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.js2023
    t: |
      L’enquête State of JavaScript 2023 s’est déroulée du 22 novembre au 12 décembre 2023 et a recueilli 23 540 réponses. Les résultats ont été publiés le 20 juin 2024. Elle est organisée par [Devographics](https://devographics.com/), un collectif composé de moi-même ([Sacha Greif](https://sachagreif.com/)), d’[Eric Burel](https://www.lbke.fr/), d’experts invités et de contributeurs open source. 

      The State of JavaScript logo and t-shirt were designed by [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l’enquête

      Cette enquête vise à repérer les tendances à venir dans l’écosystème du développement Web afin d’aider les développeurs à choisir leurs technologies. 

      Elle cherche donc à anticiper les évolutions des prochaines années plutôt qu’à analyser les tendances actuelles. C’est pourquoi certaines fonctionnalités ou technologies peuvent être omises, même si elles sont déjà largement répandues. 

      Ces résultats constituent également un **instantané d’un sous-ensemble précis de développeurs** et ne prétendent pas représenter l’ensemble de l’écosystème. 

      ### Conception de l’enquête

      L’enquête s’appuie en partie sur celle de l’année précédente. Une période de commentaires ouverts a permis de discuter de son plan [sur GitHub](https://github.com/Devographics/surveys/issues?q=is%3Aissue+is%3Aopen+label%3A%22State+of+JS+2023%22). 

      Toutes les questions étaient facultatives. 

      ### Public de l’enquête

      L’enquête était librement accessible en ligne et les répondants n’ont fait l’objet d’aucune sélection. Ils provenaient principalement des éditions précédentes (informés par une liste de diffusion dédiée) et des réseaux sociaux. 

      Les frameworks, bibliothèques et autres projets pouvaient inviter leur public à participer, et certains l’ont fait au moyen de bannières, de publications, etc. Le graphique « Sources » présente une ventilation détaillée du trafic. 

      ### Financement du projet

      Le projet est financé par différentes sources :

      - **Vente de tee-shirts**. 

      - **Liens sponsorisés** : les liens vers les ressources recommandées en bas de chaque page sont fournis par nos partenaires [Frontend Masters](https://frontendmasters.com/) et [RenderATL](https://www.renderatl.com/).

      - **Financement direct** : cette année, [Google](https://www.google.com/) a financé mon travail sur l’enquête. 

      Toute contribution ou tout parrainage est vivement apprécié. Nous aimerions particulièrement collaborer avec davantage d’éditeurs de navigateurs, qui jouent un rôle central dans l’écosystème Web.  

      ### Présentation technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) une présentation technique plus détaillée du fonctionnement des enquêtes.

  # JS 2023

  - key: general.js2023.survey_intro
    t: >
      JavaScript a commencé comme langage de navigateur, avant de conquérir le serveur avec Node.js. 


      En 2023, l’écosystème semble enfin prêt à tenter de combler le fossé entre les deux. Avec des fonctionnalités comme les composants serveur React, des frameworks comme Solid et Qwik, ou des méta-frameworks comme Next.js et SvelteKit, mieux servir le code et les données aux clients est devenu le prochain grand objectif de JavaScript. 


      Ou devrions-nous plutôt dire TypeScript ? À ce stade, les deux sont difficiles à dissocier ; inutile donc d’essayer. 


      Répondez plutôt à l’enquête et aidez-nous à découvrir ce qui est nouveau, ce qui ne l’est plus et ce qui nous attend dans les prochaines années !

  - key: faq.data_used_js2023
    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_js2023.description
    t: >
      Toutes les données recueillies seront publiées librement. Les développeurs et les entreprises pourront s’en servir pour définir leurs priorités et leurs feuilles de route.

  - key: faq.survey_goals_js2023
    t: Quels sont les objectifs de l’enquête ?
  - key: faq.survey_goals_js2023.description
    t: >
      L’enquête vise à mesurer la notoriété et la popularité des fonctionnalités et bibliothèques JavaScript afin d’anticiper les tendances à venir.

  - key: faq.who_should_take_survey_js2023
    t: Qui devrait répondre à cette enquête ?
  - key: faq.who_should_take_survey_js2023.description
    t: >
      Cette enquête est ouverte à toute personne qui utilise JavaScript (ou TypeScript), régulièrement ou occasionnellement, au travail, dans le cadre de ses études ou simplement pour le plaisir !

  - key: faq.how_long_will_survey_take_js2023
    t: Combien de temps faut-il pour répondre à l’enquête ?
  - key: faq.how_long_will_survey_take_js2023.description
    t: >
      Selon le nombre de questions auxquelles vous répondez (elles sont toutes facultatives),
      l’enquête devrait prendre environ 15 à 20 minutes.

  - key: faq.learn_more_js2023
    t: Où puis-je en apprendre davantage ?
  - key: faq.learn_more_js2023.description
    t: Vous pouvez en apprendre davantage sur cette enquête dans [notre annonce](https://dev.to/sachagreif/the-state-of-js-2023-survey-is-now-open-2hah).

  - key: faq.survey_design_js2023
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_js2023.description
    t: >
      L’enquête a été conçue avec la contribution de la communauté, recueillie dans un [fil de discussion ouvert](https://github.com/Devographics/surveys/issues/224).

  - key: faq.results_released_js2023
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_js2023.description
    t: L’enquête se déroulera du 22 novembre au 12 décembre, et les résultats seront publiés peu après.
