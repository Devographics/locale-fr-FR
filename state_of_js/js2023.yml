  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L’édition 2023 de l’enquête annuelle sur les dernières tendances de l’écosystème JavaScript.

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.js2023
    t: |

      <span class="first-letter">I</span>l devrait maintenant être clair que, pour le meilleur ou pour le pire, JavaScript ne ralentit pas. 

      Entre les composants serveur, les actions serveur, les signaux, les compilateurs et bien d’autres nouveautés, les innovations apparaissent plus vite que la plupart d’entre nous ne peuvent les suivre. 

      Pour éviter la redoutable fatigue JavaScript, rappelez-vous que vous pouvez choisir votre rythme : bien sûr, vous pouvez rester à la pointe avec les pionniers, mais vous pouvez aussi avancer plus lentement et privilégier des technologies stables et éprouvées, puis adopter les nouveautés quand elles auront eu quelques années pour mûrir. 

      Puisqu’on parle de prendre son temps, vous vous demandez peut-être pourquoi les résultats de l’enquête 2023 sont publiés au milieu de l’année *2024*. Entre le lancement de la nouvelle enquête [State of HTML](https://2023.stateofhtml.com/), la création de nouveaux formats de questions, la collecte d’un nombre inédit de réponses libres et la réécriture d’une grande partie de notre code de visualisation des données, notre charge de travail s’est révélée pour le moins ambitieuse. 

      Nous espérons toutefois que le résultat justifiera tous ces efforts supplémentaires. Et nous comptons publier les prochaines éditions bien plus rapidement. 

      Ceci étant dit, découvrons ce que JavaScript nous a réservé récemment !

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: Tee-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l’enquête avec le tee-shirt State of JavaScript

      Entre la mauvaise qualité vidéo, les cassettes encombrantes et l’obligation de rembobiner, peu de choses nous manquent de l’époque des VHS. Mais les superbes visuels des années 90 qui décoraient les cassettes vierges, eux, nous manquent bel et bien. 

      Grâce au talent de Christopher Kirk-Nielsen, vous pouvez désormais profiter de tout ce style rétro tout en célébrant votre amour pour JavaScript !

  - key: tshirt.about
    t: À propos du tee-shirt

  - key: tshirt.description
    t: |
      Nous utilisons un tee-shirt ajusté, très doux et de grande qualité, composé de trois fibres et imprimé par nos partenaires de Cotton Bureau.

  - key: tshirt.getit
    t: Achetez-le

  - key: tshirt.price
    t: 32 $ US + frais de livraison

  - key: tshirt.designer.heading
    t: À propos du créateur

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est non seulement un formidable développeur front-end, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. Nous vous invitons d’ailleurs à découvrir ses [autres modèles de tee-shirts](https://chriskirknielsen.com/designs) !

  ###########################################################################
  # Sections
  ###########################################################################

  - key: sections.user_info.description
    t: |
      Cette année, **23 540** personnes ont répondu à l’enquête.

  - key: sections.features.description
    t: |
      Cette année, nous avons particulièrement cherché à cerner les difficultés rencontrées par les développeurs avec JavaScript. Sans surprise, le **manque de typage natif** et les **incohérences entre navigateurs** arrivent en tête de leurs catégories respectives, et touchent chacun près d’un tiers des développeurs.

  - key: sections.libraries.description
    t: |
      Nous avons remanié nos graphiques pour mettre en évidence non seulement l’expérience développeur, mais aussi le *ressenti*. Explorez les nouvelles options de regroupement et de tri pour découvrir quelles bibliothèques sont les plus… ou les moins appréciées !

  - key: sections.other_tools.description
    t: |
      Même si les discussions sur JavaScript semblent souvent se résumer au choix d’un framework, n’oublions pas qu’il existe tout un univers d’autres outils, services et plateformes à explorer !

  - key: sections.usage.description
    t: |
      Une fois encore, TypeScript semble s’être imposé comme le choix par défaut, du moins parmi les répondants. Pour le reste, les usages de JavaScript demeurent aussi variés que jamais !

  - key: sections.resources.description
    t: |
      Au lieu de proposer des listes prédéfinies parmi lesquelles choisir, nous avons simplement fourni des champs de texte libre. Résultat : de nombreux nouveaux noms figurent cette année dans la section Ressources !

  - key: sections.awards.description
    t: |
      Les prix de cette année ont été dominés par un projet bien précis… saurez-vous deviner lequel ?

