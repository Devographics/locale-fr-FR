  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.js2023.cassidy_williams
    t: |
      <span class="first-line">Quelle année formidable pour être sur Internet !</span>

      Il se passe tant de choses intéressantes et passionnantes que je garde du pop-corn près de mon clavier, tout en construisant et en observant !

      Il est fascinant de voir autant de bibliothèques « plus modestes », comme Preact, Solid et htmx, gagner en popularité face à un géant comme Next.js. Angular semble amorcer un retour, à suivre l’année prochaine. Certains chouchous du secteur perdent aussi de leur attrait. Les systèmes écrits en Rust se développent fortement, et Astro semble décoller côté soutien des développeurs.

      Pour les fonctionnalités réellement disponibles dans les navigateurs, on a presque l’impression que le monde n’arrive plus à suivre notre rythme. Ce n’est pas forcément une mauvaise chose ! Mais je partage tout à fait l’avis selon lequel la prise en charge par les navigateurs est ma principale préoccupation face à toutes ces nouveautés. 

      Cela dit, j’adore utiliser certaines des nouvelles fonctionnalités des tableaux et voir de plus en plus de personnes soutenir les PWA.

      L’année prochaine, améliorons la diversité des réponses, encourageons davantage de personnes à développer et espérons que toutes ces nouveautés passionnantes seront amusantes plutôt qu’intimidantes ! Merci à Sacha et à son équipe de m’avoir invitée et d’avoir organisé une nouvelle enquête aussi formidable et utile.

      À bientôt en ligne !

  - key: conclusion.js2023.cassidy_williams.bio
    t: Défenseur des développeurs, ingénieur, contributeur open source et créateur de mèmes

  - key: conclusion.js2023.theo_browne
    t: |
      <span class="first-line">JavaScript migre vers le serveur, et cela nous inquiète.</span>

      L’enquête de l’année dernière montrait l’adoption rapide de frameworks avec rendu serveur comme Next, Nuxt, Remix et SvelteKit. Cette année, nous nous sommes intéressés aux approches privilégiant le serveur, comme l’hydratation partielle et les Islands, dont l’adoption a doublé.

      Les frameworks… enfin, les bibliothèques comme htmx montrent que les développeurs Web ne sont pas les seuls à tirer parti du serveur. Les applications monopages ne disparaissent pas (regardez [Inertia](https://inertiajs.com/) pour vous en convaincre), mais à mesure que ces nouvelles approches progressent, le marché semble suivre.

      Cette évolution ne fait pas l’unanimité. React continue de progresser, mais ses développeurs s’inquiètent de plus en plus de sa direction. Le chemin a été… difficile, mais les progrès sont quotidiens.

      De plus en plus d’options apparaissent également en dehors de l’écosystème React. De [Nuxt](https://roe.dev/blog/nuxt-server-components) à [SolidStart](https://docs.solidjs.com/solid-start/reference/server/use-server) en passant par [Astro](https://astro.build/blog/astro-480/#experimental-astro-actions), toutes les meilleures fonctionnalités des composants serveur de React sont désormais proposées aux développeurs.

      Et bien sûr, Vite continue de dominer et s’impose aussi bien auprès des développeurs d’applications que des auteurs de frameworks. Difficile d’imaginer où nous en serions aujourd’hui sans lui !

  - key: conclusion.js2023.theo_browne.bio
    t: Créateur de Ping, uploadthing et create-t3-app, et vidéaste

