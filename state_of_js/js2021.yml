  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.js2021
    t: |

      <span class="first-line">JavaScript se porte bien mieux aujourd’hui qu’en 2016.</span>

      Lors de la première enquête State of JS, seuls 21 % d’entre vous utilisaient TypeScript, contre 69 % aujourd’hui. Alors que nous plaisantions autrefois sur la sortie quotidienne d’un nouveau framework front-end, **React** et **Vue** dominent depuis maintenant six ans. Et la part des personnes estimant que « JS évolue trop vite » est passée de 59 % à 38 %.

      Cela ne signifie pas pour autant que le langage a stagné. Les API **Optional Chaining** et **Nullish Coalescing** sont devenues les nouvelles API les plus utilisées de notre enquête, alors qu’elles n’ont que deux ans. Et TC39 nous réserve d’autres nouveautés : vous avez indiqué que la gestion des dates est l’une des principales fonctionnalités manquantes, et l’API Temporal a récemment atteint le [stade 3](https://github.com/tc39/proposal-temporal).

      L’écosystème des outils évolue lui aussi rapidement, et l’on peut dire que 2021 a été l’année de **Vite**. Vite a non seulement débuté avec 98 % de rétention, mais son utilisation atteint déjà 30 % dès sa première année dans notre enquête, dépassant même esbuild. Vite n’est pas seul à faire progresser les outils de build JavaScript : 8 des 12 outils que nous suivons ont moins de deux ans ! **pnpm**, **Turborepo** et **Nx** arrivent en tête lors de notre première année de suivi des outils de monorepo, mais seuls 25 % des répondants se déclarent satisfaits de cette catégorie, preuve qu’il reste beaucoup à faire. 

      À noter également : de nouveaux acteurs comme **Deno**, **Rome**, **Astro** et **Remix** bénéficient désormais du soutien de sociétés financées par le capital-risque, dessinant peut-être une alternative viable au fragile modèle de financement de l’open source.

      Alors que le [troisième âge de JavaScript](https://www.swyx.io/js-third-age/) entame sa troisième année, les possibilités continuent de s’ouvrir aux futurs contributeurs open source et entrepreneurs. J’ai hâte de voir ce que nous réservent les prochaines années !

  - key: conclusion.js2021.bio
    t: Responsable de l’expérience développeur chez Temporal

