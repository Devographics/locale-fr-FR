  - key: blocks.tools_quadrant.description
    t: |
      Ce graphique compare le **taux de rétention** de chaque technologie à son **nombre total d’utilisateurs**.
      Il se divise en quatre quadrants :

        - **1** : faible utilisation, forte rétention. Des technologies à suivre.

        - **2** : forte utilisation, forte rétention. Des technologies que l’on peut adopter sereinement.

        - **3** : faible utilisation, faible rétention. Des technologies difficiles à recommander pour le moment.

        - **4** : forte utilisation, faible rétention. Si vous utilisez ces technologies, réévaluez votre choix.

