  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.js2021
    t: >
      L’enquête State of JS 2021 s’est déroulée du 13 janvier au 2 février **2022** et a recueilli 16 085 réponses. Elle est organisée par [Sacha Greif](https://sachagreif.com/), avec l’aide d’une équipe de contributeurs et de consultants open source. 

      Le logo et le tee-shirt de cette année ont été conçus par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l’enquête

      Cette enquête, comme celle de [State of CSS](https://stateofcss.com/), vise à repérer les tendances à venir dans l’écosystème du développement Web afin d’aider les développeurs à choisir leurs technologies. 

      Ces enquêtes cherchent donc à anticiper les évolutions des prochaines années plutôt qu’à analyser les tendances actuelles. C’est pourquoi les fonctionnalités ou technologies les plus répandues ne sont pas toujours incluses. 

      Elles constituent également un **instantané d’un sous-ensemble précis de développeurs** et ne prétendent pas représenter l’ensemble de l’écosystème. 

      ### Conception de l’enquête

      L’enquête s’appuie en partie sur celle de l’année précédente. Une période de commentaires ouverts a permis de discuter de son plan [sur GitHub](https://github.com/StateOfJS/Monorepo/issues/56). 

      Toutes les questions étaient facultatives. 

      ### Public de l’enquête

      L’enquête était librement accessible en ligne et les répondants n’ont fait l’objet d’aucune sélection. Ils provenaient principalement des éditions précédentes (informés par une liste de diffusion dédiée) et des réseaux sociaux. 

      Les frameworks, bibliothèques et autres projets pouvaient inviter leur public à participer, et certains l’ont fait au moyen de bannières, de publications, etc. Le graphique « Sources » présente une ventilation détaillée du trafic. 

      ### Représentativité et inclusivité

      Nous estimons important de donner la parole à chaque communauté, mais une enquête ouverte comme celle-ci aura toujours du mal à représenter tout le monde, en particulier lorsqu’elle s’appuie sur des systèmes qui comportent déjà leurs propres biais. 


      Pour y remédier, nous mettons en œuvre trois stratégies distinctes :


      - **Sensibilisation** : nous cherchons à contacter différentes organisations (notamment des groupes axés sur les personnes racisées ou LGBTQ+, ou des plateformes de formation en ligne) afin de diversifier notre public. 

      - **Analyse des données** : grâce à des fonctionnalités comme les facettes et les variantes, nous cherchons à mieux faire entendre les différents groupes démographiques, même lorsqu’ils sont minoritaires dans nos données. 

      - **Réduction des obstacles** : une enquête trop longue, inaccessible, lente à charger ou uniquement en anglais impose un « coût d’effort » qui exclut les membres de la communauté qui ne peuvent pas le supporter. Corriger ces problèmes facilite la participation et diversifie notre public. 

      ### Financement du projet

      Le projet est financé par différentes sources :


      - **Vente de tee-shirts**. 

      - **Parrainage de graphiques** : les membres de la communauté peuvent soutenir l’enquête en échange de la mention de leur nom dans le rapport.  

      - **Liens sponsorisés** : les liens vers les ressources recommandées en bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Autres financements** : cette année, l’équipe [Google Chrome](https://www.google.com/chrome/) a prévu un petit budget pour engager une [consultante en accessibilité](https://fossheim.io/) chargée des enquêtes CSS et JS.


      Malgré ces sources de financement, les enquêtes restent principalement autofinancées ; toute contribution ou tout parrainage est donc vivement apprécié. J’aimerais particulièrement collaborer avec davantage d’éditeurs de navigateurs, qui jouent un rôle central dans l’écosystème Web.  

      ### Présentation technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb) une présentation technique plus détaillée du fonctionnement des enquêtes.

      - **Collecte des données** : application [Vulcan.js](http://vulcanjs.org/) personnalisée.

      - **Stockage et traitement des données** : MongoDB et agrégations MongoDB.

      - **API de données** : API GraphQL Node.js. 

      - **Site des résultats** : application React [Gatsby](https://www.gatsbyjs.com/).

      - **Visualisations des données** : bibliothèque de visualisation React [Nivo](https://nivo.rocks/). 

      - **Typographies** : [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) et [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue).

  - key: general.js2021.survey_intro
    t: |
      D’abord, les Jeux olympiques de 2020 ont été reportés à 2021,
      et maintenant l’enquête State of JavaScript 2021 se déroule en 2022 !

      C’est vrai : entre le travail, la famille et les bouleversements du monde,
      certaines choses ont été un peu perturbées.

      Même si l’année a pris un peu de retard, nous espérons que les données de
      l’enquête resteront aussi instructives et éclairantes que jamais.
      Et rassurez-vous, une autre enquête aura lieu vers la fin de l’année pour remettre les choses en ordre !
