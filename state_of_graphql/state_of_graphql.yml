  - key: blocks.tools_quadrant.description
    t: |
      Ce graphique présente le **taux de rétention** de chaque technologie en fonction de son **nombre total d'utilisateurs**.
      Il se divise en quatre quadrants :

        - **1** : utilisation faible, rétention élevée. Des technologies à surveiller.

        - **2** : utilisation élevée, rétention élevée. Des technologies que vous pouvez adopter en confiance.

        - **3** : utilisation faible, rétention faible. Des technologies difficiles à recommander pour le moment.

        - **4** : utilisation élevée, rétention faible. Si vous utilisez ces technologies, il peut être utile de les réévaluer.

