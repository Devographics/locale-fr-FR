  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le tee-shirt State of JavaScript

      Entre la mauvaise qualité vidéo, les cassettes encombrantes et l'obligation de rembobiner, l'époque des VHS ne nous manque pas vraiment. En revanche, les superbes visuels des années 90 qui décoraient les cassettes vierges nous manquent bel et bien.

      Mais grâce au talent de Christopher Kirk-Nielsen, vous pouvez désormais profiter de ce style rétro tout en affichant votre passion pour JavaScript !

