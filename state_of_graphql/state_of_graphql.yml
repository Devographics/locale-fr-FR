  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.graphql2022
    t: |

      <span class="first-line">GraphQL fait véritablement partie de notre façon de créer des applications modernes.</span>

      De plus en plus d'entreprises créent des produits, des services, des outils et des RFC, et la majeure partie de ce travail est menée en open source. C'est formidable à voir ! Une saine concurrence et une bonne collaboration sont essentielles à l'épanouissement d'un écosystème.

      Notre manière d'utiliser GraphQL côté client évolue donc : des bibliothèques comme urql et React Query sont aujourd'hui très populaires, aux côtés de références établies comme Apollo Client et Relay. GraphQL continue aussi de se développer dans d'autres langages que JavaScript : il existe désormais des serveurs et des clients GraphQL stables et matures dans presque tous les langages de programmation les plus populaires !

      GraphQL évolue également : plusieurs changements très attendus sont sur le point d'être intégrés officiellement à la spécification. Nous verrons bientôt arriver des évolutions autour de `stream`, `defer` et du polymorphisme des entrées, ainsi que des améliorations des abonnements et des requêtes en temps réel.

      Par ailleurs, des entreprises se consacrent désormais à la sécurité GraphQL, à la mise en cache, au traçage des erreurs, au déploiement en périphérie du réseau ou encore à l'abstraction des bases de données et des back-ends sous forme de schémas simples. Toutes ces initiatives rendent GraphQL plus accessible que jamais.

      Nous avons également récemment découvert une toute nouvelle version de GraphiQL, dotée d'un puissant écosystème de plugins, de moins de dépendances et même d'un mode sombre ! La [GraphQL Foundation](https://graphql.org/foundation/) continue de grandir : de nouveaux membres la rejoignent régulièrement pour soutenir les efforts de celles et ceux qui contribuent à la formation, au développement et à l'avenir de GraphQL.

      GraphQL a trouvé sa place dans l'écosystème, et son avenir s'annonce passionnant !

  - key: conclusion.graphql2022.bio
    t: Responsable des relations développeurs chez Grafbase

