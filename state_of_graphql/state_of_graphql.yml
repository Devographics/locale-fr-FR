  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.graphql2022
    t: >
      L'enquête State of GraphQL 2022 s'est déroulée du 15 juin au 15 juillet 2022 et a recueilli 3 094 réponses. Elle est principalement organisée par [Sacha Greif](https://sachagreif.com/), avec l'aide d'une équipe de contributeurs et de consultants open source.

      ### Objectifs de l'enquête

      Cette enquête, comme celles de [State of CSS](https://stateofcss.com/) et de [State of JS](https://stateofjs.com/), vise à repérer les tendances émergentes de l'écosystème du développement web afin d'aider les développeurs à faire leurs choix technologiques.


      En raison de la taille relativement réduite de l'échantillon, cette enquête doit être considérée comme un **aperçu d'un sous-ensemble de développeurs** ; elle n'a pas vocation à représenter l'ensemble de l'écosystème GraphQL.


      Cette enquête **n'est pas affiliée à GraphQL ni à Facebook**.

      ### Conception de l'enquête

      L'enquête a été conçue de manière collaborative, avec une période ouverte de commentaires durant laquelle son contenu a été discuté sur GitHub ([1](https://github.com/Devographics/Monorepo/issues/86), [2](https://github.com/Devographics/Monorepo/issues/90)). Toutes les questions étaient facultatives.

      ### Public de l'enquête

      L'enquête était librement accessible en ligne et les participants n'ont fait l'objet d'aucun filtrage ni d'aucune sélection. Ils sont principalement arrivés depuis les réseaux sociaux.

      ### Représentativité et inclusivité

      Nous pensons qu'il est important de donner la parole à toutes les communautés. Cependant, une enquête ouverte comme celle-ci aura toujours du mal à représenter tout le monde, en particulier lorsqu'elle s'appuie sur des systèmes qui comportent déjà leurs propres biais.


      Pour tenter de rééquilibrer la situation, nous mettons en œuvre trois stratégies distinctes :


      - **Sensibilisation** : nous essayons toujours de contacter différentes organisations (par exemple des organisations dédiées aux personnes BIPOC ou LGBTQ, ou des plateformes d'enseignement en ligne) afin de diversifier notre public.

      - **Analyse des données** : grâce à des fonctionnalités comme les facettes et les variantes, nous cherchons constamment à mieux faire entendre les voix de tous les groupes démographiques, même ceux qui sont très minoritaires dans nos données.

      - **Réduction des obstacles** : une enquête trop longue, inaccessible, lente à charger ou disponible uniquement en anglais impose un « coût d'effort » qui exclut les membres de la communauté qui ne peuvent pas le supporter. Corriger ces problèmes facilite la participation et contribue à diversifier notre public.


      ### Financement du projet

      Ce projet est financé par différentes sources :


      - **Parrainage de graphiques** : les membres de la communauté peuvent contribuer au financement de l'enquête en échange de la mention de leur nom dans le rapport.

      - **Liens sponsorisés** : les liens vers les ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Autres financements** : les entreprises mentionnées dans la section « Nos partenaires » de la [page d'introduction](/introduction) ont également apporté une contribution financière ou autre.


      Les sponsors n'interviennent ni dans le contenu de l'enquête ni dans la présentation des résultats. Les parrainages ne sont décidés qu'une fois toutes les données recueillies.

      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb) un aperçu technique plus détaillé du fonctionnement des enquêtes.


      - **Collecte des données** : application [Vulcan.js](http://vulcanjs.org/) personnalisée.

      - **Stockage et traitement des données** : MongoDB et agrégations MongoDB.

      - **API de données** : API GraphQL Node.js.

      - **Site des résultats** : application React utilisant [Gatsby](https://www.gatsbyjs.com/).

      - **Visualisation des données** : bibliothèque de visualisation React [Nivo](https://nivo.rocks/).

      - **Polices** : [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) et [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue).

  - key: general.graphql2022.survey_intro
    t: |
      À son lancement, GraphQL proposait une approche radicalement nouvelle de la création d'API, offrant davantage de contrôle, de granularité et de flexibilité.

      Mais cette flexibilité avait un prix : une complexité accrue. Une multitude de frameworks, de bibliothèques et de services sont rapidement apparus pour proposer de meilleures approches et de meilleurs flux de travail.

      Aujourd'hui, pour la toute première fois, nous interrogeons la communauté GraphQL afin de découvrir quels outils sont les plus populaires et quelles fonctionnalités sont réellement utilisées. Avec votre aide, découvrons ce qui a marqué GraphQL en 2022 !
