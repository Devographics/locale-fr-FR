  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2022 de l'enquête annuelle sur les dernières tendances de l'écosystème GraphQL.

  - key: general.livestream_announcement
    t: Ne manquez pas notre [diffusion en direct spéciale consacrée aux résultats de l'enquête](https://dev.to/sachagreif/state-of-javascript-2021-livestream-24a5) le 22 février ! (en anglais)

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.graphql2022
    t: >

      <span class="first-letter">D</span>epuis sa création chez Facebook en septembre 2015, de nombreux développeurs ont adopté GraphQL, une nouvelle approche prometteuse pour créer des API.


      Pourtant, sept ans plus tard, de nombreuses questions restent en suspens : dans quels cas avez-vous réellement besoin de GraphQL ? Faut-il écrire votre API GraphQL à la main ou la générer à partir de votre base de données ? Et GraphQL remplacera-t-il un jour REST ?


      Pour répondre à ces questions et à bien d'autres, nous avons créé la toute première enquête communautaire **State of GraphQL**. Plus de 3 000 développeurs y ont participé cette année, et ce n'est qu'un début.


      Nous espérons que vous prendrez plaisir à explorer les données. N'hésitez pas également à découvrir notre [API GraphQL](https://graphiql.devographics.com/) !


      <span class="conclusion__byline">– Sacha Greif</span>

