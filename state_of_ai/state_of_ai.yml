  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_ai.description
    t: L'enquête annuelle sur l'utilisation de l'IA par les développeurs web

  - key: general.state_of_ai.intro
    t: |
      Si l'on en croit les réseaux sociaux, la révolution de l'IA a déjà bouleversé le développement web : beaucoup d'entre nous créeraient des applications entièrement fonctionnelles avant même le petit-déjeuner et gagneraient des millions grâce à cela.

      Mais est-ce vraiment le cas ? Ou l'IA n'est-elle qu'une mode passagère qui ne changera pas fondamentalement les choses ? Ou peut-être quelque chose entre les deux ?

      Aidez-nous à y voir plus clair en répondant à notre enquête annuelle « State of Web Dev AI », et explorons ensemble comment l'IA façonne l'avenir du développement web !

  ###########################################################################
