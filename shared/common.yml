locale: fr-FR
translations:
  ###########################################################################
  # General
  ###########################################################################

  # homepage
  - key: general.why_create_account
    t: Pourquoi dois-je créer un compte ?
  - key: general.create_account_reasons
    t: >
      Nous vous demandons de créer un compte pour :
      - Éviter les réponses dupliquées
      - Vous donner accès à vos données
      - Enregistrer vos réponses en cours
      - Vous tenir au courant de la sortie des résultats
  - key: general.survey_closed_detailed
    t: >
      Désolé, le questionnaire est terminé ! Vous pouvez toujours voir vos réponses mais vous ne pourrez pas les modifier.
  - key: general.survey_read_only
    t: >
      Vous êtes actuellement en train de voir ce questionnaire en lecture seule.
  - key: general.survey_preview
    t: >
      Cette enquête est en mode preview. Les questions peuvent changer, et toutes 
      les données seront supprimées lors de l'ouverture de l'enquête.
  - key: general.survey_read_only_back
    t: >
      <a href="{link}">Retourner</a> à la page principale du questionnaire pour commencer ou continuer à répondre.
  - key: general.take_survey
    t: Répondez à l'enquête {name}
  # surveys
  - key: general.open_surveys
    t: Questionnaires en cours
  - key: general.no_open_surveys
    t: Aucun questionnaire n'est actuellement en cours.
  - key: general.closed_surveys
    t: Questionnaires terminés
  - key: general.start_survey
    t: Commencer à répondre »
  - key: general.continue_survey
    t: Continuer à répondre »
  - key: general.review_answers
    t: Revoir mes réponses »
  - key: general.review_survey
    t: Revoir les questions »
  - key: general.preview_survey
    t: Prévisualiser le questionnaire »
  - key: general.finish_survey
    t: Terminer le questionnaire
  - key: general.survey_closed
    t: Ce questionnaire est maintenant terminé.
  - key: general.survey_results
    t: Voir les résultats du questionnaire »
  - key: general.surveys_available_languages
    t: "Questionnaires disponibles en:"
  - key: general.help_us_translate
    t: Aidez-nous à traduire les questionnaires »
  - key: general.translators
    t: Traducteurs
  - key: general.translation_help
    t: Aide à la traduction
  - key: general.new
    t: Nouveau
  - key: general.devographics_banner
    t: <a href="https://www.devographics.com/" target="_blank">Devographics</a> est le nouveau nom du collectif qui organise les enquêtes State of JS, CSS et GraphQL.

  # footer
  - key: general.privacy_policy
    t: Politique de confidentialité
  - key: general.leave_issue
    t: Une question ? Un bug ? <a href="{link}" target="_blank">Rapportez un problème</a>.
  - key: general.emoji_icons
    t: Icônes emoji par <a target="_blank" rel="noreferrer" href="https://icons8.com">Icons8</a>

  # navigation
  - key: general.table_of_contents
    t: Sommaire
  - key: general.all_questions_optional
    t: >
      Note : toutes les questions sont optionnelles, il n'est pas nécessaire de remplir 100% du questionnaire.
  - key: general.data_is_saved
    t: Vos réponses sont sauvegardées à chaque fois que vous naviguez entre les sections.

  # thanks
  - key: general.back
    t: Retour
  - key: general.thanks
    t: >
      Merci d'avoir rempli le questionnaire !
      Vos réponses sont sauvegardées. Vous pouvez les revoir ou les modifier jusqu'à ce que le questionnaire se termine.
      Vous pouvez aussi nous aider en faisant connaître le questionnaire en le partageant. Chaque action compte et rendra
      nos données encore plus représentatives.
  - key: thanks.learn_more_about
    t: "Quelques éléments sur lesquels vous souhaiteriez en apprendre plus :"
  - key: thanks.knowledge_score
    t: Score de votre connaissance
  - key: thanks.score_explanation
    t: >
      Vous avez entendu parlé ou déjà utilisé <span class="score-number score-number-known">{known}</span> /
      <span class="score-number score-number-total">{total}</span> éléments mentionnés dans le questionnaire, ce qui
      vous place dans le top <span class="score-number score-number-ranking">{knowledgeRankingFromTop}%</span>
      de tous les répondants.
  - key: thanks.share_on_twitter
    t: Partager sur Twitter
  - key: thanks.share_score_message
    t: >
      J'ai obtenu un score de connaissance de {score} sur le questionnaire #{hashtag} de cette année! Pour y participer, rendez-vous ici: {shareUrl}
  # share
  - key: general.share_subject
    t: >
      {surveyName} questionnaire
  - key: general.share_text
    t: >
      Le questionnaire {surveyName} de cette année est ouvert ! {link}
  # forms
  - key: forms.select_option
    t: Selectionnez une option

  # partners
  - key: sponsors.our_partners
    t: Nos partenaires
  - key: sponsors.become_partner
    t: Devenir un partenaire

  # 404
  - key: notfound.title
    t: 404 Page non trouvée
  - key: notfound.description
    t: Désolé, nous n'avons pu trouver ce que vous cherchez.

  # other
  - key: general.join_discord
    t: Rejoignez notre <a href="{link}">Discord</a>.
  - key: general.translator_mode
    t: Appuyez sur option/alt pour activer le mode traducteur.
  - key: general.charts_nivo
    t: Graphes réalisés avec <a href="{link}">Nivo</a>.

