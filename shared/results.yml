  - key: features.features_ratios_over_time
    t: Fonctionnalités au fil du temps
  - key: features.features_ratios_over_time.description
    t: |
      Ce graphique montre l'évolution des fonctionnalités au fil des années, organisée autour de six ratios clés fondés eux-mêmes sur des données d'expérience et de sentiment.

