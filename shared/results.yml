      tandis que les segments plus clairs correspondent aux sentiments négatifs.

  # tools experience ranking
  - key: blocks.tools_experience_ranking
    t: Classements au fil du temps
  - key: blocks.tools_experience_ranking.percentages
    t: Pourcentages
  - key: blocks.tools_experience_ranking.rankings
    t: Classements
  - key: blocks.tools_experience_ranking.description
    t: Classements des ratios de fidélisation, d'intérêt, d'utilisation et de notoriété.
  - key: blocks.tools_experience_ranking.note
    t: |
      Les technologies dont la notoriété est inférieure à 10 % ne sont pas incluses. Chaque ratio est défini comme suit :

      - Fidélisation : **réutiliserait** / (**réutiliserait** + **ne réutiliserait pas**)
      - Intérêt : **souhaite apprendre** / (**souhaite apprendre** + **pas intéressé**)
      - Utilisation : (**réutiliserait** + **ne réutiliserait pas**) / **total**
      - Notoriété : (**total** - **n'en a jamais entendu parler**) / **total**

