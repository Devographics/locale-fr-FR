  ###########################################################################
  # Help
  ###########################################################################

  - key: help.title
    t: >
      À la une des fonctionnalités :

  - key: help.description
    t: En savoir plus sur les fonctionnalités du sondage

  - key: help.correlations
    t: Corrélations

  - key: help.correlations.description
    t: >
      Ces scores générés automatiquement mettent en évidence les corrélations entre deux éléments du jeu de données, selon des indicateurs tels qu'un score **plus élevé** à une question, la sélection de **davantage d'éléments** pour une question ou la sélection d'une **réponse précise**.

  - key: help.query_builder
    t: Constructeur de requêtes

  - key: help.query_builder.description
    t: >
      Le constructeur de requêtes vous permet d'ajouter des filtres au graphique actuel afin d'interroger dynamiquement l'API Devographics et de générer une variante personnalisée.

  - key: help.export_data
    t: Exporter les données

  - key: help.export_data.description
    t: >
      Vous pouvez exporter les données JSON brutes utilisées pour générer le graphique ou obtenir la requête GraphQL utilisée pour récupérer ces données.

  - key: help.comments
    t: Commentaires

  - key: help.comments.description
    t: >
      Pendant le sondage, les répondants pouvaient donner leur avis sur chaque question grâce à un champ de commentaire libre séparé.

  - key: help.freeform_answers
    t: Réponses libres

  - key: help.freeform_answers.description
    t: >
      Les réponses aux questions à champ de texte libre sont associées à des mots-clés précis (dans ce cas **{topic}**) grâce à une combinaison de traitements automatisés et manuels des données.

  - key: help.boxplot
    t: Graphique en boîte à moustaches

  - key: help.boxplot.description
    t: >
      Les graphiques en boîte à moustaches affichent les 10e, 25e, 50e (c'est-à-dire la **médiane**), 75e et 90e [percentiles](https://www.mathsisfun.com/data/percentiles.html) d'un jeu de données. Vous pouvez aussi utiliser les contrôles intégrés pour afficher la **moyenne** à la place.

  - key: help.stacked_bar
    t: Graphique à barres empilées

  - key: help.stacked_bar.description
    t: >
      Les graphiques à barres empilées partent d'une question puis décomposent chaque barre pour montrer comment ce sous-groupe a répondu à une autre question. Vous pouvez utiliser la légende pour modifier le tri et l'ordre.

  - key: help.two_series_scatterplot
    t: Nuage de points

  - key: help.two_series_scatterplot.description
    t: >
      Les nuages de points prennent un ensemble d'éléments et les placent sur une grille accompagnée d'une [droite de tendance](https://www.mathsisfun.com/definitions/trend-line.html), chaque axe correspondant à une variable différente.

