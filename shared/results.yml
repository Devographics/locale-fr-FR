  - key: tokyodev.relocation
    t: |
      Trouver un emploi au Japon

  - key: tokyodev.relocation.description
    t: |
      S'installer au Japon ne doit pas rester un simple rêve. Le cours accéléré de TokyoDev pour les développeurs souhaitant venir au Japon aborde notamment le travail dans une entreprise japonaise, le salaire auquel vous pouvez vous attendre, les visas disponibles et la difficulté à les obtenir.

  - key: frontendmasters.learning_path
    t: |
      Votre parcours pour devenir développeur web senior

  - key: frontendmasters.learning_path.description
    t: |
      Vous souhaitez faire évoluer votre carrière ? Approfondissez JavaScript, React, les performances web, le CSS, le déploiement de sites, TypeScript et la programmation fonctionnelle pour passer dès aujourd'hui de junior à senior.

  - key: storyblok.technologies
    t: React? Vue? Astro? JS?

  - key: storyblok.technologies.description
    t: |
      Peu importe, nous parlons JSON. Storyblok est un CMS headless compatible avec tous les frameworks et plateformes modernes : vous êtes donc entièrement libre de choisir la meilleure option pour votre projet. Commencez en quelques minutes !
