  ###########################################################################
  # Hints
  ###########################################################################

  - key: hints.hint_hint
    t: >
      Vous trouverez de petites indications comme celle-ci dans les résultats du sondage,
      qui vous signaleront des fonctionnalités et détails supplémentaires.

  - key: hints.units_switcher_hint
    t: >
      Vous pouvez utiliser le contrôle segmenté au bas de chaque bloc pour passer
      d'une unité à l'autre et obtenir une autre vue des mêmes données.

  - key: hints.export_hint
    t: >
      L'onglet <span class="hint-icon hint-export-button">Données</span> vous permet de consulter les
      données brutes de n'importe quel graphique, de les afficher en JSON ou d'obtenir une requête GraphQL à
      exécuter sur notre API publique.

  - key: hints.completion_hint
    t: >
      Comme toutes les questions sont facultatives, certaines ont reçu moins de réponses que d'autres.
      L'indicateur de complétion (<span class="hint-completion-indicator">◕</span>) vous indique exactement combien de personnes ont répondu à une question donnée.

  - key: hints.tool_modal_hint
    t: >
      Vous pouvez cliquer sur le nom d'une technologie pour obtenir davantage de détails
      et examiner plus précisément les données qui lui sont associées.

  - key: hints.rankings_modes_hint
    t: >
      Le graphique Expérience au fil du temps peut basculer entre fidélisation, intérêt, utilisation et notoriété
      afin de vous donner une vision plus complète d'une catégorie.

  - key: hints.sharing_hint
    t: >
      Il est scientifiquement prouvé que partager ce sondage sur Twitter, Facebook ou par email
      améliore vos performances en programmation jusqu'à 15 %.

  - key: hints.tshirt_hint
    t: >
      Autre découverte scientifique garantie : acheter notre t-shirt
      augmentera vos compétences en programmation de plus de 9000 !

  - key: hints.variants_hint
    t: >
      Certains graphiques comportent des onglets supplémentaires proposant des répartitions complémentaires des mêmes données,
      ou des données associées. N'oubliez pas de les consulter !

  - key: hints.share_hint
    t: >
      L'onglet <span class="hint-icon hint-share-button">Partager</span> facilite le partage de n'importe quel graphique,
      ou même son téléchargement sous forme d'image.

  - key: hints.bracket_hint
    t: >
      <span class="hint-bracket"><span class="hint-text">Le graphique suivant présente les résultats d'un tournoi à élimination directe de 8 participants, dans lequel
      les répondants devaient choisir le gagnant de chaque confrontation jusqu'à ce qu'il n'en reste plus qu'un.</span><span class="hint-diagram"/></span>

  - key: hints.comments_hint
    t: >
      L'onglet <span class="hint-icon hint-comment-button">Commenter</span> vous permet de consulter les commentaires laissés par les répondants pendant le sondage.

  ###########################################################################
  # Sponsor Chart
  ###########################################################################

  - key: sections.sponsor_finish.title
    t: Merci

  - key: sponsor.sponsor_finish
    t: >
      Merci de soutenir le sondage. Votre avatar devrait apparaître à côté du graphique choisi
      dans l'heure qui suit. Si ce n'est pas le cas, veuillez [nous contacter](mailto:chartsponsor@stateofjs.com).

  - key: sponsor.sponsored_by
    t: >
      **{name}** a fait don de **${amount}** pour sponsoriser ce graphique

  - key: sponsor.sponsor_button
    t: Sponsoriser ce graphique

  - key: sponsor.sponsor_chart.title
    t: Sponsoriser le graphique « {title} »

  - key: sponsor.sponsor_chart.description
    t: >
      Soutenez financièrement ce sondage en faisant un don d'au moins 10 $, et faites apparaître
      votre avatar Twitter à côté d'un graphique !

  - key: sponsor.chart_id
    t: "ID du graphique : "

  - key: sponsor.sponsor_this_chart
    t: Sponsoriser ce graphique (${baseAmount}+)

  - key: sponsor.how_it_works.title
    t: Fonctionnement

  - key: sponsor.how_it_works.description
    t: >
      1. Lorsque vous **cliquez sur le bouton « Sponsoriser ce graphique »**, vous êtes redirigé vers la page de paiement de notre partenaire [SendOwl](https://www.sendowl.com/).


      2. Vous pouvez ensuite **ajuster le montant** avec lequel vous souhaitez sponsoriser le sondage, à partir de 10 USD.


      3. Une fois le paiement effectué, vous pourrez **indiquer votre nom d'utilisateur Twitter**.


      4. Une page de **téléchargement de fichier** s'affichera, mais vous pouvez l'ignorer.


      5. Le site sera reconstruit en arrière-plan et votre nom d'utilisateur ainsi que votre don **apparaîtront à côté du graphique dans l'heure qui suit**.

  - key: sponsor.faq.title
    t: F.A.Q.

  - key: sponsor.faq.usage.title
    t: À quoi servira mon don ?

  - key: sponsor.faq.usage.description
    t: Votre don aidera à soutenir les mainteneurs des sondages et à recruter davantage de contributeurs (illustrateurs, experts en accessibilité et diversité, etc.).

  - key: sponsor.faq.public.title
    t: Mon don sera-t-il public ?

  - key: sponsor.faq.public.description
    t: Oui. Votre **nom d'utilisateur Twitter** ainsi que le **montant de votre don** seront affichés publiquement à côté du graphique.

  # - key: sponsor.faq.donation_public.title
  #   t: Can I donate on somebody else's behalf?

  # - key: sponsor.faq.donation_public.description
  #   t: You can enter a Twitter username other than your own, but that person will have the right to remove the donation if they request it.

  - key: sponsor.faq.refund.title
    t: Quelle est votre politique de remboursement ?

  - key: sponsor.faq.refund.description
    t: Tous les dons sont remboursables dans un délai d'une semaine, déduction faite des frais de transaction.

  - key: sponsor.faq.influence.title
    t: Les dons influencent-ils le contenu du sondage ?

  - key: sponsor.faq.influence.description
    t: Les dons sont effectués une fois le sondage publié et les donateurs n'ont aucune influence sur son contenu.

  - key: sponsor.faq.feedback.title
    t: Où puis-je laisser un commentaire ou poser une question ?

  - key: sponsor.faq.feedback.description
    t: Vous pouvez le faire [sur GitHub](https://github.com/StateOfJS/Monorepo/issues/69) ou [sur notre Discord](https://discord.gg/tuWRUWVyJs).

