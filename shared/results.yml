  # Correlations
  ###########################################################################

  - key: correlations.correlations_trigger
    t: "{count} corrélations trouvées avec d'autres variables"

  # heading

  # note: we need tu support a custom directionLabel for heading such as
  # "correlation for scoring **to the right** on…"

  - key: correlations.heading.trend
    t: |
      Corrélations pour obtenir un score <span class="correlation-direction">{directionLabel}</span> à **« {questionLabel} »**

  - key: correlations.heading.option
    t: |
      Corrélations pour sélectionner **« {optionLabel} »** pour **« {questionLabel} »**

  - key: correlations.heading.cardinality
    t: |
      Corrélations pour sélectionner <span class="correlation-direction">davantage</span> d'éléments pour **« {questionLabel} »**

  - key: correlations.exclusions
    t: "Exclu : "
  - key: correlations.exclusions.description
    t: Certaines paires de corrélations sont filtrées manuellement lorsqu'elles sont jugées trop évidentes ou peu pertinentes.

  - key: correlations.note
    t: |
      Les questions et les réponses individuelles sont comparées entre elles à l'aide de la [corrélation de rang de Spearman](https://fr.wikipedia.org/wiki/Corr%C3%A9lation_de_Spearman). Seules les corrélations reposant sur un nombre suffisant de réponses et dépassant un seuil minimal de force sont affichées, et les corrélations triviales (par ex. « vivre en Espagne est corrélé au fait de parler espagnol ») peuvent être exclues automatiquement.

      Veuillez noter que [corrélation n'implique pas causalité](https://fr.wikipedia.org/wiki/Corr%C3%A9lation_n%27implique_pas_causalit%C3%A9), et qu'il s'agit d'associations brutes générées automatiquement, sans [contrôle des autres facteurs](https://fr.wikipedia.org/wiki/Facteur_de_confusion). De plus, avec des milliers de paires comparées, certaines corrélations peuvent aussi être [dues au hasard](https://fr.wikipedia.org/wiki/Probl%C3%A8me_des_comparaisons_multiples).

  - key: correlations.takeaway.with_question
    t: |
      Corrélation <span class="correlation-item-content-strength">{strengthLevelLabel}</span> avec un score <span class="correlation-direction">{directionLabel}</span> à **« {questionLabel} »**.
    aliases:
      - correlations.takeaway.shape1
      - correlations.takeaway.shape2
      - correlations.takeaway.shape7

  - key: correlations.takeaway.with_option
    t: |
      Corrélation <span class="correlation-item-content-strength">{strengthLevelLabel}</span> <span class="correlation-direction">{directionLabel}</span> avec la sélection de **« {optionLabel} »** pour **« {questionLabel} »**
    aliases:
      - correlations.takeaway.shape3
      - correlations.takeaway.shape4
      - correlations.takeaway.shape8

  - key: correlations.takeaway.with_cardinality
    t: |
      Corrélation <span class="correlation-item-content-strength">{strengthLevelLabel}</span> avec la sélection de <span class="correlation-direction">{directionLabel}</span> d'éléments pour **« {questionLabel} »**.
    aliases:
      - correlations.takeaway.shape5
      - correlations.takeaway.shape6
      - correlations.takeaway.shape9

