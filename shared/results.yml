  # tools quadrant
  - key: blocks.tools_quadrant
    t: Satisfaction vs utilisation
    aliases:
      - tools.scatterplot_overview
      - libraries.scatterplot_overview
  - key: blocks.tools_quadrant.description
    t: |
      Ce graphique affiche le **ratio de fidélisation** de chaque technologie en fonction de son **nombre total d'utilisateurs**.
      Il peut être divisé en quatre quadrants :

        - **1** : faible utilisation, forte fidélisation. Technologies à surveiller.

        - **2** : forte utilisation, forte fidélisation. Technologies que l'on peut adopter sereinement.

        - **3** : faible utilisation, faible fidélisation. Technologies plus difficiles à recommander actuellement.

        - **4** : forte utilisation, faible fidélisation. Réévaluez ces technologies si vous les utilisez actuellement.

