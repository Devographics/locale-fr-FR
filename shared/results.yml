  - key: custom_data.customize
    t: Personnaliser les données
  - key: custom_data.details
    t: >

      1. Copiez le contenu du champ « Requête GraphQL » et collez-le dans le panneau central de l'[explorateur d'API GraphQL](https://graphiql.stateofjs.com/).

      2. Modifiez la requête en ajoutant un ou plusieurs **filtres** à l'aide de la barre latérale gauche de l'explorateur. Veillez à conserver la structure générale des données.

      3. Dans la fenêtre de l'explorateur, cliquez sur le bouton Lecture (« Exécuter la requête »).

      4. Copiez les résultats de la requête modifiée (`{ data: … }`) dans le champ « Données personnalisées » ci-dessus et envoyez-les.

  # Tools usage variations
  - key: blocks.tools_usage_variations
    t: Variations d'utilisation
  - key: blocks.tools_usage_variations.description
    t: |
      Comment différents facteurs tels que la tranche de revenus, les années d'expérience
      ou la taille de l'entreprise influencent l'utilisation (participants ayant répondu
      « réutiliserait » ou « ne réutiliserait pas »).

      La référence représente l'utilisation de base de chaque outil et les écarts
      correspondent à la différence par rapport à cette référence dans chaque tranche. Supposons
      que l'utilisation globale de l'outil X soit de 10 % parmi tous les répondants (la référence) :
      si le pourcentage d'utilisateurs ayant entre 1 et 2 ans d'expérience qui utilisent cet outil
      est de 13 % (par rapport à tous les utilisateurs ayant entre 1 et 2 ans d'expérience),
      l'écart positif est alors de +3 %.
  - key: blocks.tools_usage_variations.note
    t: |
      Gardez à l'esprit que les outils ayant une utilisation globale plus faible ont tendance à varier davantage.

