  - key: blocks.all_sections_tools_cardinality_by_user
    t: Nombre de technologies utilisées
  - key: blocks.all_sections_tools_cardinality_by_user.description
    t: >
      Pour chaque section, quel pourcentage de répondants **utilise**
      (c'est-à-dire ayant répondu « utiliserait à nouveau ») une, deux, trois technologies ou plus.
      La barre tout en bas représente la somme de toutes les autres barres.

