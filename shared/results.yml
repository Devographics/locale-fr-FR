  - key: ratios.awareness
    aliasFor: options.experience_ranking.awareness
  - key: ratios.retention
    t: Satisfaction
  - key: ratios.positivity
    t: Positivité
  - key: ratios.positivityRelative
    t: Positivité relative
  - key: ratios.appreciation
    t: Appréciation

  - key: ratios.interest.description
    t: >
      Proportion de **sentiment positif** parmi les répondants ayant **entendu parler** d'un élément et exprimé un sentiment
  - key: ratios.usage.description
    t: >
      Proportion de répondants ayant **utilisé** un élément
  - key: ratios.awareness.description
    t: >
      Proportion de répondants ayant **entendu parler ou utilisé** un élément
  - key: ratios.retention.description
    t: >
      Proportion de **sentiment positif** parmi les répondants ayant **utilisé** un élément et exprimé un sentiment
  - key: ratios.positivity.description
    t: >
      Proportion de **sentiment positif** parmi tous les répondants
  - key: ratios.positivityRelative.description
    t: >
      Proportion de **sentiment positif** parmi tous les répondants ayant exprimé un sentiment, quelle que soit leur expérience avec l'élément.
  - key: ratios.appreciation.description
    t: >
      Écart, en points de pourcentage, entre l'**intérêt** (**sentiment positif** parmi les répondants qui en ont entendu parler) et la **satisfaction** (**sentiment positif** parmi ceux qui l'ont utilisé). En d'autres termes, il mesure à quel point les répondants apprécient davantage un élément après l'avoir utilisé, par rapport au moment où ils en avaient seulement entendu parler.

