      on obtient une référence attendue de **{normalizedCount}** répondants dans cette intersection.

  - key: explorer.count_details.4_extra
    t: |
      Le nombre réel est de **{cellCount}**, et ces **{normalizedCountDelta}** répondants supplémentaires sont *mis en évidence*.

  - key: explorer.count_details.4_missing
    t: |
      Le nombre réel est de **{cellCount}**, et ces **{normalizedCountDelta}** répondants manquants apparaissent sous forme de points vides.

  - key: explorer.percentage_details.1_extra
    t: |
      Globalement, **{xAxisPercentage}%** des répondants « {xAxisLabel} » ont sélectionné « {xAnswerLabel} », mais
      parmi les **répondants « {yAxisLabel} » ayant sélectionné « {yAnswerLabel} »**, ce pourcentage atteint **{bucketPercentage}%**.

  - key: explorer.percentage_details.1_missing
    t: |
      Globalement, **{xAxisPercentage}%** des répondants « {xAxisLabel} » ont sélectionné « {xAnswerLabel} », mais
      parmi les **répondants « {yAxisLabel} » ayant sélectionné « {yAnswerLabel} »**, ce pourcentage descend à **{bucketPercentage}%**.

  - key: explorer.percentage_details.2_extra
    t: |
      Ces **{normalizedPercentageDelta}%** répondants supplémentaires sont *mis en évidence*.

  - key: explorer.percentage_details.2_missing
    t: |
      Ces **{normalizedPercentageDelta}%** répondants manquants apparaissent sous forme de points vides.

  # - key: explorer.percentage_details.1
  #   t: |
  #     **{xAxisPercentage}%** of **{xAxisTotal}** “{xAxisLabel}” respondents selected “{xAnswerLabel}”.

  # - key: explorer.percentage_details.2
  #   t: |
  #       **{yAxisPercentage}%** of “{yAxisLabel}” respondents selected “{yAnswerLabel}”.

  # - key: explorer.percentage_details.3
  #   t: |
  #       Applying that percentage to the previous **{xAxisTotal}** respondents figure
  #       gives us an expected baseline of **{normalizedPercentage}%** of respondents in this intersection.

  # - key: explorer.percentage_details.4_extra
  #   t: |
  #       The actual percentage is **{bucketPercentage}%**, and those extra **{normalizedPercentageDelta}%** respondents are *highlighted*.

  # - key: explorer.percentage_details.4_missing
  #   t: |
  #       The actual count is **{bucketPercentage}%**, and those missing **{normalizedPercentageDelta}%** respondents appear as empty dots.

  - key: explorer.extra_missing_respondents
    t: |
      ### Répondants supplémentaires et manquants

      Le graphique ci-dessus vise à identifier les zones présentant des valeurs supérieures
      ou inférieures aux attentes par rapport à une référence calculée.

      Par exemple, s'il y a 1000 utilisateurs de CSS Grid et que 50% des répondants travaillent dans une grande entreprise,
      on s'attendrait à trouver 500 utilisateurs de CSS Grid travaillant dans de grandes entreprises.

      Tout écart au-dessus ou en dessous de ce total attendu peut indiquer une corrélation intéressante
      entre les deux variables. Il est signalé sur le graphique par des points colorés
      (pour les répondants supplémentaires au-dessus de la référence) ou des points vides (pour les répondants manquants).

