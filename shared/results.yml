  # tools arrows
  - key: blocks.tools_arrows
    t: Évolution dans le temps
  - key: blocks.tools_arrows.description
    t: |
      Chaque ligne va de la première à la dernière année de données disponible. Un point plus haut signifie qu'une technologie a été utilisée par davantage de personnes,
      tandis qu'un point plus à droite signifie que davantage d'utilisateurs souhaitent l'apprendre, ou l'ont utilisée et l'utiliseraient à nouveau.
  - key: blocks.tools_arrows.note
    t: |
      - Certaines lignes omettent des années.
      - Les technologies ne disposant que d'une seule année de données ne sont pas affichées.
      - Formule de vélocité = (opinion la plus récente - opinion la plus ancienne) + (utilisation la plus récente) - (utilisation la plus ancienne)
      - Une vélocité positive signifie que l'utilisation et/ou les opinions positives ont augmenté au fil du temps.

