locale: fr-FR
translations:
  ###########################################################################
  # General
  ###########################################################################

  # homepage
  - key: general.why_create_account
    t: Pourquoi dois-je créer un compte ?
  - key: general.create_account_reasons
    t: >
      Nous vous demandons de créer un compte afin de :

      - Éviter les réponses en double

      - Vous donner accès à vos données

      - Enregistrer votre session au fur et à mesure

      - Vous prévenir lorsque les résultats seront disponibles
  - key: general.survey_closed_detailed
    t: >
      Désolé, le sondage est maintenant fermé ! Vous pouvez toujours consulter vos données, mais vous ne pourrez pas les modifier.
  - key: general.survey_read_only
    t: >
      Vous consultez actuellement ce sondage en lecture seule.
  - key: general.survey_preview
    t: >
      Ce sondage est en mode aperçu. Ses questions peuvent changer et toutes les
      données saisies seront supprimées lorsque le sondage commencera réellement.

  - key: general.survey_read_only_back
    t: >
      <a href="{link}">Retournez</a> à la page principale du sondage pour commencer ou reprendre une session.
  - key: general.take_survey
    t: Répondre au sondage {name}

  # surveys
  - key: general.open_surveys
    t: Sondages ouverts
  - key: general.no_open_surveys
    t: Aucun sondage n'est actuellement ouvert.
  - key: general.closed_surveys
    t: Sondages fermés
  - key: general.no_closed_surveys
    t: Aucun sondage n'est actuellement fermé.
  - key: general.preview_surveys
    t: Sondages en aperçu
  - key: general.no_preview_surveys
