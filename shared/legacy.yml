    t: >
      Note : toutes les questions sont facultatives, il n'est pas nécessaire d'atteindre 100 % de complétion.
  - key: general.data_is_saved
    t: Vos données sont enregistrées chaque fois que vous naviguez vers la section précédente ou suivante.
  - key: general.close_nav
    t: Fermer le menu
  - key: general.open_nav
    t: Ouvrir le menu
  - key: general.more_actions
    t: Plus d'actions
  - key: general.skip_to_content
    t: Aller au contenu

  # thanks
  - key: general.back
    t: Retour
  - key: general.thanks
    t: >
      Merci d'avoir rempli le sondage ! Vos données sont enregistrées.


      Vous pouvez également nous aider à faire connaître le sondage en le partageant. Chaque geste compte et contribuera à rendre nos données encore
      plus représentatives :
  - key: thanks.learn_more_about
    t: "Voici quelques fonctionnalités que vous pourriez vouloir découvrir :"
  - key: thanks.knowledge_score
    t: Score de connaissances
  - key: thanks.score_explanation
    t: >
      Vous avez entendu parler de ou utilisé <span class="score-number score-number-known">{known}</span> des
      <span class="score-number score-number-total">{total}</span> fonctionnalités mentionnées dans le sondage, ce qui
      vous place parmi les <span class="score-number score-number-ranking">{knowledgeRankingFromTop}%</span>
      meilleurs répondants.
  - key: thanks.share_on_twitter
    t: Partager sur Twitter
  - key: thanks.share_score_message
    t: >
      J'ai obtenu un score de connaissances de {score}% au sondage #{hashtag} de cette année ! Répondez au sondage ici : {shareUrl}
  # share
  - key: general.share_subject
    t: >
      Sondage {surveyName}
  - key: general.share_text
    t: >
      Le sondage {surveyName} de cette année est maintenant ouvert ! {link}

