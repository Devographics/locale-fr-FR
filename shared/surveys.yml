  - key: general.privacy_policy
    t: Politique de confidentialité
  - key: general.privacy_policy.description
    t: >
      ### 1. Collecte des données

      En plus des données recueillies par les questions du sondage, nous collectons des informations sur votre appareil, votre navigateur, votre système d'exploitation, la version de votre navigateur et le site référent.

      Toutes les questions sont entièrement facultatives et nous ne lions jamais d'informations identifiantes, comme les adresses email, à vos réponses au sondage.

      ### 2. Collecte des emails

      Nous pouvons éventuellement collecter votre email pour :


      1. Générer un lien magique de connexion, après quoi nous supprimons votre email et conservons uniquement un hash à sens unique dans notre base utilisateurs.

      2. Vous contacter lorsque les résultats du sondage sont disponibles, lors du lancement de futures éditions et pour des annonces occasionnelles. Vous pouvez vous désabonner de notre liste à tout moment et votre email est supprimé de nos archives après son envoi à notre prestataire de newsletter.

      3. Vous envoyer une liste récapitulative des fonctionnalités ou outils que vous souhaitez découvrir. Nous supprimons votre adresse après l'envoi de l'email par notre prestataire d'emails transactionnels.


      Lorsque nous collectons votre adresse email à ces fins, elle n'est jamais liée à vos réponses ou à votre compte utilisateur et n'est jamais stockée sur nos propres serveurs ou bases de données.

      ### 3. Cookies

      Nous installons un cookie de connexion et notre hébergeur (Vercel) peut également installer son propre cookie. Nous n'installons aucun autre cookie et n'utilisons ni outil d'analyse côté client ni publicité.

      ### 4. Utilisation des données

      Nous traitons les données puis les utilisons pour publier des rapports. Nous mettons également l'intégralité du jeu de données à disposition du public.

      ### 5. Suppression des données et du compte

      Vous pouvez nous écrire à [hello@stateofjs.com](mailto:hello@stateofjs.com) si vous souhaitez que nous supprimions tout ou partie de vos données.

