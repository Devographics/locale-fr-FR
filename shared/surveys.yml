  ###########################################################################
  # FAQ
  ###########################################################################

  - key: general.faq
    t: FAQ
  - key: faq.create_account
    t: Pourquoi dois-je créer un compte ?
  - key: faq.create_account.description
    t: Nous vous demandons de créer un compte afin d'éviter les réponses en double, de sauvegarder vos données et de vous prévenir lorsque les résultats sont publiés.
  - key: faq.anonymous_survey
    t: Puis-je répondre anonymement au sondage ?
  - key: faq.anonymous_survey.description
    t: Oui, vous pouvez utiliser une adresse fictive (something@example.com) ou non identifiante, à condition de la conserver pour accéder à vos réponses ultérieurement.
  - key: faq.questions_required
    t: Dois-je répondre à toutes les questions ?
  - key: faq.questions_required.description
    t: Non, toutes les questions sont facultatives et peuvent être ignorées librement.
  - key: faq.data_published
    t: Mes données seront-elles rendues publiques ?
  - key: faq.data_published.description
    t: Oui, toutes les données seront publiées, mais uniquement après suppression de toute information identifiante (emails, noms d'utilisateur, identifiants, etc.).
  - key: faq.survey_design
    t: Comment les sondages sont-ils conçus ?
  - key: faq.survey_design.description
    t: Les sondages sont conçus à partir des retours de la communauté et relus par des experts. Vous pouvez [en apprendre davantage ici](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb).
  - key: faq.results_released
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released.description
    t: Les résultats sont généralement publiés quelques semaines après la clôture du sondage.
  - key: faq.survey_deadline
    t: Quand le sondage prendra-t-il fin ?
  - key: faq.survey_deadline.description
    t: Ce sondage est prévu jusqu'au {date}
  - key: faq.team
    t: Qui organise ce sondage ?
  - key: faq.team.description
    t: Ce sondage est organisé par [Devographics](http://devographics.com), avec l'aide d'un collectif de contributeurs, traducteurs et bénévoles.

