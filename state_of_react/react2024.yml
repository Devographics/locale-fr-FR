  - key: picks.my_pick.react2024
    t: "Mon choix de 2024 : "
  - key: picks.intro
    t: Nous avons demandé à des membres de la communauté React de partager leur « choix de l'année ».

  - key: picks.jack_herrington.name
    t: Tanstack Start
  - key: picks.jack_herrington.bio
    t: Ingénieur principal et vidéaste sur YouTube
  - key: picks.jack_herrington.description
    t: |
      Tanner à plein temps, c'est exactement l'impulsion dont TanStack avait besoin pour passer à la vitesse supérieure. Avec TanStack Start, Tanner tient la promesse de sa stack et s'appuie sur tout l'écosystème TanStack.

  - key: picks.sebastien_lorber.name
    t: TanStack Router
  - key: picks.sebastien_lorber.bio
    t: Créateur de [This Week in React](https://thisweekinreact.com/)
  - key: picks.sebastien_lorber.description
    t: |
      Ce nouveau routeur, dont la version 1 est sortie en décembre 2023, montre qu'il est encore possible d'innover en matière de sécurité des types et de gestion des paramètres de recherche. Son adoption s'est accélérée en 2024 et les retours de la communauté sont très positifs.

  - key: picks.aurora_scharff.name
    t: |
      nuqs : gestionnaire d'état typé des paramètres de recherche pour React
  - key: picks.aurora_scharff.bio
    t: Développeuse web et consultante chez Inmeta
  - key: picks.aurora_scharff.description
    t: |
      Mon choix se porte sur [François Best](https://bsky.app/profile/francoisbest.com) et sa bibliothèque [nuqs](https://nuqs.47ng.com/). Récemment rendue compatible avec d'autres frameworks React que Next.js, elle résout de nombreuses difficultés liées aux paramètres de recherche des URL, avec une API particulièrement fluide et facile à utiliser.

  - key: picks.shaundai_person.name
    t: CodeTV (anciennement Learn with Jason)
  - key: picks.shaundai_person.bio
    t: Ingénieure logiciel front-end senior chez Netflix et formatrice
  - key: picks.shaundai_person.description
    t: |
      Jason a pour mission de rendre la programmation amusante et accessible à tous, et il y réussit remarquablement. Dans une de ses séries, Jason et trois développeurs doivent créer une application à partir d'une courte consigne, comme « créer un classement » ou « créer un site de commerce en ligne ». Sa nouvelle série est un jeu télévisé sur le développement web, à mi-chemin entre Jeopardy et Hot Ones !

  - key: picks.josh_comeau.name
    t: Lucide Icons
  - key: picks.josh_comeau.bio
    t: Ingénieur logiciel et formateur. Créateur de [The Joy of React](https://www.joyofreact.com/)
  - key: picks.josh_comeau.description
    t: |
      Lucide est un fork de Feather Icons qui ajoute des centaines de nouvelles icônes dans le même style élégant. Ses liaisons React sont excellentes : très faciles à utiliser et hautement optimisées !

  - key: picks.sacha_greif.name
    t: React Scan
  - key: picks.sacha_greif.bio
    t: Créateur de Devographics
  - key: picks.sacha_greif.description
    t: |
      Lorsque j'ai vu une démonstration de React pour la première fois, il y a plus de dix ans, l'un de ses principaux atouts était sa capacité à rendre rapidement des pages web longues et complexes. Pourtant, les performances médiocres et les rendus excessifs sont aujourd'hui souvent cités comme des faiblesses du framework. C'est donc formidable de voir React Scan, créé par [Aiden Bai](https://aiden.mov/) de [Million](https://million.dev/), relever ce défi et proposer de nouvelles façons d'améliorer les performances de React.

