  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.react2024.sebastien_lorber
    t: |

      <span class="first-line">Quelle belle époque pour développer avec React !</span>

      L'année a commencé par une [mise à jour de React Labs](https://react.dev/blog/2024/02/15/react-labs-what-we-have-been-working-on-february-2024) et un [message d'Andrew Clark](https://x.com/acdlite/status/1758229889595977824) promettant que nous n'aurions plus besoin d'utiliser `forwardRef`, la [fonctionnalité React la moins appréciée](../features/#all_features). Cette promesse a largement été tenue avec [React 19](https://react.dev/blog/2024/12/05/react-19), qui apporte aussi de nouvelles fonctionnalités enthousiasmantes.

      Cela s'est joué de peu : la nouvelle version devait sortir en [juin](https://x.com/acdlite/status/1797668537349328923), mais la [controverse autour de Suspense](https://tkdodo.eu/blog/react-19-and-suspense-a-drama-in-3-acts) a repoussé sa sortie à décembre. Une optimisation visant à afficher plus rapidement les solutions de repli de Suspense a provoqué par inadvertance un problème d'enchaînement entre composants frères dans de nombreuses applications côté client. L'équipe React a heureusement trouvé le moyen de conserver l'optimisation tout en évitant ces cascades, grâce à une nouvelle fonctionnalité de [préparation anticipée des composants frères Suspense](https://react.dev/blog/2024/04/25/react-19-upgrade-guide#improvements-to-suspense).

      Malgré cette longue attente, l'adoption de cette version s'est relativement bien passée à mes yeux. La version `18.3` avait ajouté des avertissements pour nous aider à préparer nos applications, et l'équipe React a fait un excellent travail pour limiter les changements incompatibles et les documenter en détail dans le [guide de migration](https://react.dev/blog/2024/04/25/react-19-upgrade-guide). Nous devons encore nous familiariser avec toutes ces nouvelles fonctionnalités et API, mais React côté client, tel que nous le connaissons et l'apprécions, est meilleur que jamais.

      L'arrivée des composants serveur et des actions serveur React nous apporte de nouvelles primitives puissantes, étroitement intégrées aux frameworks. Next.js, leur principale implémentation, en montre les avantages, mais aussi les nouveaux défis liés au routage et à la mise en cache, qui ont suscité des réticences dans la communauté. À mon avis, il est tout à fait possible de continuer à utiliser React côté client et d'adopter plus tard les fonctionnalités serveur si elles conviennent à votre projet, lorsque les bonnes pratiques seront plus claires.

      Mais cette année ne s'est pas résumée à React 19 : la [nouvelle architecture](https://reactnative.dev/blog/2024/10/23/the-new-architecture-is-here) de React Native est devenue prête pour la production, marquant une avancée majeure pour l'écosystème multiplateforme. Le [compilateur React](https://react.dev/blog/2024/10/21/react-compiler-beta-release) est également arrivé en version bêta. D'abord présenté comme un compilateur de mémoïsation automatique, il s'agit en réalité d'une plateforme d'optimisation complète pour React, appelée à devenir encore plus puissante.

      Ces nouvelles bases ouvrent la voie à un bel avenir en 2025. Nous commençons tout juste à exploiter leur potentiel et de nombreuses fonctionnalités et intégrations importantes restent à venir. Comme lors de l'arrivée des hooks, nous sommes peut-être à l'aube d'une renaissance de React.

  - key: conclusion.react2024.sebastien_lorber.bio
    t: |
      Fondateur de [This Week In React](https://thisweekinreact.com/) et mainteneur de [Docusaurus](https://docusaurus.io/)

