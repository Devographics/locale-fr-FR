  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.react2025.aurora_scharff
    t: |

      <span class="first-line">2025 a été une année importante pour React.</span>


      React 19 est sorti fin 2024 et beaucoup craignaient que React abandonne le côté client. [Create React App a finalement été retiré](https://react.dev/blog/2025/02/14/sunsetting-create-react-app) en février, après les problèmes rencontrés avec React 19 et la pression de la communauté. En mai, [Remix a annoncé](https://remix.run/blog/wake-up-remix) que Remix 3 s'éloignerait de React. Pendant ce temps, [Dan Abramov](https://overreacted.io/) est revenu avec des articles de blog sur les composants serveur React et [RSC Explorer](https://rscexplorer.dev/), expliquant leur objectif et leur fonctionnement.


      La question demeurait pourtant : où va React ?


      React Conf, en octobre, a apporté des réponses. La [React Foundation](https://react.dev/blog/2025/10/07/introducing-the-react-foundation) a été annoncée pour offrir à React un foyer indépendant de toute entreprise. [Compiler 1.0](https://react.dev/blog/2025/10/07/react-compiler-1) est passé en version stable : nous pouvons donc cesser de parsemer notre code de `useMemo` et `useCallback`. React 19.2 est arrivé avec `useEffectEvent` et `<Activity>`, tandis que `<ViewTransition>`, dans React Canary, rend les animations fluides accessibles à tous.


      La [démonstration asynchrone de Ricky Hanlon](https://www.youtube.com/watch?v=B_2E96URooA) a rassemblé tout le travail de l'équipe depuis des années, et le [groupe de travail Async React](https://github.com/reactwg/async-react/discussions) aide les bibliothèques à adopter ces modèles. React côté client n'est clairement pas près de disparaître.


      Après tout, les applications monopages restent plus nombreuses que les applications SSR en production. TanStack Query demeure la solution de référence pour la gestion d'état asynchrone, tandis que TanStack Start s'affirme comme une alternative prometteuse à Next.js, privilégiant le client. À titre d'exemple, [T3 Chat a récemment migré](https://x.com/theo/status/1997406196660400228) pour tirer parti de son fonctionnement en application monopage.


      Les opinions sont plus partagées sur le côté serveur : la liste croissante de directives (`"use cache"`, `"use workflow"`) suscite débats et [mèmes mémorables](https://x.com/DavidKPiano/status/1981470720166154567), tandis que la [CVE de décembre](https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components) nous a rappelé que les composants serveur sont encore en maturation. Dans le camp des approches centrées sur le serveur, Next.js a introduit [Cache Components](https://nextjs.org/docs/app/getting-started/cache-components), une approche entièrement nouvelle, et [RedwoodSDK](https://rwsdk.com/) mise tout sur les composants serveur React.


      React est également devenu la réponse par défaut des outils d'IA lorsqu'on leur demande de créer une interface. Andrej Karpathy a popularisé le terme [« vibe coding »](https://x.com/karpathy/status/1886192184808149383) en février, et des outils comme [v0](https://v0.app/), [Cursor](https://cursor.com/), [Lovable](https://lovable.dev/) et [Bolt.new](https://bolt.new/) l'ont concrétisé. Ils permettent à chacun de créer des applications et de donner vie à ses idées, souvent avec [shadcn/ui](https://ui.shadcn.com/).


      Il y a beaucoup à suivre, mais [Theo Browne](https://www.youtube.com/@t3dotgg) s'est tourné vers l'IA et parvient à tout couvrir pour un public toujours plus large. Heureusement, [This Week in React](https://thisweekinreact.com/) continue d'arriver dans nos boîtes de réception.


      Ainsi, malgré le chaos de 2025, React se porte toujours très bien. J'ai hâte de livrer plus vite que jamais et, en tant que formatrice, de voir comment l'IA transforme notre façon d'apprendre. Vivement la suite !

  - key: conclusion.react2025.aurora_scharff.bio
    t: Responsable des certifications chez [certificates.dev](https://certificates.dev/), formatrice React et Next.js

  ###########################################################################
  # About
  ###########################################################################

  - key: about.content.react2025
    t: |
      L'enquête State of React 2025 s'est déroulée du 19 novembre 2025 au 13 janvier 2026 et a recueilli 3 760 réponses. Les résultats ont été publiés le 15 février 2025. L'enquête est menée par [Devographics](https://devographics.com/).

      Le logo State of React et le t-shirt ont été créés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l'enquête

      Cette enquête a été créée pour repérer les tendances émergentes de l'écosystème React et aider les développeurs à faire leurs choix technologiques.

      Elle vise donc à anticiper les évolutions des prochaines années plutôt qu'à analyser les tendances actuelles. C'est pourquoi certaines fonctionnalités ou technologies peuvent être omises, même si elles sont déjà très répandues.

      Ces résultats doivent également être considérés comme un **instantané d'un sous-ensemble précis de développeurs** et ne prétendent pas représenter l'ensemble de l'écosystème React.

      ### Conception de l'enquête

      L'enquête s'appuie en partie sur celle de l'année précédente. Son plan a été discuté lors d'une période de commentaires ouverts [sur GitHub](https://github.com/Devographics/surveys/issues/262).

      Toutes les questions de l'enquête étaient facultatives.

      ### Public de l'enquête

      L'enquête était librement accessible en ligne et les participants n'ont fait l'objet d'aucune sélection. Il s'agissait principalement de personnes ayant répondu aux enquêtes précédentes, informées par une liste de diffusion dédiée, et de visiteurs issus des réseaux sociaux.

      Les frameworks, bibliothèques et autres projets pouvaient inviter leur public à participer à l'enquête ; certains l'ont fait au moyen de bannières, de publications, etc. Le graphique « Sources » de la section Métadonnées présente une répartition détaillée des sources de trafic.

      ### Financement du projet

      Le projet est financé par plusieurs sources :

      - **Ventes de t-shirts**.

      - **Liens sponsorisés** : les liens vers les ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Financement direct** : cette année, [Google](https://www.google.com/), [GitNation](https://gitnation.com/), [Algolia](https://www.algolia.com/), [Storyblok](https://www.storyblok.com/), [JetBrains](https://www.jetbrains.com/webstorm/) et [TokyoDev](https://www.tokyodev.com/) ont financé mon travail sur les enquêtes.

      Toute contribution ou tout parrainage est très apprécié. Nous aimerions particulièrement collaborer avec davantage d'éditeurs de navigateurs, qui occupent une place centrale dans l'écosystème web.

      ### Présentation technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) une présentation technique plus détaillée du fonctionnement des enquêtes.

      **Note : cette enquête n'est *pas* une enquête officielle sur React, et son équipe n'est affiliée ni à Meta, ni à Vercel, ni à l'équipe React.**

      ### Remerciements

      Un grand merci à Paul McMahon, Marc Grabanski et Sébastien Lorber.
