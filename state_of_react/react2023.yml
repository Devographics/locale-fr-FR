  ###########################################################################
  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: Avec une progression de **{value}** en 2022, **top-level await** est rapidement devenu un élément essentiel de JavaScript.

  - key: award.tool_usage_delta_award.comment
    t: |
      **Vite** reste la bibliothèque dont l'utilisation progresse le plus rapidement, avec une hausse de **{value}** sur un an !

  - key: award.tool_satisfaction_award.comment
    t: "Vite occupe une nouvelle fois la première place : **{value}** des développeurs souhaitent continuer à l'utiliser !"

  - key: award.tool_interest_award.comment
    t: "Vous aviez deviné Vite ? Presque : cette année, c'est **Vitest** qui suscite le plus d'intérêt, avec un taux de **{value}**."

  - key: award.most_write_ins_award.comment
    t: Avec **{value}** mentions, **Bun** est la technologie la plus citée dans les réponses libres.

  - key: award.most_commented_tool_award.comment
    t: Avec **{value}** commentaires, React confirme qu'il est une nouvelle fois la bibliothèque dont on parle le plus.

  - key: award.most_loved_tool_award.comment
    t: Avec **{value}** de développeurs qui en ont une opinion positive, Vite conclut sa moisson de récompenses en étant la technologie la plus appréciée !

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.react2023.josh_comeau
    t: |

      <span class="first-line">Quelle année !</span>

      Avec l'arrivée des composants serveur React, je dirais que cette année a été la plus importante pour React depuis 2018, année de l'introduction des hooks React.

      En cinq ans, les hooks ont été adoptés massivement. Pas moins de 99,5 % des participants utilisent `useState`, et moins de 2 % en sont insatisfaits. Les composants de classe existent toujours, mais se cantonnent désormais aux anciens projets et à quelques composants de limite d'erreur.

      Je me demande toutefois… utiliserons-nous tous les composants serveur cinq ans après leur sortie, en 2028 ? Je n'en suis pas si sûr. Ce modèle nécessite une intégration poussée avec le bundler et le routeur. La plupart des développeurs ne peuvent pas commencer à l'adopter progressivement dans leur base de code React actuelle.

      Les développeurs React aiment rester à jour : 71 % des participants utilisaient React 18, la dernière version disponible lors de la collecte des données. Pourtant, l'environnement React le plus utilisé reste Create React App, bien qu'il soit officiellement obsolète et n'ait pas eu de nouvelle version depuis avril 2022. Nous mettons volontiers React à jour, mais ne sommes pas prêts à changer d'environnement : 37 % des participants n'ont même jamais utilisé le SSR (rendu côté serveur), alors que cette possibilité existe depuis plus de dix ans !

      Si je devais faire une prédiction, je dirais qu'en 2028 deux variantes de React seront largement utilisées dans des proportions similaires : la version « full-stack », avec les composants et actions serveur, et la version réservée aux applications monopages côté client.

      Nous vivons une époque passionnante ! J'ai hâte de voir comment React et son écosystème évolueront dans les prochaines années.

  - key: conclusion.react2023.josh_comeau.bio
    t: Ingénieur logiciel et formateur. Créateur de [The Joy of React](https://www.joyofreact.com/)

