  # Picks
  ###########################################################################

  - key: picks.my_pick.react2023
    t: "Mon choix de 2023 : "
  - key: picks.intro
    t: Nous avons demandé à des membres de la communauté React de partager leur « choix de l'année ».

  # https://zustand-demo.pmnd.rs
  - key: picks.jack_herrington.name
    t: Zustand
  - key: picks.jack_herrington.bio
    t: Ingénieur principal et vidéaste sur YouTube
  - key: picks.jack_herrington.description
    t: |
      Une gestion d'état simple, élégante et extensible qui « fonctionne tout simplement ». Aujourd'hui, vous n'avez peut-être pas besoin d'une solution dédiée, mais si c'est le cas, Zustand est un excellent point de départ.

  # https://react.dev/reference/rsc/server-components
  - key: picks.alex_sidorenko.name
    t: React Server Components
  - key: picks.alex_sidorenko.bio
    t: Réalise de courtes vidéos sur Next.js sur Twitter
  - key: picks.alex_sidorenko.description
    t: |
      Il y a onze ans, React a réinventé le développement web en remettant en question les pratiques établies. Aujourd'hui, React recommence avec les composants serveur.

      P.-S. : un grand merci à l'équipe Next.js qui fait avancer cette nouvelle vision.

  # https://youtube.com/watch?v=zqhE-CepH2g
  - key: picks.sam_selikoff.name
    t: |
      « Mind the Gap » – conférence de Ryan Florence à Big Sky Dev Con 2024
  - key: picks.sam_selikoff.bio
    t: Vidéos pour les développeurs front-end sur Build UI et YouTube ; co-animateur du podcast Frontend First
  - key: picks.sam_selikoff.description
    t: |
      Ryan montre avec brio comment les nouvelles directives React « use server » et « use client » permettent de créer des fonctionnalités riches des deux côtés du réseau, selon un même modèle unifié. À voir absolument pour toute personne qui développe avec React.

  # https://www.remotion.dev/
  - key: picks.sebastien_lorber.name
    t: Remotion
  - key: picks.sebastien_lorber.bio
    t: Créateur de [This Week in React](https://thisweekinreact.com/)
  - key: picks.sebastien_lorber.description
    t: |
      L'idée de créer des vidéos par programmation avec React continue de me fasciner. Remotion reste un projet plutôt discret, qui progresse régulièrement et a été adopté par des développeurs relations, des formateurs, des créateurs indépendants et de grandes entreprises, notamment pour la campagne vidéo Unwrapped de GitHub.

  # https://buildui.com/posts/instant-search-params-with-react-server-components
  - key: picks.aurora_scharff.name
    t: Paramètres de recherche instantanés avec les composants serveur React
  - key: picks.aurora_scharff.bio
    t: Développeuse web et consultante chez Inmeta
  - key: picks.aurora_scharff.description
    t: |
      Cet article aborde un problème fréquent lors de la création d'une véritable application avec l'App Router de Next.js : la gestion des paramètres de recherche. Il est étonnamment difficile d'obtenir des interactions « parfaites » ; l'article présente une solution avec `useOptimistic` et explique aussi les transitions à l'aide de nombreux exemples interactifs.

  # https://mui.com/blog/introducing-pigment-css/
  - key: picks.josh_comeau.name
    t: Pigment CSS
  - key: picks.josh_comeau.bio
    t: Ingénieur logiciel et formateur. Créateur de [The Joy of React](https://www.joyofreact.com/)
  - key: picks.josh_comeau.description
    t: |
      L'équipe Material UI développe une bibliothèque CSS-in-JS de nouvelle génération qui adapte l'API styled à l'ère des composants serveur React. Les outils CSS-in-JS ne manquent pas, mais celui-ci coche toutes les cases à mes yeux.

  # https://www.propelauth.com/post/nextjs-challenges
  - key: picks.carl_vitullo.name
    t: "Ce n'est pas qu'une impression : Next.js devient plus difficile à utiliser"
  - key: picks.carl_vitullo.bio
    t: Entrepreneur indépendant, animateur de [This Month in React](https://podcasts.apple.com/us/podcast/this-month-in-react/id1661733526) et responsable de la communauté [Reactiflux](https://www.reactiflux.com/)
  - key: picks.carl_vitullo.description
    t: |
      Un excellent article ! Il saisit l'air du temps dans l'écosystème React et exprime clairement une frustration qui couvait depuis 2024.

  # https://sonner.emilkowal.ski
  - key: picks.miguel_angel_duran.name
    t: Sonner
  - key: picks.miguel_angel_duran.bio
    t: Diffuseur de sessions de programmation sur Twitch et créateur de contenu
  - key: picks.miguel_angel_duran.description
    t: |
      Sonner est le meilleur composant de notifications toast pour React. Élégant par défaut, hautement configurable et doté d'une API simple à intégrer dans n'importe quel projet. Un travail remarquable d'Emil.

  # https://docs.expo.dev/router/introduction/
  - key: picks.lydia_hallie.name
    t: Expo Router
  - key: picks.lydia_hallie.bio
    t: Ingénieure logiciel indépendante et créatrice de contenu technique
  - key: picks.lydia_hallie.description
    t: |
      Expo Router mérite mon choix pour son immense potentiel sur le web comme en natif. C'est le premier framework à exploiter toute la puissance de React sur toutes les plateformes, faisant de React un moteur de rendu réellement multiplateforme. Son architecture fondée sur les fichiers facilite l'adaptation des développeurs web aux plateformes natives, accélère le développement et réduit le délai de livraison sur tous les appareils.

