locale: fr-FR
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2023 de l'enquête annuelle sur les dernières tendances de l'écosystème React.

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.react2023
    t: |

      <span class="first-letter">R</span>eact existe depuis 11 ans, ce qui semble difficile à concevoir au vu du rythme actuel du développement web.

      Si nous parlons encore de React aujourd'hui, c'est qu'il a su suivre le rythme et évoluer constamment pour relever les défis que lui posent ses utilisateurs.

      En fait, React ne se contente pas de suivre le mouvement : il ouvre aussi la voie à de nouveaux modèles innovants comme les composants serveur et le compilateur à venir.

      Cela dit, veuillez noter que ces données ont été recueillies entre le **27 octobre** et le **15 novembre 2023**. React 19, ainsi que toute évolution survenue après cette période, n'est donc pas couvert.

      Il reste néanmoins beaucoup à explorer : des bibliothèques de composants aux techniques de gestion d'état, en passant par les modèles d'application. Découvrons ensemble les résultats de la toute première enquête communautaire State of React !

      *Cette enquête n'est pas officielle et n'est affiliée ni à Meta, ni à Vercel, ni à l'équipe React.*

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: T-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le t-shirt officiel State of React

      Est-ce une bibliothèque ? Un framework ? Une entité inconnue sur le point de se transformer en créature dangereuse et instable ? Quels que soient vos sentiments à l'égard de React, vous les retrouverez dans ce design aux accents d'anime et de science-fiction.

  - key: tshirt.about
    t: À propos du t-shirt

  - key: tshirt.description
    t: |
      Nous avons choisi un t-shirt de grande qualité, imprimé par nos partenaires de Cotton Bureau.

  - key: tshirt.getit
    t: Le commander

  - key: tshirt.price
    t: 32 $ US + frais de livraison

  - key: tshirt.designer.heading
    t: À propos du créateur

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est un excellent développeur front-end, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. N'hésitez pas à découvrir ses [autres créations de t-shirts](https://chriskirknielsen.com/designs) !

  ###########################################################################
  # Content
  ###########################################################################

  # user_info

  - key: sections.user_info.description.react2023
    t: |
      **13 003** personnes ont répondu à la toute première enquête State of React. C'est certes un petit échantillon de l'ensemble de la communauté, mais il est suffisamment important pour nous fournir des données précieuses !

  - key: user_info.country.takeaway
    t: |
      La majorité des personnes ayant répondu viennent des **États-Unis** et d'**Europe**.

  - key: user_info.locale.takeaway
    aliasFor: user_info.locale.description

  - key: user_info.completion_stats.takeaway
    aliasFor: user_info.completion_stats.description

  # features

  - key: sections.features.description.react2023
    t: |
      Nous avons interrogé les participants sur **28** fonctionnalités, des hooks incontournables comme `useState` aux API plus spécialisées comme `useDeferredValue`. N'hésitez pas à trier les résultats par « appréciation » !

  - key: features.all_features
    t: Toutes les fonctionnalités

  - key: features.all_features.takeaway
    t: |
      Ce graphique récapitule toutes les questions de l'enquête sur les fonctionnalités. Les barres principales représentent l'expérience des participants et sont subdivisées selon leur appréciation. Vous pouvez modifier le regroupement pour passer de l'une à l'autre.

  - key: features.reading_list.takeaway
    t: >
      **30 %** des participants ont ajouté au moins un élément à leur liste de lecture pendant l'enquête afin d'en apprendre davantage plus tard. Voici le détail de leurs choix.

  - key: features.main_apis_items
    t: Expérience et appréciation des API principales
  - key: features.main_apis_pain_points.takeaway
    t: >
      Parmi les API React les plus courantes, `forwardRef` est de loin celle qui pose le plus de difficultés aux développeurs, suivie de près par `memo`. Heureusement, l'équipe React déploie actuellement de meilleures solutions pour les deux.

  - key: features.hooks_items
    t: Expérience et appréciation des hooks
  - key: features.hooks_pain_points.takeaway
    t: >
      Sans surprise, `useEffect` et `useCallback` sont les hooks React jugés les plus problématiques, en grande partie à cause de la gestion des tableaux de dépendances.

  - key: features.new_apis_items
    t: Expérience et appréciation des nouvelles API
  - key: features.new_apis_pain_points.takeaway
    t: >
      La capacité de React à évoluer et à rester pertinent au fil du temps est l'un de ses principaux atouts, mais elle a aussi un coût : les nouvelles API comme les **composants serveur** peuvent être difficiles à adopter.

  # libraries

  - key: sections.libraries.description.react2023
    t: |
      Nous avons remanié nos graphiques pour mettre en lumière non seulement l'expérience des développeurs, mais aussi leur *appréciation*. Explorez les nouvelles options de regroupement et de tri pour découvrir quelles bibliothèques sont les plus… ou les moins appréciées !

  - key: tools.all_tools_experience
    t: Expérience et appréciation des bibliothèques
  - key: tools.all_tools_experience.takeaway
    t: >
      Parmi les bibliothèques et frameworks React, **Next.js** et **TanStack Query** obtiennent les appréciations globales les plus positives.

      Certains éléments, comme `useState` et `fetch`, ont également été inclus comme points de comparaison, même s'il ne s'agit pas de bibliothèques.

  - key: tools.scatterplot_overview
    t: Satisfaction et utilisation des bibliothèques
  - key: tools.scatterplot_overview.takeaway
    t: >
      Parmi les bibliothèques et frameworks, **Next.js** est le seul à combiner une forte rétention et une utilisation élevée. En revanche, même si davantage de participants ont utilisé **Create React App**, beaucoup moins souhaitent continuer à l'utiliser.

  # component libraries

  - key: tools.component_libraries_experience
    t: Expérience et appréciation des bibliothèques de composants
  - key: tools.component_libraries_experience.takeaway
    t: >
      **React Aria** et **Radix** arrivent en tête des appréciations positives, ce qui montre tout l'intérêt de l'approche headless pour les bibliothèques de composants.

  # state management

  - key: tools.state_management_experience
    t: Expérience et appréciation des outils de gestion d'état
  - key: tools.state_management_experience.takeaway
    t: >
      Après **useState**, **Zustand** est la solution de gestion d'état qui recueille le plus d'avis positifs. **Redux** conserve une large base d'utilisateurs, mais est moins apprécié.

  # data loading

  - key: tools.data_loading_experience
    t: Expérience et appréciation du chargement des données
  - key: tools.data_loading_experience.takeaway
    t: >
      **TanStack Query** fait parler de lui depuis un certain temps, et les données confirment sa réputation : c'est la méthode de chargement des données la plus appréciée, juste après l'API native `fetch`.

  # back-end infrastructure

  - key: tools.meta_frameworks_experience
    t: Expérience et appréciation des méta-frameworks
  - key: tools.meta_frameworks_experience.takeaway
    t: >
      Même si les critiques envers **Next.js** ne manquent pas, il arrive tout de même en tête des appréciations parmi les méta-frameworks, devant **Remix** et **Astro**.

  #other_tools

  - key: sections.other_tools.description.react2023
    t: |
      React est connu pour se concentrer sur le rendu de l'interface tout en restant assez neutre sur les autres aspects de votre application. Cela se reflète dans le dynamisme de l'écosystème qui s'est développé pour combler ces lacunes !

  # usage

  - key: sections.usage.description.react2023
    t: |
      Quelle que soit la version que vous utilisez, le modèle d'application que vous adoptez ou votre secteur d'activité, il n'y a pas de mauvaise façon d'utiliser React !

  - key: usage.js_app_patterns.takeaway
    t: >
      Malgré l'intérêt porté à la génération de sites statiques, au rendu côté serveur et aux composants serveur, il est intéressant de noter que la grande majorité des utilisateurs de React travaillent toujours sur des applications monopages.

  - key: usage.react_version.takeaway
    t: >
      À noter : l'enquête a été menée **avant** l'annonce ou la sortie de React 19.

  # resources

  - key: sections.resources.description.react2023
    t: |
      Si React continue de dominer, c'est notamment grâce à l'immense quantité de documentation, d'articles de blog, de vidéos et d'autres ressources accumulées au fil des ans. En voici un petit échantillon !

  - key: resources.learning_methods.takeaway
    t: |
      L'équipe React a fait un excellent travail avec le nouveau site de documentation. Il n'est donc pas surprenant qu'il soit devenu le moyen le plus courant d'apprendre à utiliser le framework.

  - key: resources.blogs_news_magazines.takeaway
    t: |
      Cette liste comprend de nombreux habitués, mais il faut aussi saluer la présence de médias consacrés à React, comme **This Week in React** et **React Status**.

  - key: resources.sites_courses.takeaway
    t: |
      Malgré les difficultés liées à l'IA rencontrées récemment par **Stack Overflow**, le site reste pour l'instant en tête du classement.

  - key: resources.podcasts.takeaway
    t: |
      **Syntax** continue de dominer le paysage des podcasts de développement. On remarquera également qu'aucun podcast consacré spécifiquement à React n'est actif dans le top 10.

  - key: resources.video_creators.takeaway
    t: |
      **Theo** et **Web Dev Simplified** ont tous deux publié du contenu sur React. Il est intéressant de noter que **The Primeagen**, qui ne traite généralement pas de React, arrive tout de même en troisième position.

  - key: resources.people.takeaway
    t: |
      Sans surprise, **Dan Abramov** arrive en tête des personnalités influentes de la communauté React, même si **Kent C. Dodds** et **Theo** semblent tous deux pouvoir lui ravir la place.

  #awards
  - key: sections.awards.description.react2023
    t: |
      Cette année, les récompenses ont été dominées par un projet bien particulier… devinerez-vous rapidement lequel ?

