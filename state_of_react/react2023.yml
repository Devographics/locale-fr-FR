  ###########################################################################
  # FAQ/About
  ###########################################################################

  # React 2023

  - key: faq.data_used_react2023
    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_react2023.description
    t: >
      Toutes les données recueillies seront publiées librement et accessibles à tous. Les développeurs et les entreprises pourront s'en servir pour définir leurs priorités et orienter leurs feuilles de route.

  - key: faq.survey_goals_react2023
    t: Quels sont les objectifs de l'enquête ?
  - key: faq.survey_goals_react2023.description
    t: >
      Cette enquête vise à mesurer la notoriété et la popularité des API React, ainsi que des bibliothèques de son écosystème.

  - key: faq.who_should_take_survey_react2023
    t: Qui devrait répondre à cette enquête ?
  - key: faq.who_should_take_survey_react2023.description
    t: >
      Cette enquête est ouverte à toute personne qui utilise React, régulièrement ou occasionnellement, dans le cadre de son travail, de ses études ou simplement par plaisir !

  - key: faq.how_long_will_survey_take_react2023
    t: Combien de temps faut-il pour répondre à l'enquête ?
  - key: faq.how_long_will_survey_take_react2023.description
    t: >
      Depending on how many questions you answer (all questions are optional),
      répondre à l'enquête devrait prendre environ 15 à 20 minutes.

  - key: faq.learn_more_react2023
    t: Où puis-je en apprendre davantage ?
  - key: faq.learn_more_react2023.description
    t: Vous trouverez plus d'informations sur cette enquête dans [notre annonce](https://dev.to/sachagreif/announcing-the-first-ever-state-of-react-survey-3k6b).

  - key: faq.survey_design_react2023
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_react2023.description
    t: >
      L'enquête a été conçue avec la contribution de la communauté, recueillie dans un [fil de discussion ouvert](https://github.com/Devographics/surveys/issues/85).

  - key: faq.results_released_react2023
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_react2023.description
    t: L'enquête se déroulera du 27 octobre au 15 novembre et les résultats seront publiés peu après.

  - key: about.content.react2023
    t: |
      L'enquête State of React 2023 s'est déroulée du 27 octobre au 15 novembre 2023 et a recueilli 13 003 réponses. Les résultats ont été publiés le 20 juillet 2024. L'enquête est menée par [Devographics](https://devographics.com/), un collectif composé de [Sacha Greif](https://sachagreif.com/), [Eric Burel](https://www.lbke.fr/), ainsi que d'experts invités et de contributeurs open source.

      Le logo State of React et le t-shirt ont été créés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l'enquête

      Cette enquête a été créée pour repérer les tendances émergentes de l'écosystème React et aider les développeurs à faire leurs choix technologiques.

      Elle vise donc à anticiper les évolutions des prochaines années plutôt qu'à analyser les tendances actuelles. C'est pourquoi certaines fonctionnalités ou technologies peuvent être omises, même si elles sont déjà très répandues.

      Ces résultats doivent également être considérés comme un **instantané d'un sous-ensemble précis de développeurs** et ne prétendent pas représenter l'ensemble de l'écosystème React.

      ### Conception de l'enquête

      L'enquête s'appuie en partie sur celle de l'année précédente. Son plan a été discuté lors d'une période de commentaires ouverts [sur GitHub](https://github.com/Devographics/surveys/issues/85).

      Toutes les questions de l'enquête étaient facultatives.

      ### Public de l'enquête

      L'enquête était librement accessible en ligne et les participants n'ont fait l'objet d'aucune sélection. Il s'agissait principalement de personnes ayant répondu aux enquêtes précédentes, informées par une liste de diffusion dédiée, et de visiteurs issus des réseaux sociaux.

      Les frameworks, bibliothèques et autres projets pouvaient inviter leur public à participer à l'enquête ; certains l'ont fait au moyen de bannières, de publications, etc. Le graphique « Sources » présente une répartition détaillée des sources de trafic.

      ### Financement du projet

      Le projet est financé par plusieurs sources :

      - **Ventes de t-shirts**.

      - **Liens sponsorisés** : les liens vers les ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Financement direct** : cette année, [Google](https://www.google.com/) et [TokyoDev](https://www.tokyodev.com/) ont financé mon travail sur les enquêtes.

      Toute contribution ou tout parrainage est très apprécié. Nous aimerions particulièrement collaborer avec davantage d'éditeurs de navigateurs, qui occupent une place centrale dans l'écosystème web.

      ### Présentation technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) une présentation technique plus détaillée du fonctionnement des enquêtes.

      **Note : cette enquête n'est *pas* une enquête officielle sur React, et son équipe n'est affiliée ni à Meta, ni à Vercel, ni à l'équipe React.**

      ### Remerciements

      Un grand merci à Paul McMahon, Marc Grabanski et Justin E. Samuels pour leur soutien continu.

  - key: general.react2023.survey_intro
    t: |
      Dès la présentation de React, il était clair que cette bibliothèque allait compter dans le monde du web.

      Après tout, Facebook a été construit avec React et, malgré cette étrange syntaxe « JSX », les développeurs l'ont rapidement adopté. Plus remarquable encore, la communauté l'a suivi à travers des changements majeurs comme les composants fonctionnels et les hooks.

      Mais dix ans ont passé et les nouveaux composants serveur React promettent d'être le plus grand changement depuis… React lui-même !

      La communauté suivra-t-elle une nouvelle fois ? Ou les développeurs partiront-ils vers Svelte, Solid ou une autre solution ?

      Découvrons-le ensemble grâce à la toute première enquête State of React !
