  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: faq.data_used_react
    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_react.description
    t: >
      Toutes les données recueillies seront publiées librement et accessibles à tous. Les développeurs et les entreprises pourront s'en servir pour définir leurs priorités et orienter leurs feuilles de route.

  - key: faq.survey_goals_react
    t: Quels sont les objectifs de l'enquête ?
  - key: faq.survey_goals_react.description
    t: >
      Cette enquête vise à mesurer la notoriété et la popularité des API React, ainsi que des bibliothèques de son écosystème.

  - key: faq.who_should_take_survey_react
    t: Qui devrait répondre à cette enquête ?
  - key: faq.who_should_take_survey_react.description
    t: >
      Cette enquête est ouverte à toute personne qui utilise React, régulièrement ou occasionnellement, dans le cadre de son travail, de ses études ou simplement par plaisir !

  - key: faq.how_long_will_survey_take_react
    t: Combien de temps faut-il pour répondre à l'enquête ?
  - key: faq.how_long_will_survey_take_react.description
    t: >
      Depending on how many questions you answer (all questions are optional),
      répondre à l'enquête devrait prendre environ 15 à 20 minutes.

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: T-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le t-shirt officiel State of React

      Est-ce une bibliothèque ? Un framework ? Une entité inconnue sur le point de se transformer en créature dangereuse et instable ? Quels que soient vos sentiments à l'égard de React, vous les retrouverez dans ce design aux accents d'anime et de science-fiction.

  - key: tshirt.about
    t: À propos du t-shirt

  - key: tshirt.description
    t: |
      Nous avons choisi un t-shirt de grande qualité, imprimé par nos partenaires de Cotton Bureau.

  - key: tshirt.getit
    t: Le commander

  - key: tshirt.price
    t: 32 $ US + frais de livraison

  - key: tshirt.designer.heading
    t: À propos du créateur

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est un excellent développeur front-end, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. N'hésitez pas à découvrir ses [autres créations de t-shirts](https://chriskirknielsen.com/designs) !
