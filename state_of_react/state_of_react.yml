  # main features
  - key: features.fragment.description
    t: >
      `<Fragment>`, souvent utilisé avec la syntaxe `<>...</>`, permet de regrouper des éléments sans nœud conteneur.
  - key: features.profiler.description
    t: >
      `<Profiler>` permet de mesurer par programmation les performances de rendu d'un arbre React.
  - key: features.strictmode.description
    t: >
      `<StrictMode>` permet de détecter tôt, pendant le développement, les problèmes courants de vos composants.

  - key: features.createportal.description
    t: >
      `createPortal` permet de rendre certains éléments enfants dans une autre partie du DOM.

  - key: features.createcontext.description
    t: >
      `createContext` permet de créer un contexte que les composants peuvent fournir ou lire.

  - key: features.forwardref.description
    t: >
      `forwardRef` permet à votre composant d'exposer un nœud DOM au composant parent à l'aide d'une ref.

  - key: features.lazy.description
    t: >
      `lazy` permet de différer le chargement du code d'un composant jusqu'à son premier rendu.

  - key: features.memo.description
    t: >
      `memo` permet d'éviter de rendre à nouveau un composant lorsque ses props n'ont pas changé.

  - key: features.createroot.description
    t: >
      `createRoot` permet de créer une racine pour afficher des composants React dans un nœud DOM du navigateur.

  - key: features.hydrateroot.description
    t: >
      `hydrateRoot` permet d'afficher des composants React dans un nœud DOM du navigateur dont le contenu HTML a été généré auparavant par `react-dom/server`.

  # hooks

  - key: features.usecallback.description
    t: >
      `useCallback` est un hook React qui permet de mettre en cache une définition de fonction entre les rendus.

  - key: features.usecontext.description
    t: >
      `useContext` est un hook React qui permet de lire le contexte depuis votre composant et de s'y abonner.

  - key: features.usedebugvalue.description
    t: >
      `useDebugValue` est un hook React qui permet d'ajouter un libellé à un hook personnalisé dans les React DevTools.

  - key: features.usedeferredvalue.description
    t: >
      `useDeferredValue` est un hook React qui permet de différer la mise à jour d'une partie de l'interface.

  - key: features.useeffect.description
    t: >
      `useEffect` est un hook React qui permet de synchroniser un composant avec un système externe.

  - key: features.useid.description
    t: >
      `useId` est un hook React qui génère des identifiants uniques pouvant être transmis aux attributs d'accessibilité.

  - key: features.usememo.description
    t: >
      `useMemo` est un hook React qui permet de mettre en cache le résultat d'un calcul entre les rendus.

  - key: features.usereducer.description
    t: >
      `useReducer` est un hook React qui permet d'ajouter un réducteur à votre composant.

  - key: features.useref.description
    t: >
      `useRef` est un hook React qui permet de référencer une valeur qui n'est pas nécessaire au rendu.

  - key: features.usestate.description
    t: >
      `useState` est un hook React qui permet d'ajouter une variable d'état à votre composant.

  - key: features.usesyncexternalstore.description
    t: >
      `useSyncExternalStore` est un hook React qui permet de s'abonner à un magasin externe.

  - key: features.usetransition.description
    t: >
      `useTransition` est un hook React qui permet de mettre à jour l'état sans bloquer l'interface.

  # new features

  - key: features.suspense.description
    t: >
      `<Suspense>` permet d'afficher un contenu de remplacement jusqu'à ce que ses enfants aient fini de charger.

  - key: features.use_hook.description
    t: >
      `use` est une API React qui permet de lire la valeur d'une ressource telle qu'une Promise ou un contexte.

  - key: features.starttransition.description
    t: >
      `startTransition` permet de mettre à jour l'état sans bloquer l'interface.

  - key: features.react_server_components.description
    t: >
      Composants exécutés exclusivement sur le serveur.

  - key: features.use_client.description
    t: >
      `'use client'` marque les fichiers source dont les composants s'exécutent côté client.

  - key: features.use_server.description
    t: >
      `'use server'` marque les fonctions côté serveur qui peuvent être appelées depuis le code côté client.

  - key: features.server_actions.description
    t: >
      La solution intégrée à React pour les mutations côté serveur.

  - key: features.taint_api.description
    t: >
      Empêcher qu'un objet ou une valeur spécifique soit transmis à un composant client.

  - key: features.cache.description
    t: >
      `cache` permet de mettre en cache le résultat d'une récupération de données ou d'un calcul.

  - key: features.useformstatus.description
    t: >
      `useFormStatus` est un hook qui fournit des informations sur l'état de la dernière soumission du formulaire.

  - key: features.useformstate.description
    t: >
      `useFormState` est un hook qui permet de mettre à jour l'état en fonction du résultat d'une action de formulaire.

