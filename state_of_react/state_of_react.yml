  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_react.intro
    t: |
      React existe depuis un certain temps déjà et il est clair qu'il est devenu l'un des principaux frameworks front-end.

      Pourtant, React continue d'évoluer rapidement et la communauté fait de son mieux pour suivre le rythme.

      Avec l'enquête State of React, nous espérons mieux comprendre cette évolution et aider les développeurs à s'orienter dans le vaste écosystème React.

  - key: general.state_of_react.description
    t: L'enquête annuelle auprès des développeurs sur l'écosystème React

  - key: features.features_intro_react
    t: |
      Bienvenue dans l'enquête ! Cette première partie vise à découvrir quelles API officielles de React vous connaissez et utilisez.

      Au fait, si vous souhaitez nous en dire plus sur l'un de vos choix, cliquez simplement sur la petite icône de commentaire !

  - key: tools.tools_intro_react
    t: |
      Les sections suivantes portent sur les **bibliothèques** et les **frameworks** qui composent l'écosystème React. Dites-nous ce qui vous enthousiasme !

