      Cette enquête s'adresse à toute personne qui travaille ou étudie dans le développement, la programmation ou l'ingénierie, quels que soient son expérience et son parcours.

  - key: faq.survey_goals_devs
    t: Quels sont les objectifs de cette enquête ?
  - key: faq.survey_goals_devs.description
    t: >
      Cette enquête vise à mieux comprendre l'écosystème des développeurs au-delà des seules tendances techniques.

  - key: faq.data_used_devs
    t: Comment les données recueillies seront-elles utilisées ?
  - key: faq.data_used_devs.description
    t: >
      Un rapport détaillé fondé sur les données recueillies sera publié et accessible gratuitement. Le jeu de données complet sera également disponible gratuitement [sur demande](https://discord.gg/2E7bbgnrJJ).

