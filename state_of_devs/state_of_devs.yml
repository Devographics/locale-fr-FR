  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_devs.description
    t: L'enquête des développeurs sur tout le reste

  - key: general.state_of_devs.intro
    t: |

      Même s'il est toujours intéressant de vous demander quel est votre framework JavaScript préféré, nous avons pensé qu'il était temps d'aborder les grandes questions de la vie : qui êtes-vous ? Que faites-vous en dehors du code ? En quoi croyez-vous et qu'espérez-vous ?

      C'est tout l'objet de l'enquête State of Devs. Cette fois, elle porte sur tout ce qui n'est *pas* du code.

  ###########################################################################
  # Sections
  ###########################################################################

