  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.devs2026.sacha_greif.bio
    t: Fondateur de Devographics

  - key: conclusion.devs2026.sacha_greif
    t: |

      J'entame maintenant ma 11e année consécutive à organiser des enquêtes auprès des développeurs. Avec le recul, il semble presque amusant de penser qu'autrefois, les grandes questions qui nous empêchaient de dormir étaient de savoir s'il fallait utiliser React ou Angular.


      Mais les choses ont changé, et 2026 restera peut-être dans les mémoires comme l'année où l'IA est devenue impossible à ignorer. Il est de plus en plus difficile de la réduire à un « correcteur automatique intelligent », et son influence commence à se faire sentir à tous les niveaux de la société. Cette enquête cherchait, en quelque sorte, à saisir un instantané de cette année singulière.


      Certaines questions restent toutefois sans réponse dans une enquête. Les programmeurs écriront-ils encore du code à la main dans cinq ans ? Le génie logiciel existera-t-il toujours comme profession ? Et les développeurs continueront-ils à répondre à ces enquêtes année après année ?


      Pour l'instant, le mieux que nous puissions espérer est de continuer à trouver de la joie dans ce que nous faisons, jour après jour. Sur ce, j'espère vous retrouver en 2027 !

  - key: conclusion.devs2026.miranda_heath.bio
    t: Directrice fondatrice et chercheuse au [Software Stewardship Lab](https://stewardshiplab.org/)

  - key: conclusion.devs2026.miranda_heath
    t: |
      ### « Il faut parler de l'IA »


      La période est incertaine pour les développeurs.


      Près de la moitié des répondants de cette année ont connu l'[insécurité de l'emploi et une rémunération insuffisante](../career/#career_issues). Un quart a déjà été [licencié](../career/#laid_off) au cours de sa carrière, et près d'un sur dix l'a été au cours des neuf derniers mois. Plus d'un quart pense devoir [changer complètement de carrière](../career/#career_security) dans les cinq prochaines années.


      C'est la première enquête Devographics à s'intéresser à l'[état psychologique]() des développeurs, et les résultats suggèrent également des évolutions préoccupantes dans le _ressenti_ du métier de développeur logiciel. Environ deux tiers des répondants se sont sentis récemment moins motivés et plus cyniques. Près de la moitié ont eu du mal à se concentrer, davantage procrastiné, ressenti une fatigue inhabituelle et eu l'impression d'être moins efficaces et d'accomplir moins de choses au travail.


      ---


      Ces changements sont caractéristiques de l'épuisement professionnel : un état qui survient lorsque le travail puise davantage d'énergie qu'il n'en apporte. 62 % des développeurs déclarent avoir connu un [épuisement professionnel](../career/#career_issues) au cours de leur carrière, soit la même proportion que dans l'enquête de l'an dernier.


      Cependant, la fréquence persistante de l'épuisement professionnel dans le développement logiciel ne justifie pas qu'on le banalise. Il peut gravement nuire à la santé et au bien-être. Les données le confirment : les développeurs qui en ont souffert sont généralement moins heureux et plus susceptibles de connaître des problèmes de santé physique ou mentale persistants.


      ---


      Un sujet incontournable alimente aussi discrètement cette incertitude. Pour la première fois cette année, Devographics a demandé aux développeurs de partager leur opinion à ce sujet. Je parle bien sûr de l'IA.


      Si l'utilisation de l'IA était [très répandue](../ai/#ai_generated_code_balance), les opinions à son égard étaient [fortement polarisées](../ai/#ai_sentiment) : 49 % des répondants y étaient favorables et 39 % défavorables.


      Notre compréhension de l'impact psychologique du développement assisté par l'IA est encore en construction, mais les premiers éléments suggèrent que le prompting peut [devenir addictif](https://www.youtube.com/watch?v=iPUn1Fnfn0k&t=407s), qu'une dépendance excessive à l'IA peut [nuire à l'apprentissage](https://www.youtube.com/watch?v=DkhhE97Swmo&list=WL&index=3) et que l'exécution simultanée d'agents peut provoquer une surcharge cognitive appelée « brouillard mental lié à l'IA ». Près de la moitié des répondants estimaient d'ailleurs que l'IA avait un effet négatif sur leur [état psychologique](../ai/#ai_mental_state).


      Surtout, les développeurs voulaient clairement parler de l'impact de l'IA sur leur métier. Plus de 1 500 répondants ont choisi de partager leur [point de vue sur l'IA](../ai/#ai_outlook). Les thèmes récurrents incluaient la nécessité d'apprendre à utiliser l'IA de manière sûre et réfléchie, le fait qu'elle rend le travail moins gratifiant et qu'elle pousse les directions à imposer des attentes de productivité intenables.


      ---


      Alors que l'IA semble tout bouleverser trop vite, certains aspects du développement logiciel évoluent avec une lenteur exaspérante.


      Les personnes qui s'identifient comme femmes sont toujours bien plus susceptibles de subir des [discriminations](../career/#discrimination_issues) que leurs collègues masculins. Plus inquiétant encore, elles sont aussi plus susceptibles d'[éviter leurs collègues, de modifier leur comportement ou leur apparence, voire de changer de carrière](../career/#negative_impacts) en réaction aux problèmes rencontrés au travail. Cela laisse penser que, pour les femmes, la solution la plus simple reste de se conformer, de se transformer ou de s'effacer pour s'adapter à une culture professionnelle qui les défavorise, plutôt que d'attendre que le secteur change.


      De même, les répondants LGBT+ ainsi que ceux ayant un TDAH ou de l'autisme ont décrit la pression ressentie pour cacher leur identité au travail. Les traitements injustes et la pression à masquer leur identité exposent davantage ces groupes à l'épuisement professionnel et à ses conséquences.


      ---


      Être développeur aujourd'hui peut donner l'impression d'être au milieu d'une tempête de sable. Des vents étranges soufflent et il est difficile de voir la route devant soi. Mais si nous continuons à dialoguer, à parler de l'impact de l'IA, des aspects de notre travail qui nous apportent joie et sens, et de la manière de les défendre, le paysage sera peut-être d'autant plus beau lorsque la poussière sera retombée.


      Cela se ressent particulièrement dans l'[attitude des développeurs à l'égard du secteur technologique](../worldview/#tech_industry_emotion). Travailler dans un secteur en perpétuelle évolution et incertain peut être épuisant, et susciter désillusion, anxiété, colère et sentiment d'être dépassé. Mais le changement ouvre aussi des possibilités ; et avec elles viennent la curiosité, l'espoir et l'enthousiasme.

  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.devs2026
    t: |
      L'enquête State of Devs 2026 s'est déroulée du 5 juillet au 5 septembre 2026 et a recueilli 5 463 réponses. Les résultats ont été publiés le 25 septembre 2025. L'enquête est menée par [Devographics](https://devographics.com/).

      ### Objectifs de l'enquête

      Cette enquête vise à mieux connaître les aspects non techniques de la vie des développeurs.

      ### Conception de l'enquête

      L'enquête a été conçue en collaboration avec la communauté, lors d'une période de consultation ouverte au cours de laquelle son plan a été discuté [sur GitHub](https://github.com/Devographics/surveys/issues/279).

      Toutes les questions de l'enquête étaient facultatives.

      ### Public de l'enquête

      L'enquête était librement accessible en ligne, sans filtrage ni sélection des répondants. Ceux-ci étaient principalement issus d'anciennes enquêtes Devographics comme [State of JS](https://stateofjs.com/) ou [State of CSS](https://stateofcss.com/) (informés par une liste de diffusion dédiée), ainsi que des réseaux sociaux.

      Cette enquête doit également être considérée comme un **instantané d'un sous-ensemble particulier de développeurs** et ne prétend pas représenter l'ensemble de l'écosystème.

      ### Financement du projet

      Le projet est financé par nos partenaires, répertoriés sur la page d'accueil de l'enquête.

      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) un aperçu technique détaillé du fonctionnement des enquêtes.

      ### Contact

      Le meilleur moyen de nous contacter est de [rejoindre notre serveur Discord public](https://discord.com/invite/zRDb35jfrt). Vous pouvez également [me retrouver sur Bluesky](https://bsky.app/profile/sachagreif.com).
