  - key: conclusion.devs2025.sacha_greif.bio
    t: Mixologue des données chez Devographics

  - key: conclusion.devs2025.sacha_greif
    t: |
      Si je vous disais que nous avons à peine exploré la *moitié* des données recueillies dans cette enquête, vous comprendriez pourquoi j'ai dû diviser ce rapport en deux parties.

      Il reste à découvrir les sections consacrées à la **santé** (combien d'heures dort un développeur en moyenne ?), aux **loisirs** (quel est le jeu vidéo le plus populaire ?) et à la **vision du monde** (où vous installeriez-vous si vous pouviez choisir n'importe quelle destination ?).

      Mais rassurez-vous : vous n'aurez pas longtemps à attendre avant de découvrir la deuxième partie de ce rapport. Pour être sûr de ne pas la manquer, indiquez votre adresse e-mail ci-dessous et nous vous préviendrons dès sa publication !

  - key: conclusion.devs2025.anjana_vakil.bio
    t: Ingénieure indépendante, enseignante et consultante en relations avec les développeurs

  - key: conclusion.devs2025.anjana_vakil
    t: |
      En tant que développeurs logiciels, nous avons tendance à penser que notre métier tourne autour de la programmation, des performances et des pull requests. Mais, au fond, le logiciel concerne avant tout les **gens**. Et les gens sont complexes.

      La plupart des répondants se disent heureux dans leur [vie](../worldview/#overall_happiness) et au [travail](../workplace/#job_happiness), mais tout n'est pas rose pour autant. La plupart ont aussi connu l'[épuisement professionnel](../career/#career_issues), des difficultés à concilier vie professionnelle et vie personnelle ou des problèmes de santé mentale. Beaucoup incriminent une culture professionnelle toxique et un mauvais management. Nombreux sont ceux qui subissent une forte pression, interne comme externe, pour travailler trop, ainsi qu'un manque de contrôle sur leurs conditions de travail.

      De nombreux développeurs, moi y compris, ont également subi des [discriminations](../career/#discrimination_issues) fondées sur l'âge, le genre, l'orientation sexuelle ou le handicap. Dans l'ensemble, et particulièrement chez les personnes marginalisées, l'anxiété, le sentiment d'impuissance et l'isolement semblent gagner du terrain dans notre communauté professionnelle.

      Il m'arrive, surtout ces derniers temps, de me demander s'il y a encore de l'espoir. Les résultats de cette enquête semblent confirmer une leçon que j'ai apprise maintes fois au cours de mes dix années dans la tech : nous ne pouvons combattre ensemble ces nombreux problèmes et bâtir un meilleur secteur du logiciel que d'une seule manière : **ensemble**.

      Dans la conjoncture économique actuelle, de nombreux développeurs (et travailleurs en général) ont le sentiment que leurs employeurs les considèrent comme des « ressources » exploitables et remplaçables, plutôt que comme des collègues ayant une valeur propre. L'**action collective** permet aux travailleurs de rééquilibrer ce rapport de force. Qu'il s'agisse de moyens formels, comme les syndicats et les recours collectifs, ou informels, comme parler de nos salaires, prendre la parole sur les réseaux sociaux ou répondre à cette enquête, nous devons **nous rapprocher** pour mettre ces problèmes en lumière et faire avancer les choses.

      Il n'existe pas de solution facile pour le secteur, ni pour le monde, mais la nécessité de **remettre l'humain au premier plan** semble plus urgente que jamais. À nous, individuellement et collectivement, de décupler notre empathie, notre capacité à communiquer, notre tolérance et notre bienveillance. La programmation, c'est la partie facile.

  - key: conclusion.devs2025.josh_comeau.bio
    t: Entrepreneur indépendant

  - key: conclusion.devs2025.josh_comeau
    t: |
      Ce n'est un secret pour personne : le secteur technologique traverse une période difficile depuis quelques années. Il n'a jamais été facile de débuter comme développeur logiciel, mais cela peut aujourd'hui sembler impossible ; même des développeurs expérimentés disent avoir du mal à trouver un emploi.

      Pourtant, les résultats de cette enquête suggèrent que la situation n'est pas aussi grave qu'elle en a l'air. Nous avons tous vu les gros titres sur les vagues de licenciements dans la tech, mais seule une [petite minorité de développeurs](../career/#laid_off) déclare avoir été licenciée au cours de l'année écoulée (et cela vaut même pour les développeurs juniors !).

      La majorité des développeurs déclarent que [leur salaire a augmenté au cours de l'année écoulée](../workplace/#income_evolution), et seuls 9 % signalent une baisse de rémunération. Le développeur junior médian n'a envoyé que [10 candidatures](../workplace/#job_finding_application_count) pour obtenir son poste actuel. Enfin, seuls [14 % des répondants](../workplace/#job_happiness) se disent insatisfaits ou très insatisfaits de leur travail.

      Le secteur technologique reste confronté à de graves problèmes (par exemple, près de la moitié des femmes et des personnes non binaires déclarent subir des [discriminations](../career/#discrimination_issues) liées à leur genre ou à leur identité de genre) ; je ne prétends donc pas que tout va bien.

      Pourtant, le discours dominant en ligne affirme que le développement logiciel est menacé d'extinction par l'IA et que nous sommes en train d'être remplacés par des grands modèles de langage. Si c'était vrai, je pense que les résultats de cette enquête seraient bien différents.

  - key: conclusion.devs2025.declan_chidlow.bio
    t: Développeur front-end, designer et rédacteur

  - key: conclusion.devs2025.declan_chidlow
    t: |
      Un secteur peut facilement être défini par les personnes déjà en place, mais il n'y a pas d'avenir sans sang neuf.

      Entrer dans le secteur est difficile. Une candidature de plus. Une journée de plus. Plus de 1 000 candidats. Des « entretiens » vidéo menés par l'IA. Les sites d'offres d'emploi ressemblent manifestement à une loterie, et c'est le [réseau qui compte](../workplace/#job_finding_methods). Le [nombre de candidatures](../workplace/#job_finding_application_count) nécessaires pour décrocher un poste est le plus élevé chez les moins expérimentés. Je me demande s'il va encore augmenter, tandis que les entreprises s'obstinent maladroitement à remplacer les juniors par l'IA.

      On dit que la bonne santé est gâchée par la jeunesse. À propos des juniors, cela [semble effectivement se vérifier](../worldview/#happiness_factors) : les moins de 20 ans sont les seuls à ne pas citer la « bonne santé » comme principale source de bonheur. Les développeurs semblent également consciencieux : notre [vision du monde](../worldview/) montre que les enjeux mondiaux nous préoccupent.

      Les métadonnées des réponses montrent que les développeurs utilisent des [navigateurs](../metadata/#browser) bien plus variés que la population générale. Chrome arrive à 36 %, Firefox à 14 %, Safari à 13 % et Edge à 2 %. En comparaison, [Statcounter](https://gs.statcounter.com/browser-market-share/) estime leur part mondiale à 68 % pour Chrome, 16 % pour Safari, 5 % pour Edge et 2 % pour Firefox. La diversité se retrouve dans les [systèmes d'exploitation de bureau](../technology/#desktop_os), macOS et Linux grignotant les parts habituelles de Windows.

      Dans les prochaines enquêtes, j'aimerais recueillir les réponses d'un échantillon plus diversifié et entendre les expériences des groupes moins représentés, notamment pour pouvoir en tirer des enseignements. J'aimerais aussi voir une plus grande diversité géographique, car les États-Unis dominent souvent les discussions sur le développement.

      Enfin, j'espère que les organisations du secteur considéreront ces enquêtes comme une liste de choses à faire et s'attaqueront aux problèmes qu'elles mettent en évidence.

  - key: conclusion.devs2025.lola_odelola.bio
    t: Ingénieure logiciel, fondatrice de [Blackgirl.tech](https://blackgirl.tech/)

  - key: conclusion.devs2025.lola_odelola
    t: |
      En examinant les données de l'enquête State of Devs 2025, plusieurs éléments m'ont interpellée. Je suis une femme cis noire, britanno-nigériane et indépendante, atteinte de TDAH et d'algie vasculaire de la face : mon parcours se situe au croisement de plusieurs réalités. C'est dans ce contexte que je lis et interprète ces données.

      Certaines de mes expériences trouvent un écho dans les données. Par exemple, 21 % des répondants noirs ou africains ont déclaré avoir subi des [discriminations au travail](../career/#discrimination_issues), quel que soit leur genre. J'ai moi-même vécu cela dans des entreprises britanniques et américaines, y compris au sein d'équipes qui semblaient diversifiées en apparence.

      Cela dit, recueillir des données sur l'origine raciale et l'appartenance ethnique à l'échelle mondiale est délicat, car ces notions sont comprises de différentes façons. Je suis une femme cis noire, mais le terme « noire » perd de sa pertinence si je vis au Nigeria et travaille pour une entreprise nigériane.

      En raison des discriminations que j'ai subies, je considère le travail indépendant comme un aménagement qui me permet de continuer à faire un travail qui me tient à cœur dans l'environnement le plus sûr possible.

      Cette situation comporte toutefois ses propres difficultés : 15 % des répondants indépendants ont [déclaré une baisse de revenus](../career/#employment_status) au cours de l'année écoulée, et j'en fais moi aussi partie.

      Tout cela se produit alors que les droits des travailleurs sont attaqués partout dans le monde : tandis que les gouvernements occidentaux cherchent à supprimer des protections au travail (en particulier pour les personnes handicapées), les travailleurs de la tech dans les pays du Sud sont exploités et sous-payés par les grandes entreprises technologiques.

      J'espère que l'action collective et les alliances entre travailleurs permettront de faire évoluer la situation. Les travailleurs de tous les métiers doivent pouvoir façonner leurs conditions de travail et les produits qu'ils conçoivent, afin de redistribuer le pouvoir et les profits de manière plus juste.

      À l'avenir, recueillir des données supplémentaires sur la nationalité pourrait apporter un éclairage complémentaire à celui de l'origine raciale. Il faudrait également mieux représenter les pays africains et sud-asiatiques dans l'enquête. Tout cela nous aiderait à comprendre qui détient le pouvoir dans le secteur technologique mondial.

