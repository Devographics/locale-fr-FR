  - key: about.content.devs2025
    t: |
      L'enquête State of Devs 2025 s'est déroulée du 15 avril au 15 mai 2025 et a recueilli 8 717 réponses. Les résultats ont été publiés le 20 juin 2025. L'enquête est menée par [Devographics](https://devographics.com/).

      ### Objectifs de l'enquête

      Cette enquête vise à mieux connaître les aspects non techniques de la vie des développeurs.

      ### Conception de l'enquête

      L'enquête a été conçue en collaboration avec la communauté, lors d'une période de consultation ouverte au cours de laquelle son plan a été discuté [sur GitHub](https://github.com/Devographics/surveys/issues/279).

      Toutes les questions de l'enquête étaient facultatives.

      ### Public de l'enquête

      L'enquête était librement accessible en ligne, sans filtrage ni sélection des répondants. Ceux-ci étaient principalement issus d'anciennes enquêtes Devographics comme [State of JS](https://stateofjs.com/) ou [State of CSS](https://stateofcss.com/) (informés par une liste de diffusion dédiée), ainsi que des réseaux sociaux.

      Cette enquête doit également être considérée comme un **instantané d'un sous-ensemble particulier de développeurs** et ne prétend pas représenter l'ensemble de l'écosystème.

      ### Financement du projet

      Le projet est financé par nos partenaires, répertoriés sur la page d'accueil de l'enquête.

      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) un aperçu technique détaillé du fonctionnement des enquêtes.

      ### Contact

      Le meilleur moyen de nous contacter est de [rejoindre notre serveur Discord public](https://discord.com/invite/zRDb35jfrt). Vous pouvez également [me retrouver sur Bluesky](https://bsky.app/profile/sachagreif.com).
