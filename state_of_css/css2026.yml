  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.css2026
    t: |
      L'enquête de cette année a recueilli les réponses de **5 506** développeurs et développeuses dans le monde entier.

  - key: sections.features.description.css2026
    t: |
      Ce n'est un secret pour personne : le CSS accueille de nouvelles fonctionnalités à un rythme record. C'est pourquoi nous en avons abordé pas moins de *50* cette année !

  - key: sections.tools.css2026
    t: Bibliothèques et outils

  - key: sections.tools.description.css2026
    t: |
      Malgré les nombreuses possibilités offertes par les nouvelles fonctionnalités CSS, les développeurs s'appuient encore sur des outils et des bibliothèques pour faciliter leur travail, du moins pour le moment.

  - key: sections.usage.description.css2026
    t: |
      Quelle que soit votre façon d'utiliser le CSS, les données montrent que la compatibilité entre navigateurs reste une préoccupation, en particulier pour les nouveautés comme `:has()`.

  - key: sections.resources.description.css2026
    t: |
      Rassurez-vous : avec toutes les nouvelles fonctionnalités CSS qui arrivent, les sujets ne manqueront pas de sitôt pour les articles de blog, les podcasts, les vidéos et les formations !

  ###########################################################################
  # Takeaways
  ###########################################################################

  # - key: user_info.country.takeaway.css2026
  #   t: >
  #     The survey remains U.S.-centric, but European countries continue

  - key: features.all_features.takeaway.css2026
    t: >
      `:has()`, `aspect-ratio` et **l'imbrication CSS** sont à la fois les fonctionnalités les plus utilisées et les plus appréciées de l'enquête.


      `line-clamp` a de nouveau suscité de nombreux commentaires, la plupart réclamant une version sans préfixe. **L'imbrication CSS** a également reçu son lot de réactions, mais contrairement à `line-clamp`, presque toutes étaient positives.


      Les fonctionnalités les moins utilisées étaient les **décorations d'espacement** et `if()`, sans doute à cause de leur prise en charge limitée par les navigateurs.


      Puisqu'on parle de compatibilité, on peut anticiper l'avenir du CSS en observant les fonctionnalités les plus appréciées qui ont le statut Baseline « disponibilité limitée » ([Baseline](https://web.dev/baseline)). Ici, `calc-size()` et le **positionnement par ancrage** sont très attendus !

  - key: features.features_ratios_over_time.takeaway.css2026
    t: >
      Même avec une prise en charge limitée par les navigateurs, le **positionnement par ancrage** affiche la plus forte hausse annuelle d'**utilisation** (**+15 %**), ce qui montre à quel point les développeurs attendaient cette fonctionnalité.


      Du côté de la **notoriété**, la plus forte progression (**+23 %**) revient à **sibling-count**, qui sera, espérons-le, bientôt pris en charge par tous les principaux navigateurs.


      Il est également intéressant d'observer les fonctionnalités peu **appréciées**. Par exemple, le taux de **-13 %** de **contrast-color()** signifie que les personnes l'ayant réellement utilisée ont un avis moins positif que celles qui en ont seulement entendu parler.

  - key: pain_points.layout_pain_points.takeaway.css2026
    t: >
      Comme l'année dernière, **Grid** est l'élément le plus souvent cité parmi les difficultés liées à la mise en page. Cela reflète à la fois son utilisation croissante (il est devenu la méthode de mise en page CSS par défaut pour de nombreux développeurs) et sa courbe d'apprentissage indéniable.


      Si la prise en charge généralisée de **Subgrid** est bienvenue, cette fonctionnalité ajoute une couche de complexité à un système de mise en page déjà sophistiqué.

  - key: pain_points.shapes_graphics_pain_points.takeaway.css2026
    t: >
      Le CSS nous permet de mieux en mieux de dépasser le rectangle et de dessiner toutes sortes de formes complexes sans recourir à Canvas ni même à SVG.


      Le problème reste la compatibilité : tant que tous les navigateurs n'implémenteront pas ces fonctionnalités, il sera difficile de convaincre les développeurs de les utiliser.

  - key: pain_points.colors_pain_points.takeaway.css2026
    t: >
      Ces dernières années, le CSS nous a offert de nombreuses façons de définir les couleurs. Les espaces colorimétriques polaires uniformes en perception comme `oklch`, ainsi que les couleurs relatives, `light-dark()` et `contrast-color()`, nous rapprochent de l'idéal d'interfaces recolorables dynamiquement.


      Malheureusement, sans mappage de gamut, les modifications produisent souvent des couleurs hors gamut, sans aucune garantie. Les critiques portent donc non seulement sur l'absence de mappage, mais aussi sur ses conséquences : thèmes dynamiques toujours difficiles à créer ou couleurs `oklch` imprévisibles.

  - key: pain_points.interactions_pain_points.takeaway.css2026
    t: >
      Tout comme pour les formes et les graphiques, la prise en charge des interactions et des animations par les navigateurs accuse un certain retard.


      Les **carrousels CSS** ont également suscité des réactions, notamment au sujet de l'**accessibilité**.

  - key: pain_points.other_features_pain_points.takeaway.css2026
    t: >
      Outre le fait qu'elles sont les trois fonctionnalités les plus citées de cette catégorie, les **couches de cascade**, **l'imbrication CSS** et `if()` pourraient profondément changer notre façon d'écrire du CSS.


      Malgré cela, les répondants sont plutôt enthousiastes à l'idée de les adopter ; seul le manque de prise en charge adéquate par les navigateurs et les outils les en empêche principalement.

  - key: pain_points.css_general_pain_points.takeaway.css2026
    t: >
      Les **problèmes de compatibilité des navigateurs** restent très présents, mais il est frappant de voir combien de répondants évoquent une **surcharge cognitive** et craignent que le CSS ne devienne **excessivement complexe**. Une inquiétude compréhensible au vu de la **vitesse d'évolution** du langage et du rythme auquel de nouvelles fonctionnalités sont apparues ces dernières années.

  - key: features.reading_list.takeaway.css2026
    t: >
      La liste de lecture permet aux répondants d'enregistrer des sujets à découvrir après l'enquête. **55 %** des répondants ont enregistré les **décorations d'espacement**, qui promettent de résoudre une difficulté fréquente nécessitant actuellement de nombreux contournements complexes.

  # other_tools

  - key: other_tools.css_frameworks.takeaway.css2026
    t: >
      La plus grande menace pour la première place de **Tailwind** n'est peut-être pas un autre framework CSS, mais l'absence totale de framework.


      La facilité avec laquelle les grands modèles de langage génèrent des systèmes de design et des bibliothèques de composants sur mesure contribue sans doute à cette tendance. Le CSS lui-même évolue aussi pour répondre à de nombreux besoins qui nécessitaient auparavant des frameworks tiers.

  - key: other_tools.css_in_js.takeaway.css2026
    t: >
      Le CSS-in-JS n'a jamais été l'idée la plus élégante, mais il a rempli un rôle à une époque où le CSS n'était pas le langage qu'il est aujourd'hui. Son ère est peut-être révolue, mais il a ouvert la voie aux pratiques actuelles, ne serait-ce qu'en nous montrant ce qu'il *ne faut pas* faire.

  - key: other_tools.pre_post_processors.takeaway.css2026
    t: >
      Comme le CSS-in-JS, l'utilisation des préprocesseurs diminue et pourrait bientôt appartenir au passé.

  - key: other_tools.utilities.takeaway.css2026
    t: >
      Cette liste d'outils CSS vaut toujours le détour : vous y découvrirez peut-être un nouvel outil pratique à intégrer à votre flux de travail !

  - key: other_tools.browsers.takeaway.css2026
    t: >
      L'utilisation des navigateurs est l'une de ces tendances étonnamment stables d'une année à l'autre, avec presque aucun changement par rapport à l'édition précédente.

  # usage

  - key: usage.form_factors.takeaway.css2026
    t: >
      Les environnements de test ont peu évolué depuis l'année dernière, et les tests d'accessibilité restent moins courants qu'ils ne devraient l'être.

  - key: usage.css_ai_generated_code_balance.takeaway.css2026
    t: >
      Ce graphique est fascinant, car il diffère complètement des réponses à une question similaire dans les enquêtes [State of AI](https://2026.stateofai.dev/en-US/usage/#ai_generated_code_balance) et [State of JS](https://2025.stateofjs.com/en-US/usage/#ai_generated_code_balance).

      Les commentaires sur cette question montrent que l'IA n'est pas encore très douée en CSS. L'avenir dira s'il s'agit d'une limite temporaire ou si l'IA sera un jour assez performante pour comprendre pleinement le fonctionnement des mises en page CSS Grid.

  - key: usage.css_interoperability_features.takeaway.css2026
    t: >
      Le **positionnement par ancrage** et la **View Transition API** restent les fonctionnalités que les répondants évitent le plus à cause de problèmes de compatibilité avec les navigateurs.


      Il est également intéressant de noter que les **requêtes de taille sur les conteneurs** et **Grid** figurent toujours dans ce graphique, alors que leur statut Baseline est **largement disponible**.

  - key: usage.css_missing_features.takeaway.css2026
    t: >
      Nous attendons toujours l'arrivée des **mixins** en CSS, mais les éditeurs de navigateurs ont répondu à nos demandes concernant la **mise en page en maçonnerie**, deuxième fonctionnalité la plus réclamée l'année dernière, avec la nouvelle syntaxe `display: grid-lanes`.

  - key: usage.css_general_pain_points.takeaway.css2026
    t: >
      La **prise en charge par les navigateurs** reste notre principale source de mécontentement, mais le nombre de répondants citant la **complexité excessive** (un sujet récurrent de State of JavaScript) augmente légèrement. Le CSS ne devient-il pas trop compliqué… ?

  - key: usage.favorite_new_features.takeaway.css2026
    t: >
      `:has()` reste aussi formidable que jamais, mais de nombreux développeurs l'utilisent depuis plus d'un an. Elle a donc cédé sa couronne de « meilleure nouveauté » au **positionnement par ancrage**, qui a gagné 4 places pour prendre la tête.

  - key: usage.css_pace_of_change.takeaway.css2026
    t: >
      Si vous avez l'impression d'être à la traîne parce que vous n'avez pas utilisé toutes les nouveautés CSS de cette année, ne vous inquiétez pas.

      Comme le montre ce graphique, la plupart des répondants se trouvent au milieu de leur parcours d'adoption : ils ont découvert et essayé seulement une partie des fonctionnalités de l'enquête.

  - key: usage.state_of_the_web_happiness.takeaway.css2026
    t: >
      Les répondants étaient plutôt satisfaits de l'état général des technologies web, avec une moyenne stable de 3,8 sur 5.

  - key: usage.state_of_css_happiness.takeaway.css2026
    t: >
      En revanche, la satisfaction à l'égard du CSS suit une nette tendance à la hausse, en phase avec les progrès rapides du langage.

  # resources
  - key: resources.podcasts.takeaway.css2026
    t: >
      **Syntax** a réussi à gagner encore des points de pourcentage, alors qu'il dominait déjà la catégorie.

  - key: resources.video_creators.takeaway.css2026
    t: >
      **Kevin Powell** reste le roi de cette catégorie. **The Primeagen** arrive loin derrière, bien que le CSS ne fasse pas vraiment partie des sujets habituels de sa chaîne. Ses avis plus mesurés sur l'IA trouvent peut-être un écho auprès des développeurs CSS sceptiques à son égard.

  - key: resources.people.takeaway.css2026
    t: >
      **Kevin**, **Josh**, **Adam**, **Una**, **Ahmad**, **Lea**, **Chris**… on sait qu'on a réussi quand son seul prénom suffit à être reconnu !

  - key: resources.web_platform_resources.takeaway.css2026
    t: >
      **CSS-Tricks** a peut-être connu le succès comme blog, mais ses guides et son almanach sont d'excellentes ressources à part entière, ce qui justifie pleinement la troisième place du site.

  - key: resources.other_surveys.takeaway.css2026
    t: >
      À l'exception de l'enquête **State of HTML**, la participation aux enquêtes semble globalement en baisse.


      Assiste-t-on à une saturation soudaine des enquêtes ? Pour le savoir, restez à l'écoute de notre prochaine enquête « State of Surveys » !

  ###########################################################################
  # Awards
  ###########################################################################

  - key: award.most_used_feature_award.comment
    t: |
      Avec {value} d'utilisation, `:has()` est une nouvelle fois la fonctionnalité la plus utilisée !

  - key: award.least_used_feature_award.comment
    t: |
      Avec seulement {value} d'utilisation, les **décorations d'espacement** sont encore loin d'être répandues.

  - key: award.most_loved_feature_award.comment
    t: |
      Avec {value} d'avis positifs, `:has()` occupe une nouvelle fois la première place de notre classement.

  - key: award.most_hated_feature_award.comment
    t: |
      Même si les **couleurs à large gamut** sont une excellente fonctionnalité, {value} des répondants en ont une opinion négative.

  - key: award.largest_awareness_progression_award.comment
    t: |
      {value} répondants de plus connaissent `sibling-count()` par rapport à l'année dernière.

  - key: award.largest_usage_progression_award.comment
    t: |
      Le **positionnement par ancrage** n'est peut-être pas encore très utilisé, mais sa hausse d'utilisation de {value} devrait bientôt changer la donne !

  - key: award.most_commented_feature_award.comment
    t: |
      `line-clamp` a reçu {value} commentaires, dont beaucoup critiquent sa syntaxe préfixée.

