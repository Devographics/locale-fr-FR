  # FAQ/About
  ###########################################################################

  - key: faq.how_long_will_survey_take_css2026
    aliasFor: faq.how_long_will_survey_take_css2024
  - key: faq.how_long_will_survey_take_css2026.description
    aliasFor: faq.how_long_will_survey_take_css2024.description

  - key: faq.learn_more_css2026
    t: Où puis-je en savoir plus ?
  - key: faq.learn_more_css2026.description
    t: Pour en savoir plus sur cette enquête, consultez [notre annonce](https://dev.to/sachagreif/the-2024-state-of-css-survey-is-now-open-4o5h).

  - key: faq.survey_design_css2026
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_css2026.description
    t: >
      Cette enquête est le fruit d'un [processus de conception ouvert](https://github.com/Devographics/surveys/issues/289) auquel ont participé des éditeurs de navigateurs et la communauté du développement web.

  - key: faq.results_released_css2026
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_css2026.description
    t: L'enquête se déroulera du 1er juin au 1er juillet 2025 et ses résultats seront publiés peu après.

  - key: about.content.css2026
    t: >
      L'enquête State of CSS 2025 s'est déroulée du 1er juin au 15 juillet 2025 et a recueilli 5 506 réponses. Elle est menée par [Devographics](https://www.devographics.com/), avec l'aide d'une équipe de contributeurs et de consultants open source.


      Le logo et le t-shirt State of CSS ont été conçus et animés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).


      ### Objectifs de l'enquête

      Cette enquête a été créée pour repérer les tendances émergentes du développement web et aider les développeurs à faire leurs choix technologiques.


      Elle vise donc à anticiper les évolutions des prochaines années plutôt qu'à analyser les tendances actuelles. C'est pourquoi les fonctionnalités et technologies déjà les plus répandues n'y figurent pas toujours.


      Les éditeurs de navigateurs utilisent également ces données pour hiérarchiser les fonctionnalités et orienter des initiatives comme [Interop 2025](https://web.dev/blog/interop-2025).


      ### Conception de l'enquête

      Cette enquête a été conçue en collaboration [sur GitHub](https://github.com/Devographics/surveys/issues/245).

      ### Public de l'enquête

      L'enquête était accessible librement en ligne et les répondants n'ont fait l'objet d'aucune sélection. Il s'agissait principalement de personnes ayant participé aux éditions précédentes (informées par une liste de diffusion dédiée) et de visiteurs venus des réseaux sociaux.

      ### Financement du projet

      Outre la vente de t-shirts, le projet est financé par plusieurs sources :

      - Notre partenaire [Frontend Masters](https://frontendmasters.com/) finance l'enquête en échange de liens vers ses formations, affichés au bas de chaque page.

      - Cette année, l'équipe [Google Chrome](https://www.google.com/chrome/) a consacré un budget de sponsoring à la conception et à la réalisation de l'enquête.

      - [TokyoDev](https://www.tokyodev.com/) soutient également l'enquête de manière régulière.

      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) un aperçu technique plus détaillé du fonctionnement des enquêtes. Notre code est [open source](https://github.com/Devographics/Monorepo/).

      ### Commentaires


      - [Signaler un problème technique](https://github.com/Devographics/Monorepo/issues)

