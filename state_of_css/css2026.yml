locale: fr-FR
translations:
  - key: general.css2026.devs2026_banner
    t: |
      Répondez à l'enquête State of Devs et dites-nous ce que vous pensez vraiment de la tech ! →

  - key: general.css2026.survey_intro
    t: |

      Respirez profondément. Détendez-vous. Ce n'est pas grave si vous ne connaissez pas chaque nouvelle propriété CSS. En réalité, très peu d'entre nous les connaissent toutes.

      L'un des objectifs de cette enquête a toujours été d'aider les développeurs à rester au courant des dernières avancées du CSS. Mais tous ces progrès peuvent parfois sembler écrasants.

      C'est pourquoi nous avons délibérément réduit cette année le nombre de fonctionnalités abordées, pour nous concentrer sur les plus importantes.

      À l'heure où le code est généré avec l'aide de l'IA, faire moins, mais mieux, est peut-être la façon pour celles et ceux qui tiennent encore à coder leurs logiciels à la main de rester compétitifs.

      Alors, une fois encore, rejoignez-nous pour cette édition de State of CSS !

  ###########################################################################
  # Overview
  ###########################################################################

  - key: overview.introduction.css2026
    t: |
      <span class="first-letter">L</span>e CSS de 2026 serait méconnaissable pour nos lointains ancêtres du début des années 2000.


      Aujourd'hui, vous pouvez animer les transitions entre les pages en CSS, créer des [mises en page en maçonnerie](https://webkit.org/blog/17660/introducing-css-grid-lanes/) et même [émuler un microprocesseur](https://lyra.horse/x86css/) ! Bien sûr, vous pouvez aussi [faire tourner Doom](https://cssdoom.wtf/) en CSS et, oui, même [centrer des `<div>`](https://www.joshwcomeau.com/css/center-a-div/) !


      Pour vous aider à comprendre ce que les résultats de l'enquête State of CSS de cette année révèlent sur cet écosystème foisonnant, voici un aperçu rapide des tendances les plus intéressantes.

  - key: overview.1.css2026
    t: |

      ## L'année du positionnement par ancrage

      La prise en charge limitée du **positionnement par ancrage** rend d'autant plus remarquable sa première place lorsque les répondants citent leur nouvelle fonctionnalité CSS préférée.

  - key: overview.2.css2026
    t: |
      ## Les problèmes de prise en charge par les navigateurs

      Le positionnement par ancrage arrive également en tête des fonctionnalités CSS que les développeurs aimeraient utiliser, mais évitent à cause de problèmes de compatibilité avec les navigateurs.

  - key: overview.3.css2026
    t: |
      Cela met en évidence un problème central de l'écosystème CSS : à cause du retard de prise en charge par les navigateurs, l'enthousiasme suscité par les nouveautés est souvent tempéré par l'impossibilité de les utiliser en production.

      Outre le positionnement par ancrage, d'autres fonctionnalités comme les **transitions de vue** ou `if()` rencontrent le même problème : les développeurs CSS les réclament, et il revient désormais aux éditeurs de navigateurs de veiller à ce qu'elles soient utilisables partout.

      C'est là qu'interviennent des initiatives comme [Interop](https://web.dev/blog/interop-2026), dont l'édition de cette année contribuera heureusement à améliorer la prise en charge de nombreuses fonctionnalités les plus demandées.

  - key: overview.4.css2026
    t: |

      ## À contre-courant de la tendance à l'IA

      Alors que le reste du monde du développement web confie une part croissante de son code à l'IA, le CSS semble rester un bastion du codage manuel, du moins pour l'instant.

  - key: overview.5.css2026
    t: |

      La plupart des commentaires à ce sujet soulignent que l'IA n'est pas encore très douée pour produire du bon code CSS. Il sera donc intéressant de voir comment la situation évoluera.

      ## Un langage à part

      Plus que toute autre technologie web, le CSS semble être un langage entièrement à part. Il est fascinant de l'avoir vu évoluer au fil des décennies jusqu'à sa forme actuelle.


      Ce n'est qu'un minuscule aperçu des données recueillies dans cette enquête. Consultez les résultats complets pour avoir une vue d'ensemble !


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: overview.anchor_positioning_1.css2026
    t: |

      L'histoire du CSS en 2026 peut se raconter à travers quatre fonctionnalités.

      ## Le positionnement par ancrage

      Parmi les fonctionnalités dont le statut [Baseline](https://web.dev/baseline) indique une « disponibilité limitée » (elles ne sont pas encore largement prises en charge par les principaux navigateurs), le **positionnement par ancrage** recueille le deuxième avis le plus favorable, juste après `calc-size()`. Les développeurs attendent donc sa disponibilité avec impatience.
      ## `display: grid-lanes`


      ## `color-contrast()`

  - key: overview.ai_adoption.css2026
    t: |
      ## N° 1 : l'adoption croissante de l'IA

      Il faut reconnaître que les enquêtes ouvertes comme celle-ci peuvent comporter un biais de sélection. Autrement dit, une enquête consacrée à l'IA a probablement plus de chances d'être remplie par des développeurs qui l'utilisent déjà et s'y intéressent.

      Gardons cette réserve à l'esprit : si les tendances observées ici reflètent l'ensemble du secteur, le passage du codage assisté par l'IA, d'une expérimentation réservée aux précurseurs à une pratique courante, est déjà bien engagé.

      Cela apparaît clairement lorsqu'on observe [la proportion de code généré par l'IA chez les répondants](/en-US/usage/#ai_generated_code_balance) : elle est passée d'une moyenne de **28 %** en 2025 à **54 %** cette année, les tranches supérieures à 75 % enregistrant la plus forte hausse (l'évolution par rapport à l'année précédente est indiquée par des hachures sur les barres).

  - key: overview.ai_adoption2.css2026
    t: |
      Les répondants utilisent également l'IA beaucoup plus souvent : la proportion de ceux qui déclarent l'utiliser « constamment » a [doublé en un an](/en-US/usage/#ai_code_generation_frequency).

  - key: overview.coding_agents.css2026
    t: |
      ## N° 2 : Claude Code et l'essor des agents de programmation

      Cette adoption est largement portée par une nouvelle génération d'agents et d'assistants de programmation. **Claude Code** arrive en tête des [avis positifs des répondants sur les agents de programmation](/en-US/coding-agents-assistants/#coding_agents_assistants_experience).

  - key: overview.coding_agents2.css2026
    t: |

      Ces agents s'imposent comme un moyen plus pratique d'interagir avec les grands modèles de langage, et pourraient remplacer les chatbots, les générateurs d'applications et d'autres outils spécialisés.

      Ainsi, même si **ChatGPT** reste le plus populaire, **Claude** est [le modèle pour lequel les développeurs paient le plus](/en-US/models/#models_paid_for).

  - key: overview.monetization.css2026
    t: |
      ## N° 3 : la course à la monétisation

      Puisqu'on parle de payer davantage : après nous être habitués à une IA bon marché, subventionnée par des levées de fonds sans précédent, notre dépendance collective facilite désormais la hausse des prix par les laboratoires d'IA. Cela se traduit par une [augmentation nette des dépenses personnelles consacrées à l'IA](/en-US/usage/#ai_personal_expenses) par rapport à l'année dernière.

  - key: overview.monetization_2.css2026
    t: |
      Seul l'avenir dira si cette monétisation accrue justifiera les valorisations vertigineuses des entreprises d'IA, ou si celles-ci indiquent plutôt que nous sommes au cœur d'[une bulle de l'IA](/en-US/opinions/#ai_bubble_currently). Quoi qu'il en soit, les répondants semblent en être convaincus.

