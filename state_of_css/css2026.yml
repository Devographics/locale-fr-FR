  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2026.sunkanmi_fafowora
    t: |

      <span class="first-line">« Ce que faisait JavaScript, le CSS peut désormais le faire. »</span> Cette affirmation n'est pas sans fondement. Le CSS devient ce qu'il aurait toujours dû être. Des fonctionnalités qui auraient dû appartenir à sa couche de présentation prennent enfin vie et forme.


      Avec des fonctionnalités comme les transitions de vue, le mélange des couleurs, les [mixins](https://groups.google.com/a/chromium.org/g/blink-dev/c/g0dSC7CvdlA/m/Wz30GgIZAwAJ?pli=1) et le positionnement par ancrage, l'avenir du CSS rend désormais possible l'impossible. Pour suivre le rythme du secteur, les développeurs web doivent faire preuve d'adaptabilité, penser d'abord à l'architecture et à la plateforme web, et se passionner pour un développement moderne et accessible. Le CSS évolue sans cesse et, avec l'aide de l'IA, cette évolution ne fera que s'accélérer. Que la nouveauté devienne moderne, puis que le moderne devienne obsolète.


      Il est passionnant de voir où va le CSS : de nouvelles fonctionnalités sont discutées et proposées en ce moment même. [Les retours haptiques déclaratifs](https://github.com/w3c/csswg-drafts/issues/13728), [l'activation d'états personnalisés lors de déclencheurs](https://github.com/w3c/csswg-drafts/issues/13579) et même [un pseudo-sélecteur que j'ai proposé](https://github.com/w3c/csswg-drafts/issues/13198), [`::drag-image`](https://github.com/w3c/csswg-drafts/issues/13198), pour styliser les images fantômes des éléments déplacés à l'écran.


      Les développeurs ne doivent pas seulement suivre les nouveautés : ils doivent aussi comprendre et prendre en compte la compatibilité des navigateurs, l'amélioration progressive et l'accessibilité dans un langage en constante évolution. L'interopérabilité est essentielle pour établir un ensemble standard de fonctionnalités CSS dont tout le monde peut profiter ; ne l'oublions pas.


      Ce qui m'enthousiasme encore davantage, c'est que le CSS n'évolue pas seul. Il évolue grâce aux membres du CSSWG, aux éditeurs de navigateurs et à la participation des développeurs : discussions du CSSWG sur GitHub, signalements de bugs dans les navigateurs, retours sur la plateforme web et enquêtes comme State of CSS permettent de découvrir ce qui fonctionne ou non.


      L'avenir du CSS en 2026 consiste à transformer, au fil des expérimentations, ce qui était autrefois impossible ou impraticable en quelque chose de possible et ordinaire pour nous, développeurs CSS. Aux fonctionnalités anciennes, nouvelles et à venir : j'ai hâte de voir les normes et fonctionnalités d'aujourd'hui devenir la norme de demain !

      *Sunkanmi est un ingénieur CSS chevronné, un rédacteur technique et un formateur pour développeurs. Il est actuellement **à la recherche d'un emploi**. Si son profil vous intéresse, [contactez-le](https://www.linkedin.com/in/olasunkanmi-fafowora/) !*

  - key: conclusion.css2026.sunkanmi_fafowora.bio
    t: Rédacteur pour [CSS-Tricks](https://css-tricks.com/) et créateur de [CSS-Questions](https://css-questions.com/)
