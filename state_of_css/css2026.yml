  # Picks
  ###########################################################################

  - key: picks.my_pick.css2026
    t: "Mon choix pour 2026 : "
  - key: picks.intro
    t: Nous avons demandé aux membres de la communauté CSS de partager leur « coup de cœur de l'année ».

  # https://linear-easing-generator.netlify.app/
  - key: picks.josh_comeau.name
    t: |
      Générateur d'accélération `linear()`
  - key: picks.josh_comeau.bio
    t: Développeur indépendant et formateur
  - key: picks.josh_comeau.description
    t: |
      La fonction de durée `linear()` est rapidement devenue l'une de mes fonctionnalités modernes préférées. Cet excellent outil permet de générer facilement des animations de ressort CSS à partir d'une logique JavaScript !

  # https://developer.mozilla.org/en-US/docs/Web/CSS/if
  - key: picks.ahmad_shadeed.name
    t: |
      `if()`
  - key: picks.ahmad_shadeed.bio
    t: Ingénieur en conception, auteur de [debuggingcss.com](https://debuggingcss.com)
  - key: picks.ahmad_shadeed.description
    t: |
      Associé à `:has()` et aux requêtes de style, `if()` nous permettra de créer encore plus de logique conditionnelle en CSS.

  # https://developer.mozilla.org/en-US/docs/Web/CSS/text-wrap
  - key: picks.kilian_valkhof.name
    t: |
      `text-wrap: balance;`
  - key: picks.kilian_valkhof.bio
    t: Créateur de [Polypane](https://polypane.app/)
  - key: picks.kilian_valkhof.description
    t: |
      Je ne me souviens pas de la dernière fois qu'une nouvelle propriété CSS a pu être ajoutée telle quelle à n'importe quelle feuille de style, ancienne ou récente. Cette petite ligne magique améliore nettement vos titres sans aucun inconvénient. Ajoutez-la à vos réinitialisations CSS !

    # https://codepen.io/thebabydino/pen/LEExpVg
  - key: picks.ana_tudor.name
    t: Combiner les fonctionnalités
  - key: picks.ana_tudor.bio
    t: Scientifique folle du CSS
  - key: picks.ana_tudor.description
    t: |
      Mon choix ne porte pas tant sur une fonctionnalité isolée qui change la donne que sur la façon dont plusieurs fonctionnalités peuvent être combinées.

      Par exemple, Subgrid associé à la nouvelle propriété `corner-shape` (ou à la fonction `shape()` de `clip-path`) permet de créer des formes dépendant du contenu, avec des arrondis concaves qui ne sont pas forcément circulaires.

  # https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Values_and_Units/Using_CSS_math_functions
  - key: picks.amit_sheen.name
    t: Fonctions mathématiques CSS
  - key: picks.amit_sheen.bio
    t: Développeur web et créateur numérique
  - key: picks.amit_sheen.description
    t: |
      Les mathématiques sont le langage de l'univers et de la vie. Sans elles, nous ne pourrions rien décrire, mesurer ni construire avec précision.

      Pouvoir utiliser ces fonctions directement en CSS renforce donc nos possibilités et ouvre tout un monde de nouvelles perspectives.

  # https://miocene.io/
  - key: picks.sacha_greif.name
    t: Julia Miocene
  - key: picks.sacha_greif.bio
    t: Responsable de State of CSS
  - key: picks.sacha_greif.description
    t: |
      Quand on passe des journées à déboguer une mise en page ou à styliser des formulaires, on oublie facilement que le développement front-end peut aussi être un plaisir en soi. Le travail remarquable de Julia nous rappelle la joie et la créativité que le CSS peut offrir, si l'on prend le temps de les chercher.

  # https://developer.mozilla.org/en-US/docs/Web/API/View_Transition_API
  - key: picks.julia_miocene.name
    t: API View Transition
  - key: picks.julia_miocene.bio
    t: Designer produit, ingénieure UX et spécialiste des animations en CSS pur
  - key: picks.julia_miocene.description
    t: |
      Mon coup de cœur de l'année est l'API View Transition. Elle m'a permis de supprimer du code JS et des astuces d'animation complexes. Je peux désormais animer facilement du contenu généré et des interactions utilisateur ✨

  # https://modern-fluid-typography.vercel.app/
  - key: picks.ana_rodrigues.name
    t: |
      Générateurs de clamp pour les polices
  - key: picks.ana_rodrigues.bio
    t: Développeuse front-end chez [Hactar.is](https://hactar.is/)
  - key: picks.ana_rodrigues.description
    t: |
      Mon coup de cœur de l'année, ce sont tous les générateurs de clamp pour les polices que les gens ont créés et partagés. Leur diversité permet de s'adapter à différentes façons d'apprendre, surtout lorsque la documentation seule ne suffit pas à comprendre le fonctionnement d'une fonctionnalité.

  # https://piccalil.li/blog/
  - key: picks.saron_yitbarek.name
    t: Picalilli
  - key: picks.saron_yitbarek.bio
    t: Évangéliste du Web chez Apple
  - key: picks.saron_yitbarek.description
    t: |
      Je suis Piccalilli depuis un moment et j'aime y trouver des articles techniques gratuits ainsi que des formations payantes plus approfondies, pour choisir la formule qui me convient. Cette entreprise comprend très bien la communauté web et prend des décisions éthiques, ce qui lui permet de faire un excellent travail sans malaise quant à son modèle économique.

  # https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/light-dark
  - key: picks.sara_joy.name
    t: |
      La fonction `light-dark()`
  - key: picks.sara_joy.bio
    t: Développeuse front-end
  - key: picks.sara_joy.description
    t: |
      Dès lors que l'on utilise `color-scheme` en CSS, déclarer des couleurs avec `light-dark()` selon le mode clair ou sombre s'impose naturellement. Je suis avec intérêt [cette discussion](https://github.com/w3c/csswg-drafts/issues/10577) sur les futures possibilités de logique conditionnelle permettant d'interroger le schéma de couleurs et d'adapter le CSS.

  - key: frontendmasters.learning_path
    t: |
