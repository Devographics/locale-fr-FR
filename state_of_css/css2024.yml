  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: faq.how_long_will_survey_take_css2024
    t: Combien de temps faut-il pour répondre à l'enquête ?
  - key: faq.how_long_will_survey_take_css2024.description
    t: >
      Selon le nombre de questions auxquelles vous répondez (elles sont toutes facultatives),
      l'enquête devrait prendre environ 15 à 20 minutes.

  - key: faq.learn_more_css2024
    t: Où puis-je en savoir plus ?
  - key: faq.learn_more_css2024.description
