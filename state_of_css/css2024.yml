  #   t: |

  ###########################################################################
  # Quiz
  ###########################################################################

  - key: quiz.quiz_dave_shea
    t: "Question 01"
  - key: quiz.quiz_dave_shea.question
    t: >
      En mai 2003, Dave Shea a lancé un site qui mettait en valeur la flexibilité et l'adaptabilité du CSS. Comment s'appelait-il ?
  - key: options.quiz_dave_shea.css_playground
    t: Terrain de jeu CSS
  - key: options.quiz_dave_shea.style_jungle
    t: Jungle des styles
  - key: options.quiz_dave_shea.css_zen_garden
    t: CSS Zen Garden
  - key: quiz.quiz_dave_shea.answer
    t: >
      [CSS Zen Garden](https://www.csszengarden.com/) a marqué les esprits en montrant ce qu'il était possible de faire en séparant le balisage de la mise en forme.
  - key: quiz.quiz_dave_shea.description
    aliasFor: quiz.quiz_dave_shea.question

  - key: quiz.quiz_css_spec
    t: "Question 02"
  - key: quiz.quiz_css_spec.question
    t: >
      Laquelle de ces organisations maintient la spécification CSS ?
  - key: options.quiz_css_spec.w3c
    t: W3C
  - key: options.quiz_css_spec.w3schools
    t: W3Schools
  - key: options.quiz_css_spec.mdn
    t: MDN
  - key: quiz.quiz_css_spec.answer
    t: >
      Le [groupe de travail CSS du W3C](https://www.w3.org/groups/wg/css) maintient la spécification CSS, ensuite mise en œuvre par les éditeurs de navigateurs.
  - key: quiz.quiz_css_spec.description
    aliasFor: quiz.quiz_css_spec.question

