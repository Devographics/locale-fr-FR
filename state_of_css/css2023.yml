  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: |
      La propriété `gap` est si utile avec Flexbox qu'il n'est pas étonnant
      qu'elle ait progressé de **{value}** en 2023.

  # - key: award.tool_usage_delta_award.comment
  #   t: No other tool comes even close to Tailwind CSS's dramatic **{value}** progression over the last year.

  - key: award.most_commented_feature_award.comment
    t: Avec **{value}** commentaires, aucune autre fonctionnalité n'a suscité autant de réactions que Subgrid.

  - key: award.tool_satisfaction_award.comment
    t: |
      Parmi toutes les solutions CSS-in-JS, Open Props est la seule à avoir conservé
      un taux de rétention exceptionnel de **{value}**.

  # - key: award.tool_interest_award.comment
  #   t: With a **{value}** ratio, CSS Modules again generated the most interest among CSS developers this year.

  - key: award.most_write_ins_award.comment
    t: |
      Avec **{value}** mentions, Panda est de loin l'outil le plus cité dans les réponses libres.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2023.chen_hui_jing
    t: |
      <span class="first-line">Alors que l'utilisation des nouvelles fonctionnalités CSS est en hausse, celle des frameworks CSS suit une tendance à la baisse.</span>

      Cela pourrait indiquer que l'on commence à comprendre qu'il n'est pas forcément nécessaire d'attendre pour utiliser les nouveautés du CSS : les navigateurs les prennent en charge bien plus rapidement qu'auparavant.

      Les fonctionnalités natives comme l'imbrication et `:has()` (qui peut agir comme un sélecteur parent, mais offre bien plus encore) sont bien connues ; leur adoption à grande échelle semble donc imminente.

      Parmi toutes ces fonctionnalités, ma préférée cette année est `text-wrap: balance`. Cette propriété permet de répondre en une ligne à une demande que j'entends depuis le début de ma carrière dans le développement web : « Peut-on ajuster ce titre pour éviter que le dernier mot se retrouve tout seul ? »

      Il est également intéressant de constater que tant de développeurs considèrent l'animation vers `auto` et la disposition en maçonnerie comme des fonctionnalités manquantes du CSS. Il est vrai que les navigateurs ont toujours eu du mal à déterminer les dimensions des éléments, notamment leur hauteur, lorsqu'elles ne sont pas explicitement définies.

      Mais comme l'a souligné [Lea Verou](https://lea.verou.me/) l'an dernier, les initiatives telles qu'[Interop](https://wpt.fyi/interop-2023), qui rassemblent les navigateurs, peuvent transformer en réalité des fonctionnalités autrefois jugées impossibles !

  - key: conclusion.css2023.chen_hui_jing.bio
    t: Ingénieur en expérience développeur chez Interledger Foundation

