  - key: user_info.country_low_vs_high_income.description.css2023
    t: >
      La répartition des répondants entre les tranches de revenus faibles et élevées
      fait apparaître deux listes de pays très différentes.

  - key: user_info.higher_education_degree_by_gender.description.css2023
    t: >
      La proportion de femmes parmi les répondants titulaires d'un diplôme de l'enseignement supérieur
      dans un domaine sans rapport avec le CSS était plus élevée que prévu, ce qui pourrait
      indiquer de nombreuses reconversions professionnelles.

  - key: user_info.source_by_gender.description.css2023
    t: >
      Le faible nombre total de réponses ne permet pas de tirer de conclusions définitives,
      mais la proportion de femmes était la plus élevée parmi les personnes ayant découvert l'enquête
      par leur travail ou le bouche-à-oreille, notamment par rapport aux réseaux sociaux comme Twitter ou YouTube.

  - key: user_info.source_by_race_ethnicity.description.css2023
    t: >
      Malgré la faible taille de l'échantillon, YouTube se distingue comme l'une des sources
      de trafic vers l'enquête les plus diverses en matière d'origine ethnique.

  - key: user_info.average_income_by_company_size.description.css2023
    t: >
      Les répondants les mieux rémunérés travaillent dans de grandes entreprises. À noter toutefois
      que les indépendants gagnent légèrement plus que les personnes travaillant dans de petites entreprises.

  - key: user_info.yearly_salary_usa_vs_the_world.description.css2023
    t: >
      La comparaison des revenus aux États-Unis avec ceux du reste du monde montre que les développeurs
      américains sont surreprésentés dans les tranches de revenus les plus élevées.

