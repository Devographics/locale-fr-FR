  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2023 de l'enquête annuelle sur les dernières tendances de l'écosystème CSS.

  - key: general.css2022.js2022_banner
    t: "L'enquête State of JS 2022 est ouverte : vous pouvez [y répondre dès maintenant](https://survey.devographics.com/survey/state-of-js/2022?source=css2022) !"

  - key: general.css2023.results_intro
    t: |

      Je ne vais pas vous mentir : suivre l'évolution du CSS n'a pas été facile ces derniers temps. Heureusement, cette année, [Chen Hui Jing](https://chenhuijing.com/) a pris la tête de la conception de l'enquête, dans la continuité du travail de [Lea Verou](https://lea.verou.me/) l'année dernière.

      Nous avons également eu la chance de recevoir le soutien de l'équipe Google Chrome, qui, avec les autres éditeurs de navigateurs, s'appuie sur ces résultats pour orienter sa feuille de route.

      Grâce à cette aide supplémentaire, nous avons pu proposer plusieurs nouveautés, à commencer par la possibilité de **personnaliser les graphiques**. Cliquez sur l'icône <span class="customize-chart-icon">« paramètres »</span> à côté d'un graphique pour le filtrer par salaire, pays ou toute autre variable !

      Ceci étant dit, voyons comment le CSS a évolué en 2023 !

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.css2023
    t: |
      <span class="first-letter">L</span>e CSS connaît une période de progrès sans précédent. Entre `:has()`, les requêtes de conteneur, Subgrid et bien d'autres nouveautés, de nouvelles fonctionnalités arrivent dans les navigateurs presque chaque mois.

      Cette évolution peut toutefois donner le vertige. Heureusement, [Chen Hui Jing](https://chenhuijing.com/) nous a aidés cette année à concevoir l'enquête et à nous guider dans la jungle du CSS.

      À propos de l'enquête, saviez-vous que les éditeurs de navigateurs utilisent ses données dans le cadre de l'initiative [Interop](https://web.dev/interop-2023/) pour déterminer les fonctionnalités à développer en priorité ?

      Enfin, nous lançons une nouveauté cette année : vous pouvez **personnaliser les graphiques** en appliquant vos propres filtres aux données. Nous avons hâte de découvrir les nouvelles perspectives que vous en tirerez !

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.css2023
    t: |
      L'enquête de cette année a recueilli les réponses de **9 190** développeurs et développeuses dans le monde entier.

  - key: sections.features.description.css2023
    t: |
      Le CSS évolue à toute vitesse et la communauté des développeurs adopte
      progressivement, mais sûrement, bon nombre des nouvelles fonctionnalités.

  - key: sections.css_frameworks.description.css2023
    t: |
      Une fois encore, Tailwind CSS se distingue comme le seul grand framework d'interface que les développeurs souhaitent continuer à utiliser, tandis qu'Open Props se constitue un public restreint mais passionné.

  - key: sections.css_in_js.description.css2023
    t: |
      Après une première période de croissance, le secteur du CSS-in-JS semble avoir atteint un plateau. Le fait que le CSS natif adopte lui-même bon nombre de ses principaux avantages y est sans doute pour beaucoup.

  - key: sections.other_tools.description.css2023
    t: |
      Trente ans après l'invention du navigateur, l'innovation se poursuit avec de nouveaux venus comme Brave et Arc, ainsi que des outils spécialisés comme Polypane qui gagnent des parts de marché.

  - key: sections.usage.description.css2023
    t: |
      Quelle que soit votre façon d'utiliser le CSS, les données montrent que la compatibilité entre navigateurs reste une préoccupation, en particulier pour les nouveautés comme `:has()`.

  - key: sections.resources.description.css2023
    t: |
      Entre les blogs, les chaînes YouTube et les podcasts, la communauté CSS est plus dynamique que jamais.

