  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.css2023
    t: >
      L'enquête State of CSS 2023 s'est déroulée du 15 juin au 15 juillet 2023 et a recueilli 9 108 réponses. Elle est menée par [Devographics](https://www.devographics.com/), avec l'aide d'une équipe de contributeurs et de consultants open source.


      Le logo et le t-shirt State of CSS ont été conçus et animés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).


      ### Objectifs de l'enquête

      Cette enquête, ainsi que celle de [State of JavaScript](https://stateofjs.com/), vise à repérer les tendances émergentes du développement web afin d'aider les développeurs à faire leurs choix technologiques.


      Ces enquêtes cherchent donc à anticiper les évolutions des prochaines années plutôt qu'à analyser les tendances actuelles. C'est pourquoi les fonctionnalités et technologies déjà les plus répandues n'y figurent pas toujours.


      Les éditeurs de navigateurs utilisent également les données de l'enquête pour hiérarchiser les fonctionnalités et orienter des initiatives comme [Interop 2023](https://web.dev/interop-2023/).


      ### Conception de l'enquête

      Cette année, la conception de l'enquête a été dirigée par [Chen Hui Jing](https://chenhuijing.com/) grâce à une subvention de l'équipe Google Chrome. Toutes les questions étaient facultatives.

      ### Public de l'enquête

      L'enquête était accessible librement en ligne et les répondants n'ont fait l'objet d'aucune sélection. Il s'agissait principalement de personnes ayant participé aux éditions précédentes (informées par une liste de diffusion dédiée) et de visiteurs venus des réseaux sociaux.

      ### Financement du projet

      Le projet est financé par plusieurs sources :

      - **La vente de t-shirts**.

      - **Liens sponsorisés** : les ressources recommandées au bas de chaque page sont proposées par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Graphiques sponsorisés** : depuis l'année dernière, chacun peut sponsoriser directement un graphique à partir de 10 $ et afficher son avatar Twitter à côté.

      - **Google** : cette année, l'équipe [Google Chrome](https://www.google.com/chrome/) a prévu un budget pour rémunérer Lea afin qu'elle contribue à la conception de l'enquête, et m'a également apporté un soutien financier direct.

      - **Nijibox** : l'entreprise japonaise [Nijibox](https://nijibox.jp/) a également accepté de soutenir généreusement mes efforts pour rendre ces enquêtes annuelles plus pérennes.


      ### Aperçu technique

      Vous trouverez [ici](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) un aperçu technique plus détaillé du fonctionnement des enquêtes. Notre code est [open source](https://github.com/Devographics/Monorepo/).

      ### Commentaires


      - [Signaler un problème technique](https://github.com/Devographics/Monorepo/issues)

      - [Faire une suggestion pour l'année prochaine](https://github.com/Devographics/surveys/issues/193)

      - [Autres problèmes non techniques](https://github.com/Devographics/surveys/issues)

      - [Rejoindre notre Discord](https://discord.gg/tuWRUWVyJs)

