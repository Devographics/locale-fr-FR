    t: Où puis-je en savoir plus ?
  - key: faq.learn_more_css2023.description
    t: Pour en savoir plus sur cette enquête, consultez [notre annonce](https://dev.to/sachagreif/the-2023-state-of-css-survey-is-now-open-18bk).

  - key: faq.survey_design_css2023
    t: Comment cette enquête a-t-elle été conçue ?
  - key: faq.survey_design_css2023.description
    t: >
      Cette année, grâce à une subvention du [UI Fund de Google](https://web.dev/ui-fund/),
      [Chen Hui Jing](https://chenhuijing.com/) a pu contribuer à la [conception ouverte de l'enquête](https://github.com/Devographics/surveys/issues/84).

  - key: faq.results_released_css2023
    t: Quand les résultats seront-ils publiés ?
  - key: faq.results_released_css2023.description
    t: L'enquête se déroulera jusqu'au 15 juillet 2023 et ses résultats seront publiés dans les semaines suivantes.

  - key: general.css2023.survey_intro
    t: |
      Pour vous aider à suivre les nouveautés comme `:has()`, `@container` et toutes les autres fonctionnalités CSS, nous lançons cette année notre propre nouveauté : la **liste de lecture**.

      Pendant l'enquête, vous pourrez ajouter à vos favoris les fonctionnalités qui vous intéressent et en apprendre davantage après avoir envoyé vos réponses.

      Cette année, [Chen Hui Jing](https://chenhuijing.com/) a dirigé la conception de l'enquête, dans la continuité du travail de [Lea Verou](https://lea.verou.me/) l'année dernière. Comme toujours, vos réponses aideront les éditeurs de navigateurs à définir leurs priorités et à améliorer la compatibilité entre navigateurs.

      Ceci étant dit, voyons comment le CSS a évolué jusqu'ici en 2023 !
