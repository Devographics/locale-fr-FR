  - key: picks.kilian_valkhof.name
    t: Interop 2022
  - key: picks.kilian_valkhof.bio
    t: Développeur web et créateur de Polypane
  - key: picks.kilian_valkhof.description
    t: |
      Depuis le lancement de l'initiative « Compat 2021 » en 2021, les éditeurs de moteurs de navigation
