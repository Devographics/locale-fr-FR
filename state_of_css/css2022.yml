    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_css2022.description
    t: Toutes les données collectées seront rendues publiques. Elles constitueront alors une ressource tant pour les développeurs, qui les consulteront afin d'orienter leurs choix technologiques, que pour les éditeurs de navigateurs, qui s'en serviront pour définir leurs priorités et orienter leurs feuilles de route.

  - key: general.css2022.survey_intro
    t: |
      Le CSS continue d'évoluer à un rythme sans précédent. Heureusement, cette année, nous avons pu compter sur l'aide d'une personne à la pointe de toutes ces évolutions : [Lea Verou](https://lea.verou.me/) a pris l'initiative de sélectionner les questions de cette année, en mettant particulièrement l'accent sur les fonctionnalités CSS nouvelles et à venir.

      De plus, les résultats de l'enquête aideront également les éditeurs de navigateurs à hiérarchiser leurs feuilles de route et à œuvrer pour une meilleure compatibilité entre les navigateurs.

      Cela étant dit, voyons comment le CSS a évolué en 2022 !
