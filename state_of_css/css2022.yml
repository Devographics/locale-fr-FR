  # Awards
  ###########################################################################

  - key: award.feature_adoption_delta_award.comment
    t: |
      La propriété `gap` de Flexbox est un ajout tellement utile qu'il n'est pas surprenant
      qu'elle connaisse une progression **{value}** en 2022

  # - key: award.tool_usage_delta_award.comment
  #   t: No other tool comes even close to Tailwind CSS's dramatic **{value}** progression over the last year.

  - key: award.most_commented_feature_award.comment
    t: En ce qui concerne les commentaires **{value}**, aucune autre fonctionnalité n'a suscité autant de réactions que Subgrid.

  - key: award.tool_satisfaction_award.comment
    t: |
      Parmi toutes les solutions CSS-in-JS, CSS Modules est la seule à avoir conservé un
      taux de rétention **{value}** extrêmement élevé.

  # - key: award.tool_interest_award.comment
  #   t: Avec un rapport **{value}**, les modules CSS ont une nouvelle fois suscité le plus d'intérêt parmi les développeurs CSS cette année.

  - key: award.most_write_ins_award.comment
    t: |
      Avec **{value}** mentions, le navigateur Arc a été, et de loin, l'outil le plus souvent cité dans les réponses libres.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2022
    t: |
      <span class="first-line">[L'année dernière](https://2021.stateofcss.com/en-US/conclusion/), Kilian avait prédit que la manière dont nous écrivons le CSS était sur le point de changer pour toujours, et les résultats de cette année confirment sa prédiction.</span>

      [Interop 2022](https://wpt.fyi/interop-2022) a réuni les navigateurs autour d’objectifs communs, et plusieurs fonctionnalités sont passées de « cela n’arrivera jamais » à « c’est désormais une réalité ». Les sélecteurs parents (`:has()`) et les requêtes de conteneur (`@container`) sont deux exemples majeurs dans cette catégorie. Pendant des années, on a martelé aux développeurs que ces fonctionnalités ne pouvaient pas voir le jour en raison de leurs implications en termes de performances, mais il s’est avéré que les deux étaient possibles.

      Le subgrid, en revanche, a toujours figuré dans la feuille de route ; il s’agissait simplement d’un travail colossal. Il est désormais pris en charge à la fois par Firefox et Safari, et est en cours d’implémentation active dans Chrome ; nous devrions donc assister à une utilisation beaucoup plus répandue l’année prochaine.

      Je prédis que les vedettes de 2023 seront l’imbrication native et la manipulation des couleurs.
      L’imbrication est actuellement [la principale raison](https://twitter.com/leaverou/status/806936438797307904) pour laquelle les gens utilisent encore des préprocesseurs ; pouvoir donc s’en servir de manière native sera une véritable libération.

      L'utilisation des couleurs en CSS est également sur le point de devenir bien plus passionnante. Une multitude de fonctionnalités sont en cours d’implémentation à l’heure où nous parlons. D’ici fin 2023, nous pourrons probablement compter sur des couleurs à large gamme chromatique et des couleurs indépendantes du périphérique (`color()`, `lab()`, `lch()`, `oklab()`, `oklch()`), et nous serons en mesure de les manipuler de manière basique grâce à `color-mix()`.

      Tout cela signifie que 2023 s’annonce comme une année très passionnante pour le CSS. J’attends avec impatience toutes les implémentations exceptionnelles à venir, que mes prédictions s’avèrent exactes ou non. Quelle période fantastique pour écrire du CSS !

  - key: conclusion.css2022.bio
    t: Membre du groupe d'architecture technique du W3C, MIT CSAIL

  ###########################################################################
  # Picks
  ###########################################################################

  - key: picks.my_pick.css2022
    t: "Mon choix pour 2022 : "
  - key: picks.intro
    t: Nous avons demandé aux membres de la communauté CSS de nous faire part de leur « coup de cœur de l'année »

  - key: picks.david_east.name
    t: Sous-grille CSS
  - key: picks.david_east.bio
    t: Plaider en faveur du développement sur le Web
  - key: picks.david_east.description
    t: |
      La fonctionnalité « Subgrid » de CSS permet aux éléments enfants d'hériter des propriétés de grille de leurs éléments parents.
      Bientôt, il sera beaucoup plus facile d'aligner les éléments sur les mêmes lignes de grille
      sur l'ensemble de la page.

  - key: picks.bramus_van_damme.name
    t: Le sélecteur `:has()`
  - key: picks.bramus_van_damme.bio
    t: Ingénieur chargé des relations avec les développeurs Chrome chez Google
  - key: picks.bramus_van_damme.description
    t: |
      Vous le connaissez peut-être sous le nom de « sélecteur parent », mais ce terme ne lui rend
      pas justice, car il ne reflète qu’une infime partie de ses capacités.
      Ce sélecteur a profondément bouleversé ma façon d’écrire mon CSS.

  - key: picks.kevin_j_powell.name
    t: Jhey Tompkins
  - key: picks.kevin_j_powell.bio
    t: Évangéliste CSS
  - key: picks.kevin_j_powell.description
    t: |
      Jhey repousse sans cesse les limites de ce qu'il est possible de faire avec le CSS grâce à
      des démos et des Codepens à la fois ludiques et impressionnants. Avec toutes les nouvelles fonctionnalités récemment intégrées au CSS,
      Jhey est à l'avant-garde pour expliquer leur fonctionnement.

  - key: picks.samuel_kraft.name
    t: Le sélecteur `:has()`
  - key: picks.samuel_kraft.bio
    t: Ingénieur en conception
  - key: picks.samuel_kraft.description
    t: |
      Le nouveau sélecteur :has() est extrêmement puissant et ouvre la voie à de nouvelles possibilités de mise en forme.
      Cet excellent article de Jen Simmons l'explique en détail à l'aide d'explications et d'exemples concrets.

  - key: picks.josh_comeau.name
    t: CSS moderne
  - key: picks.josh_comeau.bio
    t: Développeur de logiciels et formateur
  - key: picks.josh_comeau.description
    t: |
      Le CSS a beaucoup évolué ces dernières années.
      Stéphanie nous montre comment tirer parti des fonctionnalités modernes du CSS
      pour résoudre d'anciens problèmes de manière innovante.

  - key: picks.adam_argyle.name
    t: Le sélecteur `:has()`
  - key: picks.adam_argyle.bio
    t: Développeur UI/CSS - Relations avec les développeurs chez Google
  - key: picks.adam_argyle.description
    t: |
      Le CSS est tout simplement encore plus performant pour orchestrer les interactions de l'interface utilisateur entre les différents composants.
      Nous n'avons fait qu'effleurer la surface de l'impact de `:has()` sur nos styles.

  - key: picks.eric_w_bailey.name
    t: “Style with Stateful, Semantic Selectors” par Ben Myers
  - key: picks.eric_w_bailey.bio
    t: Militant pour l'accessibilité et passionné de CSS
  - key: picks.eric_w_bailey.description
    t: |
      Ben montre comment l'utilisation des sélecteurs d'attributs ARIA
      permet de lier de manière simple et efficace l'apparence à l'état.

  - key: picks.michelle_barker.name
    t: Interop 2022
  - key: picks.michelle_barker.bio
    t: Auteur et créateur du blog consacré au front-end « CSS { In Real Life } »
  - key: picks.michelle_barker.description
    t: |
      Interop est une initiative collaborative réunissant tous les principaux éditeurs de navigateurs,
      qui se sont mis d'accord sur 15 axes prioritaires à mettre en œuvre —
      notamment de nouvelles fonctionnalités CSS révolutionnaires telles que les « container queries »,
      les « cascade layers » et les fonctions de couleur.

  - key: picks.gift_egwuenu.name
    t: Apprendre le CSS
  - key: picks.gift_egwuenu.bio
    t: Chargé de la promotion auprès des développeurs chez Cloudflare
  - key: picks.gift_egwuenu.description
    t: |
      La ressource que je recommande à tous ceux qui souhaitent apprendre le CSS en partant de zéro ;
      je m'en sers également comme référence chaque fois que j'ai besoin de consulter une propriété CSS.

  - key: picks.ahmad_shadeed.name
    t: Requêtes de conteneurs
  - key: picks.ahmad_shadeed.bio
    t: Auteur de [Debugging CSS](https://debuggingcss.com/), rédacteur sur [ishadeed.com](http://ishadeed.com)
  - key: picks.ahmad_shadeed.description
    t: |
      Si je devais choisir un moment fort de 2022, ce serait les « container queries » !
      Elles sont enfin disponibles dans les navigateurs stables près de chez vous

  # - key: picks.georgedoescode.name
  #   t:
  # - key: picks.georgedoescode.bio
  #   t:
  # - key: picks.georgedoescode.description
  #   t: |

  - key: picks.jen_simmons.name
    t: Le sélecteur `:has()`
  - key: picks.jen_simmons.bio
    t: Chargé de promotion des technologies web chez Apple
  - key: picks.jen_simmons.description
    t: |
      Pendant deux décennies, le « sélecteur de parent » a été l'une des fonctionnalités les plus demandées pour les CSS.
      Puis, en 2022, à la grande surprise générale, la pseudo-classe :has() a fait son apparition pour résoudre ce problème et bien d'autres encore.

  - key: picks.sara_soueidan.name
    t: Le sélecteur `:has()`
  - key: picks.sara_soueidan.bio
    t: Ingénieur indépendant spécialisé dans la conception inclusive
  - key: picks.sara_soueidan.description
    t: |
      Cela fait si longtemps que nous attendions avec impatience les requêtes de conteneur CSS.
      Mais peu après, `:has()` a fait son apparition,
      et on a eu l'impression que c'était « tout ce dont on n'avait jamais soupçonné avoir toujours rêvé ».

  - key: picks.adam_wathan.name
    t: Variables CSS vides
  - key: picks.adam_wathan.bio
    t: Créateur de Tailwind CSS
  - key: picks.adam_wathan.description
    t: |
      Peu de gens le savent, mais « --my-var: ; » est un code CSS tout à fait valide,
      et c'est bien plus utile que vous ne le pensez.
      Nous l'utilisons tout le temps dans Tailwind CSS pour permettre
      de décomposer une seule propriété CSS en plusieurs classes.

