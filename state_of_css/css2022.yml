  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.css2022
    t: >
      L'enquête « State of CSS » 2022 s'est déroulée du 1er octobre au 1er novembre 2022 et a recueilli 14 310 réponses. Cette enquête est menée par moi-même, [Sacha Greif](https://sachagreif.com/), avec l'aide d'une équipe de contributeurs open source et de consultants.

      Le logo et le t-shirt de cette année sont les mêmes que ceux de l’année dernière, qui avaient été conçus et animés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l’enquête

      Cette enquête, tout comme celle intitulée [State of JavaScript](https://stateofjs.com/), a été créée pour identifier les tendances à venir dans l’écosystème du développement web afin d’aider les développeurs à faire leurs choix technologiques.

      À ce titre, ces enquêtes visent à anticiper ce qui va se passer au cours des prochaines années plutôt qu’à analyser ce qui est populaire aujourd’hui ; c’est pourquoi les fonctionnalités ou technologies actuellement les plus répandues n’y figurent pas toujours.

      De plus, les données de l’enquête sont également utilisées par les éditeurs de navigateurs pour hiérarchiser les fonctionnalités et orienter des initiatives telles que [Interop 2022](https://wpt.fyi/interop-2022).

      ### Conception de l’enquête

      Cette année, la conception de l’enquête a été dirigée par [Lea Verou](https://lea.verou.me/) grâce à une subvention de l’équipe Google Chrome, et gérée publiquement [sur GitHub](https://github.com/orgs/Devographics/projects/1). Toutes les questions de l’enquête étaient facultatives.

      De plus, à l’avenir, nous coordonnerons également la conception, la révision et les retours d’expérience concernant l’enquête via une [liste de diffusion du groupe de travail](https://www.devographics.com/working-group/).

      ### Public cible de l'enquête

      L'enquête était accessible à tous en ligne et les participants n'ont fait l'objet d'aucun filtrage ni d'aucune sélection. Le public était principalement composé d'anciens participants aux enquêtes précédentes (informés via une liste de diffusion dédiée) et de personnes provenant des réseaux sociaux.

      ### Financement du projet

      Le financement de ce projet provient de diverses sources :

      - **Ventes de t-shirts**.

      - **Liens sponsorisés** : les liens vers des ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Graphiques sponsorisés** : depuis l’année dernière, tout le monde peut désormais choisir de sponsoriser directement un graphique à partir de 10 $ et voir son avatar Twitter s’afficher à côté de celui-ci.

      - **Google** : cette année, l’équipe de [Google Chrome](https://www.google.com/chrome/) a alloué un budget pour engager Lea afin qu’elle aide à concevoir l’enquête, et m’a également financé directement pour soutenir mon travail.

      - **Nijibox** : la société japonaise [Nijibox](https://nijibox.jp/) a également gracieusement accepté de parrainer mes efforts afin de contribuer à rendre ces enquêtes annuelles plus durables.

      ### Présentation technique

      Vous trouverez une présentation technique plus détaillée du fonctionnement des enquêtes [ici](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb). Notre code est [open source](https://github.com/Devographics/Monorepo/).

      - **Collecte des données** : application [Next.js](https://nextjs.org/) hébergée sur [Vercel](https://vercel.com/).

      - **Stockage et traitement des données**: MongoDB et les agrégations MongoDB fonctionnant sur [MongoDB Atlas](https://cloud.mongodb.com/).

      - **API de données** : API GraphQL Node.js fonctionnant sur [Render](https://render.com/).

      - **Site de résultats** : application React [Gatsby](https://www.gatsbyjs.com/) fonctionnant sur [Netlify](https://netlify.com/).

      - **Visualisations de données** : bibliothèque React de visualisation de données [Nivo](https://nivo.rocks/).

      - **Polices** : [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) et [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue).

      ### Commentaires

      - [Signaler un problème technique](https://github.com/Devographics/Monorepo/issues)
      - [Faire une suggestion pour l'année prochaine](https://github.com/Devographics/surveys/issues/66)
      - [Autres problèmes non techniques](https://github.com/Devographics/surveys/issues)
      - [Rejoignez notre Discord](https://discord.gg/tuWRUWVyJs)
      - [Rejoignez le groupe de travail Devographics](https://www.devographics.com/working-group/) pour participer à la conception et à la révision des futures enquêtes.

