  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description
    t: L'édition 2022 de l'enquête annuelle sur les dernières tendances de l'écosystème CSS.

  - key: general.css2022.js2022_banner
    t: L'enquête « State of JS 2022 » est actuellement ouverte, vous pouvez [y répondre dès maintenant](https://survey.devographics.com/survey/state-of-js/2022?source=css2022) !

  - key: general.css2022.results_intro
    t: |
      Le CSS ne cesse d'évoluer à un rythme sans précédent. Non seulement de nouvelles fonctionnalités et propriétés voient le jour, mais les fondements mêmes du langage sont repensés et améliorés grâce à des innovations telles que l'imbrication et les couches en cascade.

      Heureusement, cette année, nous avons pu compter sur l’aide d’une personne à l’avant-garde de tous ces changements : [Lea Verou](https://lea.verou.me/), membre du groupe de travail du W3C, a sélectionné les questions de l’enquête de cette année, en mettant particulièrement l’accent sur les fonctionnalités CSS nouvelles et à venir.

      De plus, les résultats de l’enquête aideront également les éditeurs de navigateurs à hiérarchiser leurs feuilles de route et à œuvrer pour une meilleure compatibilité entre les navigateurs.

      Cela étant dit, voyons comment le CSS a évolué en 2022 !

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.css2022
    t: |
      <span class="first-letter">O</span>n pensait que le CSS était déjà devenu un langage assez redoutable grâce à des avancées telles que Flexbox, Grid et les variables CSS. Mais il s’avère que ce n’était même pas encore sa forme définitive.

      Sélecteur parent, imbrication native, requêtes de conteneur, couches en cascade… La liste des fonctionnalités qui vont bientôt changer la donne est assez impressionnante quand on y réfléchit.

      Heureusement, nous disposons du meilleur guide que l’on puisse imaginer pour nous aider à naviguer dans ces eaux : [Lea Verou](http://lea.verou.me/) a pris la tête de la conception de l’enquête de cette année, et le résultat est une enquête qui, nous l’espérons, couvrira toutes les innovations clés que vous devez connaître.

      <span class="conclusion__byline">– Sacha Greif</span>

      P.S. Autre nouveauté cette année : nous avons donné aux participants la possibilité de **laisser des commentaires** sur n’importe quelle fonctionnalité ou bibliothèque mentionnée dans l’enquête ! N’oubliez pas de consulter ces commentaires dans la barre latérale de chaque graphique.

