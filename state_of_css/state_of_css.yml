translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_css.intro
    t: |
      Le CSS évolue plus vite que jamais.

      Flexbox, Grid, multicolonnes… Sans même parler de nouveaux paradigmes comme le CSS-in-JS.

      C'est là qu'intervient l'enquête State of CSS : nous explorons l'univers des styles et des sélecteurs pour repérer les tendances à venir et déterminer quelles fonctionnalités et quels outils apprendre ensuite !

  - key: general.state_of_css.description
    t: L'enquête annuelle auprès des développeurs sur les dernières tendances du CSS

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: sections.tshirt.title
    t: T-shirt

  - key: sections.tshirt.description
    t: |
      ## Soutenez l'enquête avec le t-shirt State of CSS

      Entre la mauvaise qualité vidéo, les grosses cassettes et l'obligation de rembobiner, l'époque du VHS ne nous manque pas beaucoup. Mais les superbes visuels des années 90 qui ornaient les cassettes vierges, eux, nous manquent vraiment.

      Grâce au talent de Christopher Kirk-Nielsen, vous pouvez désormais profiter de toute cette esthétique rétro tout en affichant votre amour du CSS !

  - key: tshirt.about
    t: À propos du t-shirt

  - key: tshirt.description
    t: |
      Nous utilisons un t-shirt ajusté, de grande qualité et très doux, en mélange de trois matières, imprimé par notre partenaire Cotton Bureau.

  - key: tshirt.getit
    t: Le commander

  - key: tshirt.price
    t: 29 $US + frais de port

  - key: tshirt.designer.heading
    t: À propos du designer

  - key: tshirt.designer.name
    t: Christopher Kirk-Nielsen

  - key: tshirt.designer.bio
    t: |
      Originaire de France et désormais installé aux États-Unis, Chris est non seulement un excellent développeur front-end, mais aussi un illustrateur talentueux spécialisé dans les visuels rétro. Découvrez également [ses autres créations de t-shirts](https://chriskirknielsen.com/designs) !

