  # CSS

  - key: faq.data_used_css
    t: Comment ces données seront-elles utilisées ?
  - key: faq.data_used_css.description
    t: >
      Toutes les données recueillies seront publiées librement afin que les développeurs et les entreprises puissent les consulter.
      Les éditeurs de navigateurs [utilisent également ces données](https://web.dev/interop-2023/) pour définir leurs priorités et orienter leurs feuilles de route.

  - key: faq.who_should_take_survey_css
    t: Qui devrait répondre à cette enquête ?
  - key: faq.who_should_take_survey_css.description
    t: >
      Cette enquête est ouverte à toute personne qui écrit du CSS, régulièrement
      ou occasionnellement, dans le cadre de son travail, de ses études ou simplement pour le plaisir !

  - key: faq.survey_goals_css
    t: Quel est l'objectif de cette enquête ?
  - key: faq.survey_goals_css.description
    t: >
      L'objectif de l'enquête est de suivre l'évolution des fonctionnalités et des bibliothèques à venir,
      et d'aider les développeurs à choisir les nouvelles technologies sur lesquelles se concentrer.
