  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.css2021
    t: |
      <span class="first-line">La façon dont vous écrivez le CSS est sur le point de changer pour toujours</span>

      Depuis de nombreuses années déjà, bon nombre d’innovations en matière de styles pour le Web ont vu le jour ailleurs : dans les préprocesseurs, les frameworks JavaScript ou les compilateurs. Certes, le CSS lui-même a également bénéficié de quelques améliorations bienvenues, comme [aspect-ratio](https://developer.mozilla.org/en-US/docs/Web/CSS/aspect-ratio) ou [les propriétés personnalisées](https://developer.mozilla.org/en-US/docs/Web/CSS/--*). Pourtant, nous continuons à recourir quotidiennement à des bibliothèques et autres outils d’aide.

      Mais un changement se profile. Le langage CSS de base est en pleine refonte et nous sommes en première ligne de cette évolution accélérée.

      Les [Container Queries](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Container_Queries) vont inaugurer une ère entièrement nouvelle dans le domaine du responsive design, tandis que les [Cascade Layers](https://developer.mozilla.org/en-US/docs/Web/CSS/@layer) faciliteront considérablement notre utilisation des frameworks, la création de thèmes et la gestion de bases de code complexes.

      Si l’on se projette un peu plus loin, on peut également entrevoir l’arrivée de la [condition @when/else](https://css-tricks.com/proposal-for-css-when/), qui nous permettra de combiner les requêtes media, container et supports en une seule règle « at-rule ».

      Et si tout va bien, 2022 sera l’année où nous verrons enfin des avancées en matière d’imbrication native du CSS. Ceux d’entre nous qui travaillent avec des outils comme Sass et PostCSS ne pourraient déjà plus imaginer travailler autrement.

      Et, si tout va bien, 2022 sera l’année où nous verrons enfin des avancées en matière d’imbrication native du CSS. Ceux d’entre nous qui utilisent des outils comme Sass et PostCSS ne pourraient déjà plus imaginer travailler autrement.

      Tout cela signifie que 2022 sera probablement une année où la façon dont vous écrivez le CSS va changer radicalement. C’est une période incroyablement passionnante, et nous attendons avec impatience toutes les implémentations exceptionnelles qui verront le jour au cours de l’année à venir.

  - key: conclusion.css2021.bio
    t: Développeur web et créateur de Polypane

