  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.css2021
    t: >
      L'enquête « State of CSS » 2021 s'est déroulée du 5 octobre au 2 novembre 2021 et a recueilli 8 714 réponses. Cette enquête est menée par moi-même, [Sacha Greif](https://sachagreif.com/), avec l'aide d'une équipe de contributeurs open source et de consultants.


      Le logo et le t-shirt de cette année ont été conçus et animés par [Christopher Kirk-Nielsen](http://chriskirknielsen.com/).

      ### Objectifs de l'enquête

      Cette enquête, tout comme celle intitulée [State of JavaScript](https://stateofjs.com/), a été créée pour identifier les tendances à venir dans l'écosystème du développement web afin d'aider les développeurs à faire leurs choix technologiques.


      À ce titre, ces enquêtes visent à anticiper ce qui va se passer au cours des prochaines années plutôt qu’à analyser ce qui est populaire aujourd’hui ; c’est pourquoi les fonctionnalités ou technologies actuellement les plus répandues n’y figurent pas toujours.

      ### Conception de l’enquête

      L’enquête a été conçue en partie sur la base de celle de l’année dernière, avec une période de consultation ouverte au cours de laquelle le plan de l’enquête a été discuté [sur GitHub](https://github.com/StateOfJS/StateOfCSS-2020/issues/8).

      Toutes les questions de l’enquête étaient facultatives.

      ### Public cible de l’enquête

      L’enquête était librement accessible en ligne et les participants n’ont fait l’objet d’aucun filtrage ni d’aucune sélection. Le public était principalement composé d’anciens participants à des enquêtes précédentes (informés via une liste de diffusion dédiée) et de personnes provenant des réseaux sociaux.

      ### Représentativité et inclusivité

      Bien que nous estimions qu’il est important de donner la parole à chaque communauté, la réalité est qu’une enquête ouverte comme celle-ci aura toujours du mal à représenter correctement tout le monde, en particulier lorsqu’elle s’appuie sur des systèmes qui comportent déjà leurs propres biais inhérents.


      Afin de contrebalancer cela, nous mettons en œuvre trois stratégies distinctes :


      - **Sensibilisation** : cette année, nous avons contacté 23 organisations représentant des développeurs BIPOC et LGBTQ dans l’espoir de nouer des partenariats. Bien que très peu d’entre elles aient répondu, nous continuerons à chercher des moyens d’aller au-delà de notre public actuel.

      - **Analyse des données** : grâce à des fonctionnalités telles que les facettes et les variantes, nous nous efforçons en permanence de faciliter la mise en avant des voix de n’importe quel segment démographique, aussi minoritaire soit-il dans nos données.

      - **Réduction des obstacles** : un questionnaire trop long, inaccessible, lent à charger, disponible uniquement en anglais, etc., peut imposer un « coût d’effort » qui exclut les membres de la communauté qui ne peuvent pas se le permettre. Résoudre ces problèmes permet de réduire les barrières à l’entrée et, ce faisant, de diversifier notre public.

      ### Financement du projet

      Le financement de ce projet provient de diverses sources :


      - **Ventes de t-shirts**.

      - **Liens sponsorisés** : les liens vers les ressources recommandées au bas de chaque page sont fournis par notre partenaire [Frontend Masters](https://frontendmasters.com/).

      - **Autres sources de financement** : cette année, l’équipe de [Google Chrome](https://www.google.com/chrome/) a alloué un petit budget pour aider à recruter un [consultant en accessibilité](https://fossheim.io/) chargé de travailler sur l’enquête.


      Malgré ces sources de financement, l’enquête reste globalement un projet autofinancé et toute contribution ou tout parrainage serait grandement apprécié. J’aimerais tout particulièrement travailler en étroite collaboration avec davantage de fournisseurs de navigateurs, car ils jouent un rôle central dans l’écosystème du Web.

      ### Présentation technique

      Vous trouverez une présentation technique plus détaillée du fonctionnement des enquêtes [ici](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb).

      - **Collecte des données** : application personnalisée [Vulcan.js](http://vulcanjs.org/).

      - **Stockage/traitement des données** : MongoDB et agrégations MongoDB.

      - **API de données** : API GraphQL sous Node.js.

      - **Site de résultats** : application React [Gatsby](https://www.gatsbyjs.com/).

      - **Visualisations de données** : bibliothèque React de visualisation de données [Nivo](https://nivo.rocks/).

      - **Polices** : [IBM Plex Mono](https://fonts.google.com/specimen/IBM+Plex+Mono) et [Bebas Neue](https://fonts.google.com/specimen/Bebas+Neue).

  - key: general.css2021.survey_intro
    t: |
      Salut CSS, qu’est-ce que tu as fait ces derniers temps ? Ah vraiment, `@container` ? Ah oui, et
      le dimensionnement intrinsèque ? Et `@property` aussi ?! Waouh, tu n’as pas chômé !

      Même si la pandémie n’a cessé de compliquer la vie de tout le monde tout au long de l’année 2021, d’une manière ou d’une autre,
      des contributeurs dévoués du monde entier ont réussi à faire avancer le CSS.
      Il est donc à nouveau temps de faire le point sur l’écosystème CSS et de déterminer
      où tout cela nous mène. Et peut-être d’en apprendre quelques nouveautés par la même occasion !
