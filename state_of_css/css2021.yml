  ###########################################################################
  # Introduction
  ###########################################################################

  - key: general.results.description
    t: L'édition 2021 de l'enquête annuelle sur les dernières tendances de l'écosystème CSS.

  - key: introduction.css2021
    t: |

      <span class="first-letter">D</span>es menuisiers doivent-ils apprendre une nouvelle méthode, plus efficace, pour scier une planche tous les deux ans ? Les peintres ont-ils l’impression d’être des imposteurs parce qu’ils utilisent encore de la peinture à l’huile ? Ou est-ce seulement nous, les développeurs front-end, qui vivons cet état de changement constant ?

      Avec l’arrivée imminente des « container queries » et bien d’autres nouveautés, les choses évoluent décidément à un rythme effréné. Et comme nous devons nous aussi suivre le mouvement, nous avons pris le temps d’apporter quelques nouvelles fonctionnalités à ces résultats d’enquête !

      Concrètement, cela signifie que nous pouvons désormais croiser deux ensembles de données, par exemple les salaires annuels en fonction du niveau d’expérience, ou le genre par pays. Vous trouverez certaines de ces ventilations dans les résultats, mais nous vous encourageons à explorer davantage les données à l’aide de [notre API](https://api.stateofjs.com/) ou en [téléchargeant nos données](https://www.kaggle.com/sachag/state-of-css). N’hésitez pas à nous faire savoir si vous créez vos propres visualisations de données !

      Et maintenant, voyons ce que CSS a donné cette année !

      *Remarque : nous avons dû reporter l’enquête [State of JavaScript](http://stateofjs.com/) 2021 à janvier 2022 par manque de temps. Rendez-vous après les fêtes !*

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description
    t: |
      L'enquête de cette année a permis de recueillir les réponses de **8 714** développeurs à travers le monde.

  - key: sections.features.description
    t: |
      Le dynamisme du CSS ne semble pas près de s'essouffler, les développeurs s'efforçant d'adopter la
      nouvelle vague de fonctionnalités tout en attendant avec impatience encore plus d'innovations dans les années à venir.

  - key: sections.technologies.description
    t: |
      Avec près de 50 % des personnes interrogées qui utilisent volontiers une ou plusieurs bibliothèques CSS-in-JS, on peut affirmer sans risque que
      cette catégorie a réussi à se tailler une place. Peut-être que les deux camps du monde du front-end ne sont
      pas si éloignés l'un de l'autre, après tout ?

  - key: sections.tools_others.description
    t: |
      Le choix d'une technologie se résume souvent à une série de choix difficiles entre
      des priorités contradictoires, et cette année, nous avons tenté de rendre compte de ce processus à l'aide d'un nouveau format de question à choix multiples par paires.

  - key: sections.environments.description
    t: |
      L'accessibilité a longtemps été reléguée au second plan dans le domaine du développement web, mais de nombreux développeurs
      prennent désormais conscience qu'elle devrait en réalité constituer le fondement sur lequel repose tout le reste.

  - key: sections.resources.description
    t: |
      Mettre en avant des blogs, des podcasts et des sites, c'est bien, mais cette année, nous avons décidé d'aller plus loin
      et de mettre véritablement à l'honneur les personnes qui composent la communauté CSS !

  - key: sections.opinions.description
    t: |
      Qu'il s'agisse de problèmes qui vous freinent aujourd'hui ou de fonctionnalités manquantes que vous espérez pouvoir utiliser
      demain, c'était l'occasion pour vous de vous défouler et de faire part de vos griefs à CSS !

